notes:
- 'Manual de usuário Arduino Mega 2560 Rev3 (SKU A000067), 17 páginas, "Modified: 13/11/2026". O nome da fila era "Arduino Mega"/"2560" (campos trocados); part_number corrigido para Arduino Mega 2560 Rev3.'
- 'Tensão de entrada pela USB: 4,8 mín. / 5,0 típ. / 5,5 máx. V (pág. 5). Regulador linear de 5 V a bordo (pág. 6); há também 3,3 V.'
- O texto não traz corrente por pino de E/S nem resolução do A/D; EEPROM de 4 kB; 4 USART; ATmega16U2 como interface USB-serial (págs. 2 e 7).
- 'Pág. 2: "Four 8-bit PWM Channels" no ATmega2560, e "15 PWM Output" nas E/S da placa; usado 15 (E/S da placa).'
