notes:
- 'Manual de usuário Arduino Nano (SKU A000005), 14 páginas, "Modified: 13/11/2026". O nome da fila era "Arduino"/"Nano" (campos trocados); part_number corrigido para Arduino Nano.'
- 'Alimentação: USB mini-B, 7-15 V não regulados no pino 30 ou 5 V regulados no pino 27 (pág. 2); o VIN passa por LDO e a tensão fica limitada a 5 V; há outro regulador de 3,3 V (pág. 7).'
- Seção 2.1 (condições recomendadas) e 2.2 (consumo) do documento só trazem a faixa térmica de -40 a 85 °C; consumo marcado "TBC". Não há corrente por pino nem resolução do A/D no texto extraído.
- Comunicação serial UART TTL (5 V), I2C (TWI) e SPI (pág. 7); EEPROM de 1 kB; 16 MIPS a 16 MHz (pág. 2).
