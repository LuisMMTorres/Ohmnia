manufacturer: Infineon
package: D2Pak
lifecycle: desconhecido
notes:
- O documento é do IRG4BC30W-SPbF (D2Pak); o part number da fila IRG4BC30W pode ser outro encapsulamento (a conferir pelo revisor).
- 'Ptot a TC = 100 °C é 42 W (pág. 1). Perda total de comutação Ets 0.26 mJ típico, 0.35 mJ máx a 25 °C e 0.55 mJ a 150 °C (pág. 2); Eon e Eoff só são dados a 25 °C.'
- 'Condições dos tempos de comutação: TJ = 25 °C, IC = 12 A, VCC = 480 V, VGE = 15 V, RG = 23 ohm (pág. 2); a energia inclui a cauda ("tail").'
- Sem diodo antiparalelo no documento. VCE(on) tipicamente 2.10 V a VGE = 15 V, IC = 12 A (pág. 1).
