manufacturer: onsemi
family: FGA25N120ANTDTU
package: TO-3PN (TO-3P-3, case 340BZ)
lifecycle: obsoleto
notes:
- O documento traz a marca d'água de descontinuado e não recomendado para novos projetos (página 2). Código de pedido FGA25N120ANTDTU-F109, marca FGA25N120ANTD.
- IGBT com diodo antiparalelo no mesmo encapsulamento (parâmetros IF, VF, trr e Qrr são do diodo).
- Eon, Eoff, td(on), tr, td(off) e tf sem sufixo são do primeiro grupo de chaveamento da tabela (VCC = 600 V, IC = 25 A, RG = 10 ohm, VGE = 15 V, carga indutiva). O documento imprime TC = 125 C para os dois grupos, mas a página 1 dá Eoff típico 0,96 mJ a TC = 25 C; por isso a temperatura do primeiro grupo não foi registrada e deve ser conferida no PDF. O segundo grupo está como @hot (TC = 125 C, como impresso).
- A tabela imprime a unidade de energia como "mj" (lido como mJ).
