notes:
- 'Documento da série 2N5460/61/62; os valores abaixo são da coluna 2N5460 (as outras variantes têm faixas diferentes de VGS(off), VGS, IDSS e yfs na página 3).'
- 'Valores em módulo, como no esquema jfet.p. O datasheet imprime IDSS negativo (-1,0 a -5,0 mA) e as tensões do canal P sem sinal.'
- 'IGSS: o datasheet lista duas tensões (20 V e 30 V, também a 100 C) e dois valores máximos (5,0 nA e 1,0 uA); o pareamento entre valor e condição não ficou claro na tabela. Transcrito só 5,0 nA com VGS = 20 V (página 3).'
- 'Fora do esquema: ruído equivalente de entrada en típ. 60 / máx. 115 nV/raiz(Hz) (VDS = 15 V, VGS = 0, f = 100 Hz, BW = 1 Hz), página 3. VGS (polarização, ID = 0,1 mA) 0,5 a 4,0 V para o 2N5460, página 3.'
