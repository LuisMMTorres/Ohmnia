notes:
- 'Documento marcado "Obsolete Product(s)" (p. 1-3).'
- 'Alimentação simétrica: VS = ±6 a ±22 V (p. 3); os valores de VS abaixo estão em módulo (V por lado). Condições da Tabela 4: VS = ±16 V, Tamb = 25 °C, salvo indicação.'
- 'Po (p. 3): d = 0,5%, Gv = 26 dB, f = 40 a 15000 Hz; RL = 4 ohm: mín. 15 W, típ. 18 W; RL = 8 ohm: mín. 10 W, típ. 12 W; com VS = ±19 V e RL = 8 ohm: mín. 13 W, típ. 16 W.'
- 'Resistência térmica junção-cápsula máx. 3 °C/W (Tabela 2, p. 2) e temperatura de desligamento térmico típ. 145 °C (p. 3): sem símbolo no esquema.'
- 'Corrente de pico de saída (limitada internamente) 3,5 A; tensão de entrada diferencial máx. ±15 V (Tabela 3, p. 2). Largura de banda de potência típ. 100 kHz (Po = 15 W, RL = 4 ohm); slew rate típ. 8 V/us (p. 3).'
- 'Tj_max: o datasheet dá uma única faixa para "Tstg, Tj": -40 a +150 °C.'
