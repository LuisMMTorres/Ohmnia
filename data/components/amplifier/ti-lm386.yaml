manufacturer: Texas Instruments
family: LM386 (N-1, N-3, N-4, M-1, MM-1)
package: PDIP-8 (P), SOIC-8 (D), VSSOP-8 (DGK)
lifecycle: desconhecido
notes:
- 'Valores da série. VS e VS_max cobrem as duas faixas: VS 4 a 12 V (N-1, N-3, M-1, MM-1) e 5 a 18 V (N-4); VS_max 15 V (N-1/-3, M-1) e 22 V (N-4), página 4.'
- 'Po, Po@2 e Po@3 são das variantes N-1/M-1/MM-1, N-3 e N-4, respectivamente (página 5); Pd, Pd@2 e Pd@3 são para LM386N, LM386M e LM386MM-1 (página 4).'
- 'Ganho 26 dB (pinos 1 e 8 abertos) e 46 dB (10 uF entre os pinos 1 e 8), VS = 6 V, f = 1 kHz (página 5). O datasheet também lista ganhos de 20 a 200 em Features (página 1).'
- 'Fora do esquema (página 5, VS = 6 V): PSRR típ. 50 dB (f = 1 kHz, CBYPASS = 10 uF), corrente de polarização de entrada típ. 250 nA, entrada máxima +-0,4 V.'
