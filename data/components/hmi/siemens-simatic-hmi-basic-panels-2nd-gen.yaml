notes:
- 'Nome na fila: hmi basic panels 2nd gen operating instructions en-US; manual de operação da série, valores como faixa entre os modelos KTP400 Basic a KTP1200 Basic DP (seção 8.7, p. 116-119).'
- 'diagonal 4.3 a 12 pol; resolução 480 x 272 (KTP400), 800 x 480 (KTP700/KTP900), 1280 x 800 (KTP1200); res_x e res_y são as faixas da série.'
- 'P_cons de 3 W (KTP400 Basic) a 13.2 W (KTP1200 Basic DP); corrente constante máxima de aprox. 310 mA a 800 mA (p. 117, 119).'
- 'Top: 0 a 50 °C apenas em montagem horizontal (landscape) vertical; reduzida para 0-40, 0-35 °C conforme inclinação e orientação retrato (p. 107).'
- 'Memória: dados 256 MB, programa 512 MB (p. 116, 118). Interfaces: Ethernet RJ45 10/100 (modelos PN) ou RS422/RS485 PROFIBUS DP até 12 Mbps (modelos DP), USB 2.0 (p. 117, 119).'
