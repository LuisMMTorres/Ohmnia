# Fonte: TDK (EPCOS), Power line chokes, current-compensated ring core double chokes, Series/Type B82721A/J/K, July 2015.
part_number: B82721
category: inductor.fixed
schema_version: '1.0'
manufacturer: TDK
family: B82721A/J/K
package: Caixa plástica com potting, terminais 0,7 x 0,7 mm; versões horizontal (A) e vertical (J, K)
lifecycle: desconhecido
notes:
- Valores da série; faixa entre os modelos (0,2 a 47 mH, 0,3 a 6 A). Choke de modo comum (duplo, compensado em corrente) para 250 V CA.
- Indutância por enrolamento. No texto do PDF os cabeçalhos "µH" e "mΩ" aparecem corrompidos (PH, m:); a coluna Rtyp é a resistência típica em mΩ.
- O catálogo não dá corrente de saturação nem SRF; só a queda de indutância menor que 10 % com a corrente nominal.
