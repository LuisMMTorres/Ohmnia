notes:
- 'V-15-1C25 decodificado pela legenda: 15 A a 250 VAC, atuador pin plunger, contato SPDT, terminais quick-connect #250, força máx. de operação 1,96 N {200 gf}, resistência a calor padrão (80 C).'
- 'Cargas DC (V-15): 0,6 A a 125 VDC e 0,3 A a 250 VDC (carga resistiva).'
- 'Faixa de temperatura de operação: colunas da tabela de características estavam embaralhadas no texto; atribuída ao V-15 padrão (-25 a 105 C; versão resistente a calor -25 a 150 C). Conferir no PDF.'
- 'Dielétrico informado é entre terminais de mesma polaridade (1 min, com separador), comum a todos os modelos da tabela.'
