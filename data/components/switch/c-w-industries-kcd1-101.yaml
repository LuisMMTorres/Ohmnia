notes:
- A fila indica C&W Industries, mas o documento é da Jinghan Switch Electronic Co., Ltd (KCD1-101 series rocker switch); valores da série.
- 'Corrente nominal 6 A a 125 V e 10 A a 250 V (pág. 2); V_rated registra o maior valor (250 V).'
- Tipos de ação ON-OFF, ON-ON, ON-OFF-ON; arranjos de contato descritos SPST, SPDT, DPST e DPDT (pág. 1 e 2). Atuador de policarbonato, base de Nylon 66, contatos de cobre prateado / liga de prata (pág. 2).
