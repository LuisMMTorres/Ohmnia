notes:
- 'O documento descreve o modelo EC11E1534408 (vertical, eixo plano de 20 mm, sem detente, 15 pulsos, com chave de pressão); os valores são desse modelo, não de toda a série EC11.'
- 'Encoder incremental de duas fases A e B (pág. 1). Vida mecânica 15.000 ciclos (rotação) e 20.000 vezes (chave de pressão, após vida útil, pág. 2).'
- 'Chave de pressão: SPST, curso 1.5±0.5 mm, 0.1 A 5 V DC (mínimo 500 uA 5 V DC), resistência de contato inicial 100 mohm máx (pág. 1). Torque de rotação 7 (+3, -4) mN·m; ruído de deslizamento a R = 5 kohm: chattering 3 ms máx, bounce 2 ms máx (pág. 3).'
- Corrente de operação máx/mín (carga resistiva) 10 mA / 1 mA; rigidez dielétrica 300 V AC por 1 min ou 360 V AC por 2 s (pág. 1).
