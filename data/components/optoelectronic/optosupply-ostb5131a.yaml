# Fonte: OptoSupply, datasheet OSTB5131A 5mm Red & Blue & Pure Green LED (sem revisao indicada).
part_number: OSTB5131A
category: optoelectronic.led
schema_version: '1.0'
manufacturer: OptoSupply
package: 5 mm, lente transparente (water clear)
lifecycle: desconhecido
notes:
- LED 5 mm piscante (flashing) tricolor vermelho/verde puro/azul com oscilador interno de 0.8 Hz
- Alimentacao Vdd 4.5 a 6.0 V (tipico 5.0 V); corrente de operacao Iop tipica 10 mA, max 40 mA; corrente quiescente Isb 1 a 5 uA; corrente de acionamento Iol tipica 25 mA (p. 1, Electrical-Optical Characteristics); schema LED nao tem simbolos para esses itens
- Nao ha VF nem IF nos dados; Iv e lambda dados por cor a IF=20 mA (cor vermelha em lambda/Iv, verde em lambda@2/Iv@2, azul em lambda@3/Iv@3)
