# Fonte: Worldsemi, datasheet WS2812B Intelligent control LED integrated light source (sem revisao indicada).
part_number: WS2812B
category: optoelectronic.led
schema_version: '1.0'
manufacturer: Worldsemi
package: SMD 5050, 4 pinos (VDD, DOUT, VSS, DIN)
lifecycle: desconhecido
notes:
- LED RGB enderecavel com controle integrado (protocolo de um fio NZR, 24 bit GRB, 800 kbps); nao ha VF/IF no documento
- Alimentacao VDD maxima +3.5 a +5.3 V (Absolute Maximum Ratings, p. 2); condicoes eletricas com VDD 4.5 a 5.5 V, TA -20 a +70 C (p. 2-3)
- Entrada DIN VIH min 0.7 VDD, VIL max 0.3 VDD, histerese tipica 0.35 V; atraso de transmissao DIN-DOUT max 300 ns (p. 3)
- 'Tempos do codigo (p. 3): T0H 0.4 us, T1H 0.8 us, T0L 0.85 us, T1L 0.45 us, cada um com +/-150 ns; RES acima de 50 us'
- Lambda e Iv sao dos chips RGB (tabela RGB IC characteristic parameter, p. 3); Top e a temperatura de juncao de operacao
- lambda = vermelho, lambda@2 = verde, lambda@3 = azul; Iv, Iv@2, Iv@3 na mesma ordem
