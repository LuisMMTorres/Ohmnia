notes:
- 'Valores da série: a corrente nominal vai de 0,032 A a 15 A; o limite de interrupção varia conforme o modelo (tabela, pág. 2).'
- 'Tensão nominal de 250 V em todos os modelos da tabela (pág. 2); capacidade de interrupção de 35 A @ 250 VAC (0,032 A) até 150 A @ 250 VAC (15 A).'
- 'Resistência a frio nominal de 262,2 ohm (0,032 A) a 0,0040 ohm (15 A); I2t de fusão nominal de 0,00008 A2s a 607,135 A2s (pág. 2).'
- 'Dissipação máxima a 1,5 In: 1,6 W (até 2,5 A), 2,5 W (3,15 A a 6,3 A), 4 W (8 A a 15 A) (pág. 2).'
