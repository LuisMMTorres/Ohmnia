notes:
- 'Valores da série: a corrente nominal vai de 0,032 A a 16 A; o limite de interrupção varia conforme o modelo (pág. 2).'
- 'Tensão nominal de 250 V em todos os modelos da tabela (pág. 2); capacidade de interrupção de 35 A @ 250 VAC (0,032 A) a 100 A @ 250 VAC (10 A e 15 A); 63 A @ 250 VAC em 6,3 A, 12,5 A e 16 A.'
- 'Resistência a frio nominal de 48,258 ohm (0,032 A) a 0,0021 ohm (16 A); I2t de fusão nominal de 0,011 A2s a 1955 A2s (pág. 2).'
- 'Queda de tensão máxima na corrente nominal: de 5000 mV (0,032 A) a 100 mV (3,15 A a 16 A); dissipação máxima a 1,5 In de 1,6 W a 4 W (pág. 2).'
