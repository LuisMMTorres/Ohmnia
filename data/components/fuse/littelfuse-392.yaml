notes:
- 'Valores da série: 0,28 A a 6,3 A, 250 V (pág. 1). Capacidade de interrupção de 35 A @ 250 VAC (280 mA) a 63 A @ 250 VAC (6,3 A).'
- 'Resistência a frio nominal de 0,33 ohm (280 mA) a 0,0077 ohm (6,3 A), medida a 10 % da corrente nominal, 25 ºC; queda de tensão máxima a 1,0 x In de 115 mV a 65 mV.'
- 'Dissipação máxima a 1,5 x In de 168 mW (280 mA) a 1200 mW (6,3 A); integral de fusão a 10 x In de 0,048 A2s a 160,74 A2s (pág. 1).'
- 'Redução (re-rating) da corrente com a temperatura ambiente: ver curva na pág. 2, além do derating padrão de 25 % em operação contínua.'
