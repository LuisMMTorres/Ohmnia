# Fonte: NEC/Schott SEFUSE thermal cutoffs (Limitor GmbH), séries SF/E e SF/K, agosto 2007.
part_number: SF-E
category: fuse
schema_version: '1.0'
manufacturer: Schott
family: SF/E (NEC/Schott SEFUSE, corte térmico)
package: 'Axial, corpo de 4,2 mm de diâmetro, fios de 20/35 mm (SF/E) ou 35/35 mm (SF/E-1)'
lifecycle: desconhecido
notes:
- 'Corte térmico não rearmável (one shot), não é fusível de corrente; o schema fuse é a categoria mais próxima. Documento: Limitor GmbH, agosto 2007; cobre também SF/K, SM/A, SM/B e SM/G (somente a série SF/E foi transcrita).'
- 'Modelos SF/E (pág. 1): SF70E a SF240E; temperatura de abertura Tf de 73 °C (SF70E) a 240 °C (SF240E); temperatura de manutenção Th de 58 °C a 200 °C; Tmax de 150 °C a 375 °C, conforme o modelo.'
- 'Aprovações (pág. 1): VDE AC250 V 10 A + 15 A carga resistiva; UL AC120 V 20 A resistiva e 15 A indutiva, AC250 V 17 A e 277 V 15 A resistiva; CSA AC250 V 15 A resistiva e indutiva.'
- 'Contato interno em AgCuO (pág. 1). SF169E, SF188E, SF214E, SF226E e SF240E aprovados no UL Conductive Heat Aging Test (CHAT).'
