# Fonte: Littelfuse, Fuse Datasheet 215 Series 5x20 mm Time-Lag Fuse, Revised GD. 11/30/21.
part_number: '215'
category: fuse
schema_version: '1.0'
manufacturer: Littelfuse
family: 215 Series
package: cartucho cerâmico 5x20 mm (também versão com terminais axiais)
lifecycle: desconhecido
notes:
- 'Documento da série 215 (retardado, 125 mA a 20 A); os valores são a faixa entre os modelos, não de um único item. Série fornecida como cartucho e com terminais (pig-tail).'
- 'Capacidade de interrupção (pág. 2): 1500 A a 250 VAC para 0.125 A a 12 A, 500 A a 250 VAC para 15 A, 400 A a 250 VAC para 20 A; há exceções por aprovação (nota + da tabela: 1 A a 2 A: 100 A a 500 VAC; 4 A a 6.3 A: 100 A a 305 VAC e 1000 A a 72 VDC; 10 A: 1000 A a 300 VAC para cURus).'
- 'I2t nominal de fusão medido a 10x a corrente nominal (pág. 2); queda de tensão máxima (mV) e dissipação máxima a 1.5 In (1.6 W, 2.5 W ou 4 W conforme a faixa) estão na tabela, sem símbolo equivalente no esquema.'
- 'Tempo de abertura (pág. 1): a 150 % da corrente nominal mín 60 min (30 min para 8 A a 20 A); a 210 % máx 30 min; a 275 % 0.25 s a 80 s (0.75 s mín para 1 A em diante); a 400 % 0.05 a 5 s; a 1000 % 0.005 a 0.150 s (mínimo varia por faixa).'
