# Fonte: Eaton Bussmann series, Square body fuses 170M size 000 to 3, DIN 43620, dual indicator fuses; catálogo High Speed Fuse 10506 (jan. 2017; tabela na pág. 2 datada jan. 2016).
part_number: 170M
category: fuse
schema_version: '1.0'
manufacturer: Eaton
family: 170M (square body, tamanhos 000 a 3, DIN 43620)
package: Corpo quadrado com lâminas DIN 43620, tamanhos 000, 00, 1, 2, 3
lifecycle: desconhecido
notes:
- 'Valores da série (faixa entre os modelos 170M1558D ... 170M8557D). Detalhes elétricos: o catálogo remete às fichas 170K6386/6388/6390/6392 (pág. 1).'
- 'Tensão: 690 Vac (IEC) e 700 Vac (UL) (pág. 1). Corrente máxima de carga permissível menor que a nominal nos tamanhos 1 a 3 (ex.: 170M3808D 40 A nominal, 25 A máx. permissível) (pág. 2).'
- 'I2t: pré-arco de 4 A²s (170M1558D, 10 A) a 585 000 A²s (170M8557D, 1600 A); I2t de extinção a 690 Vac de 27 a 4 150 000 A²s (pág. 2). Perdas de 2,5 W (170M1558D) a 74 W (170M8557D), dadas na corrente nominal máxima (nota 3, pág. 2).'
- '170M4867D não é UL Recognized (nota 1, pág. 2). Dimensões por tamanho na tabela da pág. 1.'
