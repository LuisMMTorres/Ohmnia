notes:
- "Nome na fila: t8015en. Válvula de controle globo, versão DIN, operada com atuador pneumático Type 3271 (3241-1) ou Type 3277 (3241-7) (p. 1)."
- "P_max: classe de pressão nominal PN 10 a 40 (p. 1); a pressão admissível depende do diagrama pressão-temperatura (Information Sheet T 8000-2)."
- "Temperatura do fluido -196 a +450 °C (p. 1); versão padrão -10 a +220 °C (p. 2). Não é temperatura ambiente, por isso não entra em Top."
- "Kv: coeficientes KVS de 0,1 a 1500 (tabela 3, p. 6); a unidade não aparece no texto extraído, assumida m3/h como no schema; conferir. Rangeabilidade 50:1 (DN 15 a 50) e 30:1 (DN 65 a 150) (tabela 1, p. 4)."
- "Classe de vazamento IV (metal), VI (vedação macia) conforme DIN EN 60534-4 (p. 4)."
