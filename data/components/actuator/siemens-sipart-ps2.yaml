# Fonte: Siemens, SIPART PS2 6DR50..-6DR59.. with 4 to 20 mA/HART, Operating Instructions A5E00074631-AF, 10/2020 (cap. 12 Technical data).
part_number: SIPART PS2
category: actuator.valve
schema_version: '1.0'
manufacturer: Siemens
family: SIPART PS2 6DR50..-6DR59.. (4 a 20 mA/HART)
lifecycle: desconhecido
notes:
- "Nome na fila: sipart ps2 datasheet en-US. Manual de instruções do posicionador eletropneumático SIPART PS2 para válvulas de controle; valores do capítulo 12 (p. 249-257)."
- "P_max: pressão de ar de alimentação 1,4 a 7 bar (p. 249); não é pressão de processo da válvula."
- "Top: -30 a +80 °C (padrão); com código -Z M40: -40 a +80 °C (p. 249). Em áreas explosivas vale a classe de temperatura (T4 até +80 °C, T6 até +50 °C) (p. 255)."
- "Alimentação auxiliar 18 a 35 V DC apenas nas versões 3/4 fios (6DR52../6DR53..) (p. 257); a versão 2 fios é alimentada pelo laço 4 a 20 mA, tensão de carga típica 6,36 V (6DR50.., sem proteção Ex) (p. 256). Sem símbolo V_coil, não transcrito como parâmetro."
- "Curso do atuador linear 3 a 130 mm; ângulo de giro 30 a 100° (p. 250). Conversor A/D: tempo de varredura 10 ms, resolução ≤ 0,05 %, erro de transmissão ≤ 0,2 % (p. 252)."
- "Vazão sem restrição: pressurizar 0,1 KV (4,1 Nm3/h a 2 bar); despressurizar 0,2 KV (p. 250)."
