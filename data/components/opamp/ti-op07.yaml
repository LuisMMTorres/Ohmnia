lifecycle: desconhecido
notes:
- Folha SLOS099H (setembro 1983, revisada março 2023). Ampop de precisão com baixo offset.
- As especificações da seção 6.5 (VS = ±15 V, TA = 25 °C, RL = 2 kΩ) valem para OP07C e OP07D (nota 1 do documento); transcrita a coluna OP07C. OP07D tem limites maiores (por exemplo VOS ±150 µV, IB ±12 nA, IOS ±6 nA).
- O texto extraído do PDF não separa as colunas; os valores foram lidos na imagem das páginas 5 e 6.
- 'Faixa de temperatura de operação: 0 a 70 °C (seção 6.3).'
- PSRR dado em µV/V (7 típ., 32 máx.), não em dB; não transcrito.
