# Fonte: Texas Instruments, LM124/LM224/LM324/LM2902 (LMx24), SLOS066AE, August 1975 - Revised September 2025.
part_number: LM324
category: opamp
schema_version: '1.0'
manufacturer: Texas Instruments
family: LMx24 / LM2902 (ampop quádruplo)
package: 14 pinos (SOIC D, SSOP DB, PDIP N, SO NS, TSSOP PW, WQFN RTE, LCCC FK, CDIP J, CFP W)
lifecycle: desconhecido
notes:
- Folha SLOS066AE (agosto 1975, revisada setembro 2025) cobre LM124/224/324/2902 e variantes B, K, A.
- Valores transcritos da seção 6.7 (LM324, LM324K), coluna LM324, e dos limites absolutos da coluna LM324xx (32 V).
- Ampop quádruplo; ICC do documento (0,7 típ. / 1,2 máx. mA, VO = 2,5 V, sem carga; faixa completa) é para os quatro amplificadores, por isso IQ por amplificador não foi transcrito.
- 'VIO, IIO, IIB: ib e ios em módulo (o documento dá IIB negativa: -20 típ. / -250 máx. nA).'
- 'Faixa de temperatura de operação LM324xx: 0 a 70 °C (seção 6.3).'
