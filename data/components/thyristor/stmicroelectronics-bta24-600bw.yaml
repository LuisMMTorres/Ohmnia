package: TO-220AB isolado (BTA24, aba isolada 2500 VRMS)
lifecycle: desconhecido
notes:
- 'Documento da série. Pelo esquema de pedidos (p. 6): BTA = isolado, 24 = 25 A em TO-220AB, 600 = 600 V, BW = 50 mA Snubberless (3 quadrantes). Valores de IGT, IH, IL, dV/dt e (dI/dt)c são os da coluna BW da Tabela 3 (p. 2).'
- 'IT(RMS) 25 A com Tc = 75 °C para TO-220AB isolado (Tabela 2, p. 2).'
- 'IL: 80 mA nos quadrantes I-III e 100 mA no quadrante II (coluna BW). (dI/dt)c mín. 22 A/ms sem snubber, Tj = 125 °C (Tabela 3): sem símbolo no esquema.'
- 'Vt0 máx. 0,85 V e Rd máx. 16 mohm a Tj = 125 °C; IDRM/IRRM máx. 5 uA (Tj = 25 °C) e 3 mA (Tj = 125 °C) (Tabela 5, p. 3). VDSM/VRSM = VDRM/VRRM + 100 V (p. 2).'
- 'Nota do documento (Tabela 1): a versão 600 V só está disponível com IGT = 50 mA (Snubberless e Standard).'
