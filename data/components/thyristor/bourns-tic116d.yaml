# Fonte: Bourns, TIC116 SERIES Silicon Controlled Rectifiers, April 1971 - revised September 2002.
part_number: TIC116D
category: thyristor.scr
schema_version: '1.0'
manufacturer: Bourns
family: TIC116 (D, M, S, N)
package: TO-220 (pino 2 em contato elétrico com a base de fixação)
lifecycle: obsoleto
notes:
- Documento da série TIC116 (D/M/S/N, 400 a 800 V); VDRM e VRRM são os da coluna TIC116D, os demais valores são comuns à série.
- A folha só dá faixa de temperatura de operação da cápsula, -40 a +110 °C, e não define Tj_max; por isso Tj_max não foi transcrito.
- 'Colunas do documento confirmadas na imagem da página 2: IGT 8 típ. e 20 máx.; IH 100 mA a -40 °C e 40 mA a 25 °C; VGT 0,8 típ./1,5 máx. a 25 °C.'
- O documento marca a série como obsoleta e não recomendada para novos projetos (página 1).
