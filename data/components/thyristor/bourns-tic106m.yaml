# Fonte: Bourns, TIC106 SERIES Silicon Controlled Rectifiers, April 1971 - revised September 2002.
part_number: TIC106M
category: thyristor.scr
schema_version: '1.0'
manufacturer: Bourns
family: TIC106 (D, M, S, N)
package: TO-220 (pino 2 em contato elétrico com a base de fixação)
lifecycle: obsoleto
notes:
- Documento da série TIC106; VDRM e VRRM são os da coluna TIC106M (página 1). Os demais valores são comuns à série.
- O documento marca a série como obsoleta e não recomendada para novos projetos (página 1).
- Tj_max não é dado; o datasheet só especifica faixa de temperatura de operação da cápsula, -40 a +110 C, e armazenamento -40 a +125 C.
- ITSM é dado para meio ciclo senoidal de 50 Hz (t_pulse = 10 ms é a duração desse meio ciclo). VDRM e IT(RMS) valem com RGK = 1 kohm.
- Valores de VGT e IH dependem da temperatura; os sem sufixo são os de 25 C e os com @2 são os de -40 C.
