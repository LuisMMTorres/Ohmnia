notes:
- O PDF baixado é da Philips Semiconductors (July 2001, Rev 1.000), não da onsemi como constava na fila; fabricante registrado conforme o documento.
- 'IT(RMS) = 4 A (''all conduction angles'', página 2) não foi transcrito como parâmetro: a tabela não dá temperatura e o esquema exige TC ou TA.'
- VDRM e VRRM de 400 V; VDM = 67 % de 400 V = 268 V usado nas condições de dv/dt e tq (cálculo a partir do texto).
- Temperatura mínima de junção não é dada.
