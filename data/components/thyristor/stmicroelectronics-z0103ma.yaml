category: thyristor.triac
schema_version: '1.0'
manufacturer: STMicroelectronics
family: Z01
package: TO-92
lifecycle: desconhecido
notes:
- 'Documento da série Z01. Z0103MA = 1 A, sensibilidade 03 (IGT 3 mA), M = 600 V, A = TO-92 (esquema de pedidos, p. 6 e seletor de produtos, p. 7). Valores de IGT, IH, IL, dV/dt e (dV/dt)c são os da coluna 03 da Tabela 2 (p. 2).'
- 'IT(RMS) 1 A com TL = 50 °C para TO-92 (Tabela 1, p. 2). IGT quadrante IV: máx. 5 mA (quadrantes I-II-III: 3 mA). IL quadrante II: máx. 15 mA (I-III-IV: 7 mA).'
- '(dV/dt)c mín. 0,5 V/us com (dI/dt)c = 0,44 A/ms, Tj = 110 °C (Tabela 2). Para dV/dt estático a condição é Tj = 110 °C (não 125 °C).'
- 'Vto máx. 0,95 V e Rd máx. 400 mohm a Tj = 125 °C; IDRM/IRRM máx. 5 uA (Tj = 25 °C) e 0,5 mA (Tj = 125 °C) (Tabela 3, p. 3). Rth(j-l) junção-terminal TO-92 = 60 °C/W (p. 3).'
