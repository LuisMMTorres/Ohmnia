# Fonte: WeEn Semiconductors, BT131-600 4Q Triac, Product data sheet, Rev.03 - 11 April 2022.
part_number: BT131-600
category: thyristor.triac
schema_version: '1.0'
manufacturer: WeEn
package: TO-92 (SOT54)
lifecycle: desconhecido
notes:
- 'Parâmetros por quadrante: IGT e IL em IGT, IGT@2, IGT@3, IGT@4 (e IL idem) na ordem T2+ G+, T2+ G-, T2- G-, T2- G+ (MT2 e G em relação a MT1), conforme a folha.'
- 'di/dt: valor sem sufixo vale para os três primeiros quadrantes e di/dt@2 para T2- G+ (página 3).'
- Rth_jc não transcrito (ver notas).
- 'Rth(j-lead) (página 6): 60 K/W em ciclo completo e 80 K/W em meio ciclo; o esquema só tem Rth_jc (junção-cápsula), por isso não foi transcrito como parâmetro.'
- IT(RMS) = 1 A é dado com Tlead ≤ 51,2 °C (temperatura do terminal); registrado em TC = 51,2 °C para atender o esquema; revisar.
