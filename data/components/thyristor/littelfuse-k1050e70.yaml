notes:
- Dispositivo SIDAC (chave bilateral disparada por tensão), registrado em thyristor.diac por ser a categoria mais próxima do catálogo; K1050E70 é o K1050y no encapsulamento TO-92 (E), lead form Type 70 (Product Selector).
- 'Sem símbolo no esquema: VDRM 90 V (pág. 1); IT(RMS) 1 A, IDRM máx 5 uA, VTM máx 1.5 V a IT = 1 A (Kxxx0y), IH máx 150 mA, ITSM 20 A a 60 Hz, dv/dt 1500 V/us, di/dt 150 A/us (pág. 2).'
- 'Resistência térmica TO-92: junção-caixa 35 °C/W e junção-ambiente 95 °C/W (pág. 2).'
- IB registra a corrente de fuga IDRM (V = VDRM = 90 V), a corrente de fuga abaixo do disparo.
