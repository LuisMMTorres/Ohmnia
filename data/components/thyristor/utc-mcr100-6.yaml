notes:
- O PDF baixado é da Unisonic Technologies (UTC), MCR100, e não da onsemi como constava na fila; fabricante registrado conforme o documento.
- A folha cobre MCR100-4/-6/-8 (200/400/600 V) em SOT-223, SOT-89, SOT-23 e TO-92; VDRM/VRRM transcritos da linha MCR100-6. Rth_ja transcrito para TO-92; o encapsulamento da peça não é definido pela fila.
- 'Colunas de IGT confirmadas na imagem da página 3: 30 é mínimo e 100 é máximo; VAK = 7 V foi registrado como VD.'
- 'ITSM: o documento diz meio ciclo senoidal de 60 Hz sem informar a duração em ms; 8,3 ms é a duração calculada, igual à usada em I2t (t = 8,3 ms).'
