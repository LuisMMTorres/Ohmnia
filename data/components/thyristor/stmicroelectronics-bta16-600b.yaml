# Fonte: STMicroelectronics, BTA16, BTB16, T1610, T1635 16 A Snubberless, logic level and standard Triacs, Doc ID 7471 Rev 9, March 2010 (cópia no distribuidor Farnell).
part_number: BTA16-600B
category: thyristor.triac
schema_version: '1.0'
manufacturer: STMicroelectronics
family: BTA16, BTB16, T1610, T1635
package: TO-220AB (BTA = versão com aba isolada, 2500 VRMS)
lifecycle: desconhecido
notes:
- 'Documento da série; o código "BTA16-600B" não aparece no texto: pelo esquema de pedidos (p. 9) BTA16-xxxyzRG, xxx = tensão (600) e y = sensibilidade (B). Valores de IGT, IH, IL, dV/dt e (dV/dt)c são os da coluna B da Tabela 4 (padrão, 4 quadrantes, p. 3).'
- 'IT(RMS) 16 A com Tc = 100 °C para D2PAK/TO-220AB e Tc = 86 °C para TO-220AB isolado (BTA) (p. 2); como BTA16 é isolado, usado Tc = 86 °C.'
- 'IGT quadrantes I-II-III máx. 50 mA e quadrante IV máx. 100 mA (coluna B); IL quadrante II máx. 120 mA (I-III-IV: 60 mA). VDSM/VRSM = VDRM/VRRM + 100 V (p. 2).'
- 'Rth(j-c) CA: 1,2 °C/W (D2PAK/TO-220AB) e 2,1 °C/W (TO-220AB isolado); Vto máx. 0,85 V e Rd máx. 25 mohm a Tj = 125 °C (Tabela 5, p. 3); IDRM/IRRM máx. 5 uA (Tj = 25 °C) e 2 mA (Tj = 125 °C).'
