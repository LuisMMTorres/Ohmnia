notes:
- 'Documento da série. Valores elétricos (Tabelas 2 e 3) são comuns à série; VDRM/VRRM = 600 V é o da coluna TYN625 (a série cobre 600 a 1200 V). Rth(j-c) de 1,0 °C/W vale para TO-220AB e D2PAK (TXN625 isolado: 2,0 °C/W).'
- 'IT(RMS) 25 A com Tc = 100 °C para TO-220AB e D2PAK (TO-220AB ins: Tc = 83 °C). ITSM 314 A (tp = 8,3 ms) e 300 A (tp = 10 ms), Tj = 25 °C.'
- 'Vt0 (tensão de limiar) máx. 0,77 V e Rd (resistência dinâmica) máx. 14 mohm a Tj = 125 °C (Tabela 3, p. 2); IGT mín. 4 mA; VGD mín. 0,2 V; IDRM/IRRM máx. 5 uA (Tj = 25 °C) e 4 mA (Tj = 125 °C).'
