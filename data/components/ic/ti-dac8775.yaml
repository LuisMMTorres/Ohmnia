# Fonte: Texas Instruments, DAC8775 Quad-Channel, 16-Bit Programmable Current Output and Voltage Output Digital-to-Analog Converter with Adaptive Power Management, SLVSBY7, February 2017.
part_number: DAC8775
category: ic.dac
schema_version: '1.0'
manufacturer: Texas Instruments
package: VQFN-72 (RWF) (p. 1 e p. 7)
lifecycle: desconhecido
notes:
- 'DAC de 16 bits, quatro canais, com saída programável em corrente ou tensão e gerenciamento adaptativo de potência (conversor buck/boost) (p. 1).'
- 'Faixas de corrente: 0 a 24 mA, 3,5 a 23,5 mA, 0 a 20 mA, 4 a 20 mA e ±24 mA; faixas de tensão: 0 a 5 V, 0 a 10 V, ±5 V, ±10 V, com 20% de sobrefaixa (0 a 6 V, 0 a 12 V, ±6 V, ±12 V) (p. 1).'
- 'Especificações a AVDD/PVDD/VPOS_IN = +15 V, VNEG_IN = -15 V, REFIN = +5 V externa, conversor buck/boost desabilitado (p. 7).'
- 'Alimentação única de 12 V a 36 V (PVDD/AVDD) (p. 1 e p. 6); DVDD externo de 2,7 V a 5,5 V (p. 7); referência interna de 5 V (máx. 10 ppm/°C) (p. 1).'
- 'Corrente de alimentação não transcrita (seção de potência não localizada com segurança no texto extraído).'
