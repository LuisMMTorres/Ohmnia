# Fonte: Exar Corporation, XR-2206 Monolithic Function Generator, Rev. 1.04, February 2008 (cópia distribuída pela SparkFun).
part_number: XR2206
category: ic.oscillator
schema_version: '1.0'
manufacturer: Exar
family: XR-2206 (P, CP, D)
package: PDIP-16 300 mil (P, CP), SOIC-16 JEDEC 300 mil (D)
lifecycle: desconhecido
notes:
- 'Gerador de funções monolítico (seno, quadrada, triangular, rampa, pulso). Condições de teste: VCC = 12 V, TA = 25 C, C = 0,01 uF, R1 = 100 kohm (página 4).'
- 'Dois graus: XR-2206P (-40 a 85 C) e XR-2206CP/D (0 a 70 C). Parâmetros sem sufixo são do XR-2206P; os com @2 são do XR-2206CP/D.'
- 'f: mínimo é a frequência mais baixa prática (típ., C = 50 uF, R1 = 2 Mohm); máximo é a frequência máxima de operação típica de 1 MHz (mín. garantido 0,5 MHz, C = 1000 pF, R1 = 1 kohm), página 4.'
- 'V_out: saída máxima típica 6 Vp-p (valor pico a pico), impedância de saída 600 ohm; amplitude senoidal 40 a 80 mV/kohm de R3 (típ. 60) e triangular 160 mV/kohm, página 4.'
- 'THD: senoide com ajuste, típ. 0,4 % e máx. 1,0 % (XR-2206P) ou típ. 0,5 % e máx. 1,5 % (CP/D); sem ajuste típ. 2,5 % com R1 = 30 kohm (página 4).'
- 'Fora do esquema: tensão de referência (pino 10) 2,9/3,1/3,3 V (P) e 2,5/3/3,5 V (CP/D), saída quadrada 12 Vp-p, tempo de subida 250 ns e de descida 50 ns (CL = 10 pF), precisão de frequência +-1 % típ. (página 5); fonte dividida +-5 a +-13 V; resistores de temporização 1 kohm a 2 Mohm; capacitor 0,001 a 100 uF (página 4). Máximos absolutos: potência 750 mW (derating 5 mW/C), corrente total de temporização 6 mA, armazenamento -65 a 150 C (página 5).'
