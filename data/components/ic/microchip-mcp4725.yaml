lifecycle: desconhecido
notes:
- 'A fila indica fabricante Texas Instruments, mas o documento é da Microchip Technology (DS22039D); registro feito com o fabricante do documento. Conferir.'
- 'Referência do DAC alimentada diretamente por VDD (p. 1); VREF = VDD, faixa 2.7 a 5.5 V. Saída rail-to-rail.'
- 'INL ±2 LSB típ. e ±14.5 LSB máx.; DNL ±0.2 LSB típ. e ±0.75 LSB máx. (p. 3, Note 1: código de teste 100 a 4000).'
- 'Corrente de alimentação 210 µA típ., 400 µA máx. (sem carga, código 000h); modo power-down 0.06 µA típ., 2.0 µA máx. com VDD = 5.5 V (p. 3).'
- 'Interface I2C: padrão (100 kbps), rápido (400 kbps) e alta velocidade (3.4 Mbps); 8 endereços disponíveis com o pino A0 (p. 1).'
- 'Memória EEPROM interna: tempo de escrita 25 ms típ., 50 ms máx.; retenção 200 anos; 1 milhão de ciclos (p. 4).'
- 'Fila de transcrição: novo link do site do fabricante (Microchip).'
