# Fonte: Analog Devices (Linear Technology), LTC2668 16-Channel 16-/12-Bit ±10V VOUT SoftSpan DACs with 10ppm/°C Max Reference, documento 2668fa (cópia Datasheetcafe).
part_number: LTC2668
category: ic.dac
schema_version: '1.0'
manufacturer: Analog Devices
family: LTC2668-16 / LTC2668-12
package: QFN 40 pinos 6 mm x 6 mm (UJ)
lifecycle: desconhecido
notes:
- 'Documento cobre LTC2668-16 (16 bits) e LTC2668-12 (12 bits); registrado o de 16 bits, exceto onde indicado (pág. 4).'
- 'Condições: AVP = 5 V, OVP = 5 V, V+ = 15 V, V- = -15 V, VREF = 2,5 V, VOUT sem carga, TA = 25 °C salvo indicação (pág. 4).'
- 'INL do LTC2668-16 típ. ±2,2 LSB e máx. ±4 LSB (graus C e I, V+/V- = ±15 V); ±5 LSB no grau H com V- = GND (pág. 4). DNL típ. ±0,2 e máx. ±1 LSB (16 bits).'
- 'Cinco faixas de saída programáveis por canal: 0 a 5 V, 0 a 10 V, ±2,5 V, ±5 V, ±10 V (pág. 1); saídas fornecem ±10 mA garantidos.'
- 'Alimentação: AVP 4,5 a 5,5 V; V+ 4,5 a 15,75 V; V- -15,75 a -4,5 V ou 0 V (pág. 5); OVP 1,71 V a AVP + 0,3 V. VS abaixo é AVP.'
- 'Corrente V+/V-: 4,6 típ./6,5 máx. mA (faixas unipolares) e 8 típ./9,5 máx. mA (bipolares); IS abaixo é o máximo bipolar (pág. 5). IAVP 5,4 típ./6,5 máx. mA (unipolar), 9,4/12 mA (bipolar).'
- 'Tempo de acomodação até ±1 LSB de 16 bits: 9 us (degrau ±5 V ou ±10 V) e 20,5 us (degrau ±20 V); o máx. 20,5 us é o pior caso (pág. 5).'
- 'Faixa de operação por grau: C 0 a 70 °C, I -40 a 85 °C, H -40 a 125 °C (pág. 2); aqui a faixa total -40 a 125 °C.'
- 'Referência interna 2,5 V (2,495 a 2,505 V, ±10 ppm/°C máx.); faixa de referência externa 0,5 V a AVP - 1,75 V (pág. 4 e 5).'
