lifecycle: desconhecido
notes:
- 'O item da fila é a placa Nucleo-F446RE, mas o PDF é o datasheet do microcontrolador STM32F446xC/E: registro do chip STM32F446RE (R = LQFP64, E = 512 KB de flash), não da placa.'
- 'ATENÇÃO ao PDF: o arquivo está truncado/corrompido (sem tabela de referências cruzadas e sem página 1; abre com 0 páginas em leitores comuns). O texto foi recuperado reconstruindo a árvore de páginas numa cópia de trabalho; contém as páginas impressas 2 a 144 de 202. Os números de página abaixo são os IMPRESSOS no rodapé/cabeçalho (N/202), que são o índice de página do PDF + 1.'
- 'Valores de flash, GPIO e canais ADC são da coluna STM32F446RE da Tabela 2 (p. 13): flash 512 KB, SRAM 128 KB (112 + 16) mais 4 KB de backup, 50 GPIOs, 3 ADCs de 12 bits com 16 canais (LQFP64).'
- 'Alimentação: VDD de 1,7 V (com a ressalva da nota 2 da Tabela 16, não transcrita) a 3,6 V (p. 77); a Tabela 2 (p. 13) diz 1,8 a 3,6 V com nota (4). VDDA com ADC: 2,4 a 3,6 V para até 2,4 Msps; 1,7 a 2,4 V limita o ADC a 1,2 Msps (p. 77).'
- 'Temperatura ambiente (Tabela 16, p. 77): -40 a +85 °C (sufixo 6) e -40 a +105 °C (sufixo 7); a peça da fila não traz sufixo, usada a faixa mais ampla (sufixo 7), revisar.'
- 'Níveis de E/S (Tabelas 56 e 57, p. 118 e 121): VOL máx. 0,4 V com IIO = 8 mA (porta CMOS, 2,7 V <= VDD <= 3,6 V); VIL máx. 0,3 VDD e VIH mín. 0,7 VDD (FT/TTa/NRST). Pinos FT toleram até 5,5 V (2 V <= VDD <= 3,6 V, p. 77).'
- 'Consumo em Run a 180 MHz, PLL ligado, todos os periféricos habilitados: típ. 72 mA a 25 °C, máx. 100 mA a 85 °C e 110 mA a 105 °C (Tabela 23, p. 83). Corrente total de VDD máx. 240 mA e total de E/S máx. 120 mA (Tabela 14, p. 75).'
- 'pwm_ch não transcrito: o datasheet lista 10 timers de uso geral e 2 de controle avançado (Tabela 2, p. 13), sem contagem de canais PWM por variante.'
