# Fonte: onsemi, SG3525A/D, Pulse Width Modulator Control Circuit, Rev. 7, February 2024.
part_number: SG3525A
category: ic.pwm_controller
schema_version: '1.0'
manufacturer: onsemi
family: SG3525A
package: PDIP-16 (sufixo N, case 648-08), SOIC-16 WB (sufixo DW, case 751G)
lifecycle: desconhecido
notes:
- 'Controlador PWM para fontes chaveadas, duas saídas totem-pole (A e B), referência de 5,1 V, soft-start e sincronismo. Condições gerais da página 4: VCC = 20 V, TA de 0 a 70 C.'
- 'I_out é o máximo absoluto de corrente de saída (fonte ou sumidouro); em regime permanente a faixa recomendada é 0 a 100 mA e o pico recomendado 400 mA (página 3).'
- 'Tensão de coletor VC: máximo absoluto 40 V, faixa recomendada 4,5 a 35 V (páginas 3).'
- 'D_max: mínimo garantido 45 %, típico 49 % (página 4). t_r e t_f com CL = 1 nF, TJ = 25 C (página 5).'
- 'Fora do esquema: soft-start 25 a 80 uA (típ. 50 uA), RT 2 a 150 kohm, CT 0,001 a 0,2 uF, precisão inicial do oscilador típ. 2 % (máx. 6 %), saída em nível baixo típ. 0,2 V (Isink = 20 mA), alta 18 V mín. (Isource = 20 mA), páginas 4 e 5.'
