# Fonte: Texas Instruments, PCF8574 Remote 8-Bit I/O Expander for I2C Bus, SCPS068K, July 2001 - Revised September 2024.
part_number: PCF8574
category: ic.interface
schema_version: '1.0'
manufacturer: TI
lifecycle: desconhecido
notes:
- 'Expansor de I/O de 8 bits quase-bidirecional (P0-P7) para barramento I2C, com saídas latched que acionam LEDs diretamente e saída de interrupção open-drain (p. 1).'
- 'Corrente de saída em nível baixo recomendada 25 mA (p. 4, Recommended Operating Conditions); nível alto recomendado -1 mA.'
- 'Corrente em espera ICC: 2,5 uA típ. e 10 uA máx. (linha Standby mode; p. 5).'
- 'Empacotamentos citados na tabela térmica: DGV, DW, N, PW, RGT e RGY (p. 4).'
