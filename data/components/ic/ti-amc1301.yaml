# Fonte: Texas Instruments, AMC1301 Precision, ±250-mV Input, Reinforced Isolated Amplifier, SBAS667G, abril 2016, revisado abril 2023.
part_number: AMC1301
category: ic.interface
schema_version: '1.0'
manufacturer: Texas Instruments
family: AMC1301 / AMC1301S
package: DWV (SOIC, 8 pinos), 5.85 mm x 7.50 mm
lifecycle: desconhecido
notes:
- 'Fila: AMC1301. Amplificador isolado reforçado de ganho fixo para medição de corrente com shunt; categoria ic.interface escolhida por falta de categoria própria (sensor.current exige I_PN, que o datasheet não declara).'
- 'Entrada diferencial linear +-250 mV (VFSR), clipping em +-302.7 mV, ganho nominal fixo 8.2 V/V, saída diferencial (tensão de modo comum de saída 1.39 ... 1.49 V) (p.1, p.5, p.9).'
- 'Erro de ganho +-0.3 % máx. a 25 °C; deriva de ganho +-50 ppm/°C máx.; offset +-0.2 mV máx.; deriva de offset +-3 µV/°C máx.; não linearidade 0.03 % máx. (p.1, p.9).'
- 'Isolação (p.7): 5000 VRMS por 1 min (UL1577), VIOTM 7000 VPK, VIORM 1500 VPK, tensão de trabalho 1000 VRMS, surge 10000 VPK; CMTI 15 kV/us mín. (p.9).'
- 'Atraso 50 %-50 % da entrada à saída 1.6 us típ., 2.6 us máx.; tempo de subida/descida 2.0 us (p.10).'
- 'Corrente de alimentação IDD1 (alto lado) 7.2 típ. / 9.8 mA máx. em 4.5 ... 5.5 V (registrada em ICC); IDD2 (baixo lado) 5.9 típ. / 8.1 mA máx. (p.10).'
- 'AMC1301S: faixa especificada -55 ... +125 °C (p.5). Os valores de Top aqui são do AMC1301.'
