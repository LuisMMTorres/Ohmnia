notes:
- Documento SN74HC32, SN54HC32 (SCLS200F, revisado em abril de 2021); folha comum às versões SN54HC (militar) e SN74HC (comercial); valores transcritos da coluna comercial SN74HC.
- 'Colunas de temperatura: valores a 25 °C e de -40 a 85 °C; os pares com sufixo @2 repetem o símbolo com outra condição. VIH, VIL e IOH/IOL máx. valem para toda a faixa; VOH/VOL em VCC = 4,5 V.'
- Corrente de saída contínua máx. de ±25 mA (limite absoluto) registrada em IOH e IOL; corrente por VCC ou GND ±50 mA (pág. 4).
- Valores do ICC a 25 °C são máximos (2 uA) e a 85 °C máximos (20 uA), conforme colunas MAX da tabela.
