# Fonte: Texas Instruments, INA3221 26V, Triple Channel, 13-Bit, I2C Output Current and Voltage Monitor With Alerts, SBOS576C, maio 2012, revisado setembro 2026.
part_number: INA3221
category: ic.energy_meter
schema_version: '1.0'
manufacturer: Texas Instruments
package: RGV (VQFN, 16 pinos), 4.00 mm x 4.00 mm
lifecycle: desconhecido
notes:
- 'Monitor de 3 canais (corrente de shunt e tensão de barramento); faixa de tensão de shunt +-163.84 mV, barramento 0 ... 26 V; 1 LSB: shunt 40 uV, barramento 8 mV (p.5).'
- 'Erro de ganho (shunt e barramento) 0.1 % típ., 0.25 % máx.; offset do shunt +-40 uV típ., +-80 uV máx. (p.5).'
- 'Corrente quiescente 350 uA típ., 450 uA máx.; em power-down 0.5 uA típ., 2 uA máx. (p.6). Tempo de conversão de 140 us a 9.068 ms (p.5).'
- 'Quatro endereços I2C programáveis, saídas de alerta crítico/aviso e power-valid (p.1).'
- 'V_in registra o limite absoluto diferencial das entradas IN+/IN- (+-26 V, p.4).'
