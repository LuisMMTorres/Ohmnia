notes:
- 'Fabricante original do documento: Linear Technology (marca LTC), registrada em nome da Analog Devices pela fila.'
- 'Faixa de entrada: -0.125 x VREF a 1.125 x VREF (p. 2); tensão de referência 0.1 V até VCC (p. 2). Não transcritas como V_in por serem relativas a VREF.'
- 'Linearidade, offset e ganho estão em ppm de VREF (INL 4 ppm típ., 15 ppm máx. com VREF = 5 V; offset 0.5 ppm típ.; erro de fundo de escala 4 ppm típ., p. 2), fora da unidade LSB do esquema; não transcritos nos parâmetros.'
- 'Tempo de conversão 133.33 ms típ. com FO = 0 V (rejeição de 60 Hz) e 160 ms com FO = VCC (50 Hz) (p. 4); taxa de amostragem não transcrita como fs.'
- 'Rejeição de modo normal 60 Hz/50 Hz: 110 dB mín., 130 dB típ. (p. 2); não transcrita como SNR.'
- 'Corrente de alimentação em modo conversão 200 µA típ., 300 µA máx.; em modo sleep 20 µA típ., 30 µA máx. (p. 3).'
- 'Temperatura: LTC2400C 0 a 70 °C; LTC2400I -40 a 85 °C (p. 2); Top registra a faixa mais ampla (versão I).'
- 'Fila de transcrição: novo link do distribuidor (farnell).'
