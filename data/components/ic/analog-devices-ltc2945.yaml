# Fonte: Analog Devices (Linear Technology), LTC2945 Wide Range I2C Power Monitor, rev. 2945fb (cópia Farnell).
part_number: LTC2945
category: ic.energy_meter
schema_version: '1.0'
manufacturer: Analog Devices
family: LTC2945 / LTC2945-1
package: 12-Lead QFN 3 mm x 3 mm (UD) e 12-Lead MSOP (MS)
lifecycle: desconhecido
notes:
- 'Monitor de potência (corrente, tensão e potência de 24 bits) com ADC Δ∑ de 12 bits e interface I2C; a variante -1 tem saída de dados invertida para optoacopladores (pág. 1).'
- 'Faixa de operação por grau: C 0 a 70 °C, I -40 a 85 °C, H -40 a 125 °C (pág. 2); Top abaixo usa a faixa total entre os graus.'
- 'Erro total não ajustado (TUE) < ±0,75 % para as entradas de corrente (SENSE), tensão (VIN) e ADIN (pág. 4). Tensão de fundo de escala do SENSE 102,4 mV típ.; ADIN 2,048 V típ.'
- 'Faixa de tensão de entrada dos sensores (SENSE+/SENSE-) de modo comum: 0 a 80 V; VDD de 4 a 80 V; INTVCC de 2,7 a 5,9 V (págs. 3-4). Corrente em shutdown IDD 40 µA típ. (70 µA máx.).'
- 'Absolutos máximos (pág. 2): VDD -0,3 a 100 V; SENSE+ -1 a 100 V. TJmax 125 °C; θJA 58,7 °C/W (QFN) e 135 °C/W (MSOP).'
