# Fonte: Texas Instruments, INA226 36V, 16-Bit, Ultra-Precise I2C Output Current, Voltage, and Power Monitor With Alert, SBOS547C, junho 2011, revisado agosto 2026.
part_number: INA226
category: ic.energy_meter
schema_version: '1.0'
manufacturer: Texas Instruments
package: DGS (VSSOP, 10 pinos)
lifecycle: desconhecido
notes:
- 'Faixa de tensão de shunt -81.9175 ... +81.92 mV (resolução 2.5 uV/LSB) e de barramento 0 ... 36 V (1.25 mV/LSB, escala de 40.96 V no ADC) (p.5).'
- 'Erro de ganho (shunt e barramento) 0.02 % típ., 0.1 % máx.; offset do shunt +-2.5 uV típ., +-10 uV máx. (p.5).'
- 'Corrente quiescente em desligamento (shutdown) 0.5 uA típ., 2 uA máx. (p.6). Tempo de conversão do ADC de 140 us a 9.068 ms conforme bits CT (p.5).'
- 'V_in registra o limite absoluto diferencial das entradas IN+/IN- (+-40 V, p.4); a tensão de modo comum não pode exceder -0.3 ... 40 V.'
