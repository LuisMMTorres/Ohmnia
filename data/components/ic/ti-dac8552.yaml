# Fonte: Texas Instruments, DAC8552 16-Bit, Dual Channel, Ultra-Low Glitch, Voltage Output Digital-to-Analog Converter, SLAS430A, July 2006 - Revised October 2006.
part_number: DAC8552
category: ic.dac
schema_version: '1.0'
manufacturer: Texas Instruments
package: MSOP-8 (DGK) (p. 2 e p. 4)
lifecycle: desconhecido
notes:
- 'DAC de 16 bits, dois canais, saída em tensão rail-to-rail, referência externa obrigatória (p. 1).'
- 'Características a VDD = 2,7 V a 5,5 V, de -40 °C a +105 °C (p. 2 e p. 3).'
- 'Corrente de alimentação (modo normal): 340 µA típ., 500 µA máx. para VDD = 3,6 a 5,5 V; não inclui corrente de referência (p. 3).'
- 'Tempo de acomodação 8 µs típ. e 10 µs máx. (a ±0,003% FSR, RL = 2 kΩ, 0 a 200 pF) (p. 3).'
- 'Relative accuracy: ±4 LSB típ., ±12 LSB máx. (p. 2).'
