lifecycle: desconhecido
notes:
- 'O documento cobre ADS8684 (4 canais) e ADS8688 (8 canais); valores transcritos para o ADS8688 (p. 1).'
- 'Especificações a AVDD = 5 V, DVDD = 3 V, VREF = 4,096 V (interna) e 500 kSPS; mín./máx. de -40 °C a 125 °C (p. 7).'
- 'Faixas de entrada programáveis por canal: bipolares ±10,24 V, ±5,12 V, ±2,56 V; unipolares 10,24 V e 5,12 V (p. 1); entrada com proteção contra sobretensão até ±20 V (p. 1 e 7).'
- 'Impedância de entrada de 1 MΩ constante (p. 1); canal auxiliar AUX_IN com faixa de 0 a VREF (p. 9).'
- 'Erro de offset em mV (±0,5 mV típ. a ±2 mV máx. conforme a faixa, p. 8); sem símbolo em LSB, não transcrito como parâmetro.'
