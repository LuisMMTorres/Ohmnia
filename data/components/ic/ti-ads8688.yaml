# Fonte: Texas Instruments, ADS8684, ADS8688 ADS868x 16-Bit, 500-kSPS, 4- and 8-Channel, Single-Supply, SAR ADCs with Bipolar Input Ranges, SBAS582C, July 2014 - Revised April 2015.
part_number: ADS8688
category: ic.adc
