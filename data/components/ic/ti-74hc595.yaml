# Fonte: Texas Instruments, SNx4HC595 8-Bit Shift Registers With 3-State Output Registers, SCLS041J, December 1982 - Revised October 2021.
part_number: 74HC595
category: ic.digital
schema_version: '1.0'
manufacturer: TI
family: SN54HC595 / SN74HC595
lifecycle: desconhecido
notes:
- 'Registrador de deslocamento de 8 bits, entrada serial e saída paralela com saídas 3-state (p. 1).'
- 'Valores de VIH, VIL e VOH/VOL na coluna SN74HC595 (faixa -40 a 85 °C); VIH e VIL dados para VCC = 4,5 V (p. 4 e 5).'
- 'Corrente de saída contínua máxima ±35 mA por saída; ±70 mA contínuos em VCC ou GND (p. 4).'
- 'Frequência de clock (fclock) tem tabela própria por VCC em Timing Requirements (p. 6), não transcrita como f_max por ambiguidade das colunas.'
