# Fonte: Texas Instruments, DAC7760, DAC8760 (DACx760) Single-Channel, 12- and 16-Bit Programmable Current and Voltage Output DACs for 4-mA to 20-mA Current-Loop Applications, SBAS528D, June 2013 - Revised December 2021.
part_number: DAC8760
category: ic.dac
schema_version: '1.0'
manufacturer: Texas Instruments
family: DACx760
package: VQFN-40 (RHA, 6 x 6 mm) e HTSSOP-24 (PWP, 7,8 x 4,4 mm) (p. 1)
lifecycle: desconhecido
notes:
- 'O documento cobre DAC7760 (12 bits) e DAC8760 (16 bits); valores para o DAC8760 (p. 1 e p. 6).'
- 'Saída em corrente: 4 a 20 mA, 0 a 20 mA ou 0 a 24 mA; saída em tensão: 0 a 5 V, 0 a 10 V, ±5 V, ±10 V, com 10% de sobrefaixa (até ±11 V) (p. 1 e p. 6-7).'
- 'Alimentação AVDD de 10 a 36 V (AVDD + |AVSS| <= 36 V), AVSS de -18 a 0 V; DVDD de 2,7 a 5,5 V com regulador interno desabilitado (p. 5).'
- 'Referência interna de 5 V (máx. 10 ppm/°C) e saída de alimentação interna de 4,6 V (p. 1 e p. 9).'
- 'Corrente de alimentação analógica AIDD (3 a 4,6 mA conforme o modo) e AISS na p. 10; não transcrita como IS por causa da ambiguidade de colunas mín./típ./máx. no texto extraído.'
