schema_version: '1.0'
manufacturer: Texas Instruments
package: WQFN-16 (4 x 4 mm, passo 0,5 mm) (p. 1)
lifecycle: desconhecido
notes:
- 'DAC sigma-delta de 16 bits para laços de corrente 4-20 mA, com referência e oscilador internos, detecção de erro de laço e interface para modulador HART (p. 1).'
- 'Especificações a VA = VD = 3,3 V, TA = 25 °C, transistor bipolar externo 2N3904, RE = 22 ohm, C1 = C2 = C3 = 2,2 nF (p. 5).'
- 'INL (-1,5 a 2,6 µA) e DNL (±0,2 µA) estão em µA, sem símbolo equivalente em LSB no esquema; não transcritos (p. 5).'
- 'Corrente de erro baixa 3,375 mA e alta 21,75 mA (valores padrão) (p. 5).'
