# Fonte: Texas Instruments, INA219 Zero-Drift, Bidirectional Current/Power Monitor With I2C Interface, SBOS448G, agosto 2008, revisado dezembro 2015.
part_number: INA219
category: ic.energy_meter
schema_version: '1.0'
manufacturer: Texas Instruments
family: INA219 (graus A e B)
package: SOIC-8 (3,91 x 4,90 mm) e SOT-23-8 (1,63 x 2,90 mm)
lifecycle: desconhecido
notes:
- 'Pág. 4: faixa de temperatura ambiente recomendada TA de -25 a 85 °C; a faixa registrada em Top (-40 a 125 °C) é a de operação da tabela de limites absolutos.'
- 'Pág. 1: grau B tem exatidão de 0,5 % máx. sobre a temperatura; a tabela da pág. 5 dá erro de medição de corrente de +/-0,2 % típico e +/-0,5 % máx. a 25 °C.'
- 'Pág. 5: faixa de tensão de shunt a plena escala +/-40, +/-80, +/-160 ou +/-320 mV conforme o PGA; tensão de barramento 0 a 32 V (BRNG = 1) ou 0 a 16 V (BRNG = 0); resolução do A/D de 12 bits, 1 LSB = 10 uV (shunt) e 4 mV (barramento).'
- 'Pág. 6: corrente quiescente de 6 uA típico, 15 uA máx. no modo power-down.'
