notes:
- 'Fila: L298N. O documento cobre L298N, L298HN (Multiwatt) e L298P (PowerSO20).'
- 'Corrente quiescente (pág. 3, VS = 42 V, VSS = 5 V): IS 13 a 22 mA (Ven = H, IL = 0, Vi = L) ou 50 a 70 mA (Vi = H), 4 mA (Ven = L); ISS 24 a 36 mA (Vi = L) ou 7 a 12 mA (Vi = H), 6 mA (Ven = L). Não transcrito como parâmetro.'
- 'Queda total (VCEsat total, pág. 3): 1,80 V (IL = 1 A) e 3,2 V (IL = 2 A) nas colunas típ./máx. da tabela; atribuição de colunas não confirmada, não transcrito.'
- 'Tensão de entrada baixa máx. 1,5 V, alta mín. 2,3 V (pág. 3).'
