notes:
- Decodificador BCD para 7 segmentos com latch (CD4511B), série B de 20 V. Os valores vêm das imagens digitalizadas das págs. 1 a 3 do PDF (sem camada de texto); o validador não consegue conferi-los por
  texto.
- 'Limites absolutos (pág. 1): VDD -0,5 a +20 V; tensão de entrada -0,5 V a VDD + 0,5 V; corrente de entrada ±10 mA; 500 mW por encapsulamento (-55 a +100 °C); 100 mW por transistor de saída.'
- 'IOH: o documento declara capacidade de fornecer até 25 mA nas saídas (Features, pág. 1); registrada como máximo, sem condição de VDD declarada naquele texto.'
- 'Tensão de saída em nível alto (pág. 2) depende da corrente de carga e de VDD; não transcrita em VOH. Corrente de sumidouro IOL mín. a 25 °C (VDD = 5 V, VO = 0,4 V): 0,51 mA (pág. 2).'
- 'Tempos (pág. 3, VDD = 5 V, 25 °C): tPLH de dados típ. 660 / máx. 1320 ns; BL: 350/700 ns (HL) e 400/800 ns (LH); LT: 250/500 e 150/300 ns; transição 40/80 ns (LH) e 125/310 ns (HL); Cin típ. 5 pF.'
- 'Pág. 1 (condições de operação, VDD = 5 V): setup mín. 150 ns, hold 0 ns, largura do strobe mín. 400 ns.'
