notes:
- Documento SN54HC14, SN74HC14 (SCLS085L, revisado em fevereiro de 2025); folha comum às versões SN54HC (militar) e SN74HC (comercial); valores transcritos da coluna comercial SN74HC.
- 'Colunas de temperatura: valores a 25 °C e de -40 a 85 °C; os pares com sufixo @2 repetem o símbolo com outra condição. IOH/IOL máx. valem para toda a faixa; VOH/VOL em VCC = 4,5 V.'
- Corrente de saída contínua máx. de ±25 mA (limite absoluto) registrada em IOH e IOL; corrente por VCC ou GND ±50 mA (pág. 4).
- Valores do ICC a 25 °C são máximos (2 uA) e a 85 °C máximos (20 uA), conforme colunas MAX da tabela.
- 'Entradas Schmitt-trigger (pág. 5, VCC = 4,5 V, 25 °C): VT+ mín. 1,55 / típ. 2,5 / máx. 3,13 V; VT- mín. 0,9 / típ. 1,6 / máx. 2,45 V; histerese mín. 0,4 / típ. 0,9 / máx. 2,1 V. O esquema não tem símbolo
  para limiares, por isso ficaram só em notas.'
