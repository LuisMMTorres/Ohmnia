notes:
- 'Especificações para VDD = 2,7 a 5,5 V, RL = 2 kohm, CL = 200 pF, VREF = VDD, TMIN a TMAX (pág. 5). Colunas A Grade, B Grade e Y Version; usada a coluna A Grade (pior caso).'
- 'Relative accuracy (INL): ±8 LSB típ., ±32 LSB máx. (A Grade) e ±16 LSB máx. (B Grade); DNL ±1 LSB máx., monotônico por projeto (pág. 5).'
- 'Entrada de referência 0,75 V a VDD, impedância de referência típ. 125 kohm (pág. 5).'
- 'Corrente em modo normal 150 uA típ./250 uA máx. com VDD 4,5 a 5,5 V e 140/225 uA com VDD 2,7 a 3,6 V (pág. 6); IS abaixo é o máximo a 4,5-5,5 V.'
- 'Sufixos -1 e -2 definem reset para zero ou meia escala (pág. 2).'
