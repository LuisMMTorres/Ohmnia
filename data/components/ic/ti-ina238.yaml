# Fonte: Texas Instruments, INA238 85V, 16-Bit, High-Precision Power Monitor With I2C Interface, SLYS025B, janeiro 2021, revisado maio 2025.
part_number: INA238
category: ic.energy_meter
schema_version: '1.0'
manufacturer: Texas Instruments
package: DGS (10 pinos)
lifecycle: desconhecido
notes:
- 'Faixa de tensão de shunt +-163.84 mV (ADCRANGE = 0) ou +-40.96 mV (ADCRANGE = 1); tensão de barramento 0 ... 85 V; modo comum -0.3 ... 85 V (p.5).'
- 'Erro de ganho (shunt e barramento) +-0.01 % típ., +-0.1 % máx.; erro total de medição de potência +-0.7 % típ. (listado como máx. em Features: 0.7 % full scale, -40 ... +125 °C) (p.1, p.5).'
- 'Offset do shunt +-1.5 uV típ., +-5 uV máx.; CMRR 140 dB mín. (p.5). Sensor de temperatura interno: +-1 °C máx. a 25 °C (p.6).'
- 'Corrente quiescente 640 uA típ., 750 uA máx. (VSENSE = 0 V); 1.1 mA máx. de -40 a 125 °C; em shutdown 2.8 uA típ., 5 uA máx. (p.6). I2C de alta velocidade até 2.94 MHz com 16 endereços selecionáveis por pino (p.1).'
- 'V_in registra o limite absoluto diferencial das entradas IN+/IN- (+-40 V, p.3); modo comum máx. 85 V.'
