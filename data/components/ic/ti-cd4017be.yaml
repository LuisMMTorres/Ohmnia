manufacturer: Texas Instruments
family: CD4017B / CD4022B
package: DIP-16 (sufixo E), conforme o texto da pág. 1
lifecycle: desconhecido
notes:
- Documento SCHS027C cobre CD4017B (contador de década) e CD4022B (octal); valores transcritos só do CD4017B. Série "B" de 20 V.
- 'As páginas 2 a 6 do PDF são imagens digitalizadas (sem camada de texto): os valores foram lidos nas imagens das págs. 1, 3 e 4; o validador não consegue conferi-los por texto.'
- 'Limites absolutos (pág. 3): VDD -0,5 a +20 V; tensão de entrada -0,5 V a VDD + 0,5 V; corrente de entrada ±10 mA; dissipação por encapsulamento 500 mW (-55 a +100 °C); 100 mW por transistor de saída.'
- 'Corrente de saída mínima a 25 °C com VDD = 5 V (pág. 3): IOL mín. 0,51 mA (VO = 0,4 V) e IOH mín. -0,51 mA (VO = 4,6 V); sem símbolo equivalente no esquema (IOL/IOH são limites máximos).'
- 'Para VDD de 5, 10 e 15 V: VIL máx. 1,5/3/4 V, VIH mín. 3,5/7/11 V, tpd típ. 325/135/85 ns, fCL típ. 5/10/11 MHz (págs. 3-4); aqui só os valores a 5 V.'
- Frequência máxima de clock medida em relação à saída de carry (nota da pág. 4); tpd de reset 265 ns típ. (5 V).
- 'Condições recomendadas (pág. 1): fCL máx. 2,5 MHz a 5 V; largura do pulso de clock 200 ns mín. (5 V).'
