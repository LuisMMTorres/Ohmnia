# Fonte: STMicroelectronics, STM32F103x8 / STM32F103xB Medium-density performance line Arm-based 32-bit MCU, datasheet DS5319 Rev 20, July 2025 (cópia no distribuidor Farnell).
part_number: STM32F103C8T6
category: ic.mcu
schema_version: '1.0'
manufacturer: STMicroelectronics
family: STM32F103x8, STM32F103xB (linha medium-density)
package: LQFP48 7 x 7 mm (sufixo T = LQFP, C = 48 pinos); sufixo 6 = -40 a +85 °C
lifecycle: ativo
notes:
- 'Documento da série STM32F103x8/xB. Valores de memória, E/S e canais ADC são da variante C8 (48 pinos, 64 KB de flash): Tabela 2 (p. 10) coluna STM32F103Cx e Tabela 1 (p. 1), onde STM32F103C8 pertence ao grupo x8.'
- 'Rótulo de ciclo de vida: o rodapé da p. 1 diz "This is information on a product in full production" (jul/2025).'
- 'Sufixo 6 de temperatura (T6): Top -40 a +85 °C (Tabela 9, p. 38); com sufixo 7, até +105 °C. Tj de operação -40 a +105 °C (sufixo 6).'
- 'Níveis de saída (Tabela 37, p. 64): VOL máx. 0,4 V e VOH mín. VDD-0,4 V com IIO = 8 mA (2,7 V < VDD < 3,6 V). Pinos 5 V tolerantes (FT): VIN até 5,5 V com 2 V < VDD <= 3,6 V (Tabela 9, p. 38).'
- 'Consumo em Run a 72 MHz, todos os periféricos habilitados: máx. 50,0 mA a 85 °C (Tabela 13, p. 41). Soma das correntes em VDD: máx. 150 mA (Tabela 7, p. 37). Tensão de backup VBAT 1,8 a 3,6 V (Tabela 9, p. 38).'
- 'ADC (Tabela 47, p. 74): VDDA 2,4 a 3,6 V quando o ADC é usado; fADC 0,6 a 14 MHz; taxa de amostragem 0,05 a 1 MHz; entrada 0 a VREF+; RAIN máx. 50 kohm.'
- 'pwm_ch não transcrito: o datasheet descreve três timers de uso geral de 16 bits com até 4 canais IC/OC/PWM cada e um timer avançado (controle de motor) (p. 1), sem somar canais para a variante C8.'
