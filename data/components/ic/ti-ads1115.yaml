# Fonte: Texas Instruments, ADS1113, ADS1114, ADS1115 Ultra-Small, Low-Power, I2C-Compatible, 860SPS, 16-Bit ADCs, SBAS444E, May 2009 - Revised December 2024.
part_number: ADS1115
category: ic.adc
schema_version: '1.0'
manufacturer: TI
family: ADS111x
package: X2QFN-10 (2 x 1,5 x 0,4 mm), SOT-10 (2,9 x 2,8 x 0,6 mm) e VSSOP-10 (p. 1 e p. 4)
lifecycle: desconhecido
notes:
- 'O documento cobre ADS1113, ADS1114 e ADS1115; o ADS1115 tem quatro entradas single-ended ou duas diferenciais, com comparador e PGA (p. 1).'
- 'Taxa de dados programável de 8 a 860 SPS (p. 1 e 5); 860 SPS = 0,86 kSPS.'
- 'Faixa de fundo de escala (FSR) programável de ±0,256 V a ±6,144 V; tensão nos pinos analógicos limitada a VDD + 0,3 V (p. 4).'
- 'Características elétricas a VDD = 3,3 V, 8 SPS, FSR = ±2,048 V (p. 5).'
