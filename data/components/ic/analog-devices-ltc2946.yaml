notes:
- 'Fila: LTC2946. Documento 2946f; também descreve o LTC2946-1 (saída de dados invertida).'
- 'Temperatura de operação (pág. 2): LTC2946C 0 a 70 °C; I -40 a 85 °C; H -40 a 125 °C; MP -55 a 125 °C. Registrado o grau I.'
- 'Alimentação INTVCC 2,7 a 5,8 V (pág. 3). Corrente de shutdown de VDD 15 a 40 uA; IQ < 40 uA (pág. 1).'
- 'Exatidão: +-0,6 % para corrente e carga; +-1 % para potência e energia (pág. 1). Registrado o pior caso (1 %).'
