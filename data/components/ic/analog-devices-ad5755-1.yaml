# Fonte: Analog Devices, AD5755-1 Quad, 16-Bit, Serial Input, 4-20 mA and Voltage Output DAC with Dynamic Power Control and HART Connectivity, Rev. E, 2011-2012 (edição em chinês do datasheet, cópia Octopart).
part_number: AD5755-1
category: ic.dac
