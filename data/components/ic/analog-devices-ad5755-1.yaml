lifecycle: desconhecido
notes:
- 'O PDF é a edição em chinês (ADI中文版) do datasheet; trechos de origem citados no texto chinês, valores numéricos conferidos nas tabelas de especificação (págs. 5 a 8).'
- 'Especificações com AVDD = VBOOST_x = 15 V, AVSS = -15 V/0 V, DVDD 2,7 a 5,5 V, AVCC 4,5 a 5,5 V, REFIN 5 V, DC-DC desabilitado; saída em tensão RL = 1 kohm, CL = 220 pF; em corrente RL = 300 ohm (pág. 5).'
- 'Faixas de saída em tensão 0-5 V, 0-10 V, ±5 V, ±10 V (mais 20 % de sobrefaixa: 0-6 V, 0-12 V, ±6 V, ±12 V); em corrente 0-20 mA, 4-20 mA, 0-24 mA (págs. 5 e 6).'
- 'TUE máx. ±0,04 % FSR (tensão) e ±0,05 % FSR (corrente, RSET externo) (pág. 5 e 6); INL ±0,006 % FSR máx.; em % FSR não cabe no símbolo INL (LSB).'
- 'Alimentação: AVDD 9 a 33 V; AVSS -26,4 V a -10,8 V ou 0 V; DVDD 2,7 a 5,5 V; AVCC 4,5 a 5,5 V (pág. 7). O VS abaixo é AVDD.'
- 'Tempo de acomodação em tensão: 11 us (degrau de 5 V, faixa 0-5 V) e 18 us (degrau de 10 V, faixa 0-10 V) a ±0,03 % FSR (pág. 8); a coluna típ./máx. do segundo valor não ficou clara, registrado 11 us como típ.'
- 'AIDD 8,6 mA típ. e 10,5 mA máx. (todos os canais em modo tensão, sem carga) (pág. 8).'
