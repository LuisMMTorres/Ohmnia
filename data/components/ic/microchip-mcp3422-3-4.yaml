# Fonte: Microchip, MCP3422/3/4 18-Bit, Multi-Channel Delta-Sigma Analog-to-Digital Converter with I2C Interface and On-Board Reference, DS22088C, 2009.
part_number: MCP3422/3/4
category: ic.adc
schema_version: '1.0'
manufacturer: Microchip
family: MCP342x
package: DFN-8 (2x3), MSOP-8 e SOIC-8 (resistências térmicas, p. 7); o MCP3424 tem mais pinos
lifecycle: desconhecido
notes:
- 'Fila: DS22088C. O documento cobre MCP3422 e MCP3423 (2 canais diferenciais) e MCP3424 (4 canais diferenciais); as propriedades elétricas são as mesmas (p. 1-2).'
- 'Número de canais transcrito para o MCP3424 (máximo da família).'
- 'ADC delta-sigma com referência interna de 2,048 V, PGA de ganho 1, 2, 4 ou 8 e interface I2C (p. 1).'
- 'Taxa de dados: 3,75 SPS (18 bits), 15 SPS (16 bits), 60 SPS (14 bits), 240 SPS (12 bits) (p. 1 e p. 5).'
- 'INL: 10 ppm do fundo de escala típ., 35 ppm máx. (p. 5); unidade ppm do FSR, sem símbolo equivalente no esquema.'
- 'Especificações a VDD = 5 V, TA = -40 a +85 °C (p. 5).'
