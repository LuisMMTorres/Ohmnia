# Fonte: Microchip, MCP4901/4911/4921 8/10/12-Bit Voltage Output Digital-to-Analog Converter with SPI Interface, DS22248A, 2010.
part_number: MCP4901/4911/4921
category: ic.dac
schema_version: '1.0'
manufacturer: Microchip
family: MCP49x1
package: PDIP-8, SOIC-8, MSOP-8 e DFN (p. 1)
lifecycle: desconhecido
notes:
- 'Fila: DS22248A. O documento cobre MCP4901 (8 bits), MCP4911 (10 bits) e MCP4921 (12 bits); resolução, INL e DNL transcritos para o MCP4921, o de maior resolução (p. 3).'
- 'Para o MCP4901 e o MCP4911: INL ±1 LSb máx. (8 bits) e ±3,5 LSb máx. (10 bits) (p. 3).'
- 'DAC de um canal, saída de tensão rail-to-rail, ganho selecionável 1x ou 2x, referência externa (p. 1).'
- 'Especificações a VDD = 5 V, VREF = 2,048 V, ganho 2x, RL = 5 kΩ, CL = 100 pF, TA = -40 a +85 °C (p. 3).'
- 'Corrente de alimentação: 175 µA típ. e 350 µA máx. a VDD = 5 V; 125 µA típ. e 250 µA máx. a VDD = 3 V (p. 3).'
