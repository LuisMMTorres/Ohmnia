- 'Documento preliminar (Preliminary Technical Data, Rev. PrL) com campos ainda TBD; valores abaixo são do AD7606 de 8 canais (pág. 1, 3 e 4).'
- 'Faixas de entrada bipolares ±10 V (RANGE = 1) e ±5 V (RANGE = 0); impedância de entrada típica 1 Mohm; grampo de proteção tolera ±16,5 V (pág. 1 e 3).'
- 'Tempo de conversão máx. 4 us com todos os 8 canais; vazão máx. 200 kSPS por canal (pág. 4).'
- 'ITOTAL em operação a 200 kSPS: típ. 16 mA, máx. 21 mA (pág. 4). VDRIVE (E/S digital) 2,3 a 5,25 V (pág. 4).'
- 'Versão B: -40 a +85 °C (pág. 3 nota 1 e pág. 9).'
