notes:
- 'O documento cobre ADS1255 e ADS1256; só o ADS1256 tem quatro entradas diferenciais ou oito single-ended (p. 1).'
- 'Especificações a AVDD = 5 V, DVDD = 1,8 V, fCLKIN = 7,68 MHz, PGA = 1 e VREF = 2,5 V, de -40 °C a +85 °C (p. 3).'
