# Fonte: Texas Instruments, AMC1311x High-Impedance, 2-V Input, Reinforced Isolated Amplifiers, SBAS786C, dezembro 2017, revisado junho 2022.
part_number: AMC1311
category: ic.interface
schema_version: '1.0'
manufacturer: Texas Instruments
family: AMC1311 / AMC1311B
package: DWV (SOIC, 8 pinos)
lifecycle: desconhecido
notes:
- 'Fila: AMC1311. Amplificador isolado reforçado de entrada de alta impedância (2 V, ganho 1) para medição isolada de tensão; categoria ic.interface escolhida por falta de categoria própria (sensor.voltage exige V_PN, que o datasheet não declara). Valores cobrem AMC1311 e AMC1311B.'
- 'Entrada: faixa linear especificada -0.1 ... 2 V, clipping em 2.516 V, resistência de entrada 1 Gohm típ., ganho nominal 1 V/V, saída diferencial (VCMout 1.39 ... 1.49 V) (p.6, p.10).'
- 'AMC1311: alimentação alto lado VDD1 4.5 ... 5.5 V; AMC1311B: VDD1 3 ... 5.5 V (p.6). Erro de ganho: 1311 +-1 % máx., 1311B +-0.2 % máx.; offset: 1311 +-9.9 mV, 1311B +-1.5 mV máx. (p.10).'
- 'Banda de saída: AMC1311 100 mín./220 típ. kHz; AMC1311B 220 mín./275 típ. kHz (p.10). CMTI: 1311 15 mín./30 típ. kV/us; 1311B 100 mín./150 típ. kV/us (p.10).'
- 'Isolação: 5000 VRMS por 1 min (UL1577), reforçada até 7000 VPK (VDE 0884-17), tensão de trabalho até 1500 VRMS (p.1, p.3).'
- 'Corrente de alimentação: IDD1 7.1 típ./9.7 mA máx. (4.5 ... 5.5 V, SHTDN baixo); IDD2 5.9 típ./8.1 mA máx. (p.11). Faixa Top: AMC1311 -40 ... 125 °C; AMC1311B -55 ... 125 °C (p.6).'
