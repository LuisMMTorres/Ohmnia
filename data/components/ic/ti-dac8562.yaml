# Fonte: Texas Instruments, DACxx6x Dual 16-, 14-, 12-Bit, Low-Power, Buffered, Voltage-Output DACs With 2.5-V, 4-PPM/°C Internal Reference (DAC7562/7563/8162/8163/8562/8563), SLAS719E, August 2010 - Revised June 2015.
part_number: DAC8562
category: ic.dac
schema_version: '1.0'
manufacturer: Texas Instruments
family: DACxx6x
package: WSON-10 (DSC, 3 x 3 mm) e VSSOP-10 (DGS) (p. 1 e p. 5)
lifecycle: desconhecido
notes:
- 'O documento cobre DAC7562/7563 (12 bits), DAC8162/8163 (14 bits) e DAC8562/8563 (16 bits); o DAC8562 é de 16 bits com power-on reset em zero (os DACxx63 iniciam em meia escala) (p. 1).'
- 'Referência interna de 2,5 V (4 ppm/°C típ.), saída de tensão de 0 a AVDD, dois canais (p. 1 e p. 6).'
- 'Corrente de alimentação a AVDD = 3,6 a 5,5 V, modo normal: 0,25 mA típ. e 0,5 mA máx. com referência interna desligada; 0,9 mA típ. e 1,6 mA máx. com referência ligada (p. 8).'
- 'Relative accuracy do DAC856x: ±4 LSB típ., ±12 LSB máx. (p. 6).'
