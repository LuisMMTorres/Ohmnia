# Fonte: Espressif, ESP8266EX Datasheet, Version 7.1 (NRND), 2025.11.
part_number: ESP8266EX
category: ic.mcu
schema_version: '1.0'
manufacturer: Espressif
family: ESP8266
package: QFN32 (5 mm × 5 mm) (p. 7)
lifecycle: nrnd
notes:
- 'O PDF da fila (NodeMCU ESP8266) é o datasheet do chip ESP8266EX; a placa NodeMCU usa este chip. Registro do chip, não da placa.'
- 'Documento marcado "NOT RECOMMENDED FOR NEW DESIGNS" (p. 1). Sem ROM programável: o programa fica em flash SPI externa, até 16 MB, mínimo 512 kB sem OTA (p. 13).'
- 'RAM: espaço de heap + dados disponível ao usuário < 50 kB no modo Station conectado ao roteador (p. 13); não há tamanho total de SRAM declarado.'
- 'Níveis de E/S (Tabela 5-1, p. 24): VIL = -0,3 V a 0,25×VIO; VIH = 0,75×VIO a 3,6 V; VOL max 0,1×VIO; VOH min 0,8×VIO. VIO = domínio de alimentação digital/E/S VDDPST de 1,8 V a 3,6 V (p. 10).'
- 'Corrente máxima por pino IMAX = 12 mA (Tabela 5-1, p. 24). ESD HBM 2 kV, CDM 0,5 kV (p. 24).'
- 'ADC: um SAR de 10 bits no pino TOUT (pino 6), mede VDD3P3 ou a tensão em TOUT, não ambos ao mesmo tempo (p. 22). PWM: 4 interfaces, implementadas por software, frequência de 100 Hz a 1 kHz (p. 21).'
- 'Corrente de operação média 80 mA (p. 7).'
