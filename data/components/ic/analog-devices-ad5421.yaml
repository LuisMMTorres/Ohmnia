# Fonte: Analog Devices, AD5421 16-Bit, Serial Input, Loop-Powered, 4 mA to 20 mA DAC Data Sheet, Rev. H (cópia Chipsmall).
part_number: AD5421
category: ic.dac
schema_version: '1.0'
manufacturer: Analog Devices
package: TSSOP 28 pinos ou LFCSP 32 pinos
lifecycle: desconhecido
notes:
- 'DAC de 16 bits alimentado pelo próprio laço 4-20 mA; faixas selecionáveis por pino 4-20 mA, 3,8-21 mA e 3,2-24 mA (pág. 2).'
- 'Especificações com tensão de laço 24 V, REFIN 2,5 V externo, RL = 250 ohm, NMOS externo (pág. 6). Valores de TUE e INL dependem do grau (A, B, C) e do RSET interno/externo; INL do grau C (RSET interno) ±0,0035 % FSR máx. e do grau A ±0,024 % FSR (pág. 6); INL em % FSR não cabe no símbolo INL (LSB).'
- 'TUE máx. ±0,126 % FSR (grau C), ±0,18 % (B), ±0,27 % (A) com RSET interno; 0,05 % máx. citado nas Features do grau C com RSET externo (pág. 2 e 6).'
- 'Tensão de laço 5,5 V a 52 V (pág. 2). Compliance de saída LOOP- + 5,5 V (REGOUT < 5,5 V) ou LOOP- + 12,5 V (REGOUT = 12 V) com 24 mA (pág. 7).'
- 'Corrente quiescente 260 uA típ., 300 uA máx.; IODVDD 1,71 a 5,5 V (pág. 9).'
- 'Tempo de acomodação da corrente de laço 50 us até 0,1 % FSR com CIN aberto; slew 400 uA/us (pág. 11).'
- 'Correntes de alarme: abaixo da escala 3,2 mA; acima 22,8 mA ou 24 mA (pág. 2).'
