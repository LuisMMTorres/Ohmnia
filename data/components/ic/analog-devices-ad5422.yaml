# Fonte: Analog Devices, AD5412/AD5422 Data Sheet (Single Channel, 12-/16-Bit, Serial Input, Current Source and Voltage Output DACs, HART Connectivity), Rev. N, 2009-2017 (cópia Farnell).
part_number: AD5422
category: ic.dac
schema_version: '1.0'
manufacturer: Analog Devices
family: AD5412/AD5422
package: TSSOP_EP 24 pinos ou LFCSP 40 pinos
lifecycle: desconhecido
notes:
- 'O datasheet cobre AD5412 (12 bits) e AD5422 (16 bits); os valores abaixo são do AD5422 (pág. 1 e 5).'
- 'Saída em corrente: 4-20 mA, 0-20 mA ou 0-24 mA; saída em tensão: 0-5 V, 0-10 V, ±5 V, ±10 V com 10% de overrange (pág. 1 e 5).'
- 'AVDD 10,8 V a 40 V; AVSS de -26,4 V a -3 V ou 0 V; conformidade de laço de corrente AVDD - 2,5 V (pág. 1).'
- 'Tempo de acomodação: saída em corrente 10 us (passo de 16 mA a 0,1% FSR); saída em tensão típico 8 us (passo de 512 LSB a ±0,03% FSR) (pág. 10).'
- 'Corrente AIDD: com saída em corrente habilitada típ. 3,4 mA, máx. 4 mA; com saída em tensão habilitada típ. 3,9 mA, máx. 4,4 mA (pág. 8); registrado IS máx. 4,4 mA.'
- 'HART disponível apenas no encapsulamento LFCSP (pág. 1).'
