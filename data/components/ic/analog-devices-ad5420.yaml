# Fonte: Analog Devices, AD5410/AD5420 Data Sheet (Single-Channel, 12-/16-Bit, Serial Input, 4 mA to 20 mA, Current Source DAC, HART Connectivity), Rev. H, 2009-2015 (cópia Farnell).
part_number: AD5420
category: ic.dac
schema_version: '1.0'
manufacturer: Analog Devices
family: AD5410/AD5420
package: 24-lead TSSOP_EP ou 40-lead LFCSP
lifecycle: desconhecido
notes:
- 'O datasheet cobre AD5410 (12 bits) e AD5420 (16 bits); os valores abaixo são do AD5420 (pág. 1 e 4).'
- 'AVDD 10,8 V a 40 V nos modelos AREZ (TSSOP) e 10,8 V a 60 V nos ACPZ (LFCSP) (pág. 1); as especificações da Tabela 1 valem para AVDD 10,8 a 26,4 V (pág. 4).'
- 'Saída em corrente programável 4-20 mA, 0-20 mA ou 0-24 mA; conformidade de saída até AVDD - 2,5 V (pág. 1).'
- 'INL do AD5420 é ±0,024 % FSR (RSET interno) e ±0,012 % FSR (RSET externo); DNL ±1 LSB, monotônico (pág. 4); INL em % FSR não cabe no símbolo INL (LSB).'
- 'Erro total não ajustado (TUE) do AD5420: ±0,3 % FSR (RSET interno) a -40..+85 °C (pág. 4).'
- 'Corrente AIDD: 3 mA com saída desabilitada e 4 mA com saída habilitada (pág. 5); a coluna (mín/típ/máx) não ficou clara no texto, registrado 4 mA como valor máximo.'
