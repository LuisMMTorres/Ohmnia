# Fonte: Espressif, ESP32-S3 Series Datasheet, Version 2.2.
part_number: ESP32-S3
category: ic.mcu
schema_version: '1.0'
manufacturer: Espressif
family: ESP32-S3
package: QFN56 (7 × 7 mm) (p. 1)
lifecycle: desconhecido
notes:
- 'O PDF da fila (ESP32-S3-DevKitC-1) é o datasheet do SoC da série ESP32-S3; a placa ESP32-S3-DevKitC-1 usa este chip. Registro do chip, não da placa.'
- 'Valores da série; a variante ESP32-S3 (sem flash/PSRAM no pacote) tem ambiente -40 a 105 °C (Tabela 1-1, p. 13). Variantes: ESP32-S3FN8, S3RH2, S3R8, S3R16V, S3FH4R2 (p. 1).'
- 'Sem flash de programa no chip ESP32-S3 base (Tabela 1-1, p. 13: In-Package Flash "-"); as variantes FN8 (8 MB) e FH4R2 (4 MB) trazem flash no pacote.'
- 'Níveis de E/S (Tabela 5-4, 3,3 V, 25 °C, p. 65): VIH = 0,75×VDD a VDD+0,3 V; VIL = -0,3 V a 0,25×VDD; VOH min 0,8×VDD; VOL max 0,1×VDD (VDD = tensão do domínio do pino).'
- 'Correntes (p. 65): fonte IOH típ. 40 mA (VOH >= 2,64 V, PAD_DRIVER = 3); sumidouro IOL típ. 28 mA (VOL = 0,495 V); IIH/IIL máx. 50 nA; pull-up/pull-down internos típ. 45 kΩ.'
- 'Corrente de saída acumulada de E/S: máx. 1500 mA (Tabela 5-1, p. 64). Corrente mínima de entrada acumulada: 0,5 A (Tabela 5-2, p. 64).'
- 'ADC (Tabela 5-5, p. 66): DNL ±4 LSB. USB OTG full-speed e USB Serial/JTAG (p. 4).'
