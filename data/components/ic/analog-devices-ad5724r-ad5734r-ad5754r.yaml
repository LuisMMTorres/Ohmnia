notes:
- 'Documento da série: AD5724R (12 bits), AD5734R (14 bits) e AD5754R (16 bits); bits dá a faixa 12 a 16 (pág. 4).'
- 'INL por modelo: AD5754R ±16 LSB, AD5734R ±4 LSB, AD5724R ±1 LSB (pág. 4); aqui o máximo da série (±16 LSB). DNL ±1 LSB máx. em todos, monotônico.'
- 'Especificações com AVDD 4,5 a 16,5 V, AVSS -4,5 a -16,5 V ou 0 V, REFIN 2,5 V externa, DVCC 2,7 a 5,5 V, RLOAD 2 kohm, CLOAD 200 pF (pág. 4).'
- 'Faixas de saída programáveis por software +5 V, +10 V, +10,8 V, ±5 V, ±10 V, ±10,8 V (pág. 1); tensão de saída até ±10,8 V com AVDD/AVSS = ±11,7 V min e REFIN 2,5 V (pág. 4).'
- 'Corrente AIDD máx. 2,5 mA por canal (saídas sem carga) (pág. 5). TUE máx. ±0,1 % FSR na faixa ±10 V (pág. 4).'
- 'Tempo de acomodação 10 us típ. (12 us máx.) para degrau de 20 V a ±0,03 % FSR; 7,5 us típ. para 10 V (pág. 6).'
