notes:
- 'Controlador/driver de display OLED 128 x 64 (128 segmentos, 64 comuns). VS = VDD (lógica); V_load = VCC (painel).'
- 'V_load: máximo absoluto 16 V (p. 47); faixa de operação VCC 7 V a 15 V (p. 48).'
- 'Corrente máxima por segmento 100 uA e por comum 15 mA (p. 6, Features).'
- 'Corrente de sono: ICC,SLEEP e IDD,SLEEP máx. 10 uA cada (p. 48, display OFF, sem painel).'
