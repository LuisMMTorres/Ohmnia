# Fonte: Texas Instruments, INA260 Precision Digital Current and Power Monitor With Low-Drift, Precision Integrated Shunt, SBOS656C, julho 2016, revisado dezembro 2016.
part_number: INA260
category: ic.energy_meter
schema_version: '1.0'
manufacturer: Texas Instruments
package: PW (TSSOP, 16 pinos)
lifecycle: desconhecido
notes:
- 'Shunt integrado de 2 mohm (resistência de sensoriamento); resistência do encapsulamento IN+ a IN- 4.5 mohm típ.; corrente contínua máx. +-15 A de -40 a 85 °C (p.1, p.6).'
- 'Tensão de barramento 0 ... 36 V (escala do ADC 40.96 V; não aplicar mais de 36 V); modo comum 0 ... 36 V (p.5, p.6).'
- 'Erro de ganho do sistema de corrente 0.02 % típ., 0.15 % máx. a 25 °C (+-15 A); 0.2 % típ., 0.5 % máx. de -40 a 125 °C (+-10 A) (p.6). Offset de corrente +-1.25 mA típ., +-5 mA máx.'
- 'Resolução 1 LSB: corrente 1.25 mA, barramento 1.25 mV, potência 10 mW (p.6). Tempo de conversão do ADC de 140 us a 9.068 ms (p.6).'
- 'Corrente quiescente em desligamento 0.5 uA típ., 2 uA máx. (p.7). Limite absoluto de corrente analógica contínua +-15 A (p.5).'
