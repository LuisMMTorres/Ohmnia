family: LTC4151 / LTC4151-1 / LTC4151-2
package: 10-Lead MSOP, 10-Lead DFN 3 mm x 3 mm, 16-Lead SO
lifecycle: desconhecido
notes:
- 'Monitor de potência no lado alto com ADC de 12 bits (corrente, tensão de entrada e tensão externa) e interface I2C; -1 e -2 têm SDA dividido para optoacopladores (pág. 1).'
- 'Faixa de operação por grau: C 0 a 70 °C, I -40 a 85 °C, H -40 a 125 °C (pág. 2); Top abaixo usa a faixa total entre os graus.'
- 'Erro total não ajustado (TUE) máx. ±1,25 % (condição SENSE+ - SENSE-) e ±1 % / ±0,75 % para VIN e ADIN conforme o grau (pág. 3); tensão de fundo de escala do SENSE 102,4 mV típ.'
- 'Corrente de alimentação em shutdown 120 µA típ. (300 µA máx.), VIN = 12 V (pág. 3). Absolutos máximos: VIN -0,3 a 90 V (pág. 2).'
