# Fonte: Analog Devices (Linear Technology), LTC4151 / LTC4151-1 / LTC4151-2 High Voltage I2C Current and Voltage Monitor, rev. 4151fc (cópia RS).
part_number: LTC4151
category: ic.energy_meter
schema_version: '1.0'
