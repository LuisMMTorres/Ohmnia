family: ESP32-WROOM
package: Módulo 18 × 25,5 × 3,1 mm (p. 3)
lifecycle: nrnd
notes:
- 'O PDF da fila (ESP32-DevKitC) é o datasheet do módulo ESP32-WROOM-32; a placa ESP32-DevKitC usa este módulo. Registro do módulo, não da placa.'
- 'Módulo com chip ESP32-D0WDQ6 (Xtensa LX6 dual-core), cristal de 40 MHz e flash SPI de 4 MB integrados (p. 2). Documento marcado "Not Recommended For New Designs (NRND)" (p. 1).'
- 'Níveis de E/S (Tabela 14, 3,3 V, 25 °C, p. 26): VIH = 0,75×VDD1 a VDD1+0,3 V; VIL = -0,3 V a 0,25×VDD1; VOH min 0,8×VDD1; VOL max 0,1×VDD1 (VDD1 = tensão do domínio de alimentação do pino).'
- 'Correntes (p. 26-27): fonte IOH típ. 40 mA (domínios VDD3P3_CPU e VDD3P3_RTC, VOH >= 2,64 V, drive máximo) e 20 mA (domínio VDD_SDIO); sumidouro IOL típ. 28 mA (VOL = 0,495 V); corrente de entrada IIH/IIL máx. 50 nA; pull-up/pull-down internos típ. 45 kΩ.'
- 'Corrente de saída acumulada de E/S: máx. 1100 mA (Tabela 12, p. 26). Corrente mínima da fonte externa: 0,5 A (Tabela 13, p. 26).'
- 'ADC (Tabela 9, p. 24): DNL ±7 LSB, INL ±12 LSB, taxa de amostragem máx. 200 ksps (controlador RTC). Dois DACs de 8 bits (p. 23).'
- 'Além dos 16 canais LEDC, há PWM de controle de motor com 3 timers (p. 19-20).'
