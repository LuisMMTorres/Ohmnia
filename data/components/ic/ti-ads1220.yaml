schema_version: '1.0'
manufacturer: Texas Instruments
family: ADS1220
package: VQFN-16 (RVA) e TSSOP-16 (PW) (p. 1 e p. 4)
lifecycle: desconhecido
notes:
- 'ADC delta-sigma de 24 bits com PGA (ganho 1 a 128), referência interna de 2,048 V, oscilador interno, duas fontes de corrente de excitação (10 µA a 1,5 mA) e sensor de temperatura interno (p. 1).'
- 'Especificações a AVDD = 3,3 V, AVSS = 0 V, DVDD = 3,3 V, PGA ligado, 20 SPS e VREF externa de 2,5 V (p. 7).'
- 'INL: ±6 ppmFSR típico, 15 ppmFSR máx. (p. 7); unidade em ppm do fundo de escala, sem símbolo equivalente no esquema.'
- 'Taxas de dados: normal 20 a 1000 SPS, turbo 40 a 2000 SPS, duty-cycle 5 a 250 SPS (p. 7).'
- 'Tensão de referência externa: 0,75 V a AVDD - AVSS (p. 6).'
