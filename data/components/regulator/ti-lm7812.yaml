notes:
- Datasheet da família LM340/LM7805/LM7812/LM7815; as colunas e tabelas usadas são as de LM7812 (secao 6.7, VO = 12 V, VI = 19 V, 0 a 125 C).
- Rth_ja e Rth_jc são do TO-220 (NDE), tabela Thermal Information (Rth_jc = RθJC(bot)); a nota de rodapé da página 4 cita para o TO-220 θJA = 54 C/W e θJC = 4 C/W, valores diferentes dos da tabela.
- Regline e Regload são tipicos e máximos a TJ = 25 C; Regline com IO = 500 mA e 14,5 V a 30 V; Regload com 5 mA a 1,5 A.
- IQ máximo a TJ = 25 C; 8,5 mA sobre a faixa de temperatura (página 7).
