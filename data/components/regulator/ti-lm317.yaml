# Fonte: Texas Instruments, LM317 3-Pin Adjustable Regulator, SLVS044Z, September 1997 - revised April 2025.
part_number: LM317
category: regulator.positive
schema_version: '1.0'
manufacturer: Texas Instruments
family: LM317
package: TO-220 (KCS/KCT), TO-263 (KTT), SOT-223 (DCY)
lifecycle: desconhecido
notes:
- Regulador ajustável 1,25 V a 37 V, 1,5 A. O datasheet traz duas versões de chip (legacy e new); os valores de Vref, regulação, IAdj, IL_min, ISC e RR são os da tabela comum, quando há dois valores usou-se o legacy ou o da faixa completa de temperatura.
- Rth_ja e Rth_jc são do TO-220 KCS, chip legacy (Rth_jc = RθJC(bot), caminho para o dissipador). Outros encapsulamentos têm valores diferentes na tabela da página 7.
