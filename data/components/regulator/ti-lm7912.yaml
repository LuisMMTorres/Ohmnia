manufacturer: Texas Instruments
family: LM79XX (LM7905, LM7912, LM7915)
package: TO-220 (NDE0003B)
lifecycle: desconhecido
notes:
- Regulador negativo fixo de -12 V, 1,5 A; valores em módulo, coluna LM7912C da página 3 (condições IOUT = 500 mA, CIN = 2,2 uF, COUT = 1 uF, 0 a 125 C, VIN = -19 V).
- Rth_ja tipico 60 K/W; a tabela da página 4 traz também o valor 40 na coluna Max de θJA (menor que o típico, provável erro do documento), por isso só o típico foi transcrito.
- Regline é o da faixa -30 V a -14,5 V (TJ = 25 C); Regload é com 5 mA a 1,5 A (TJ = 25 C).
- Tj_max é o limite superior da faixa de junção em operação, 0 a 125 C (página 2).
