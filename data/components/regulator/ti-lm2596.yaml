# Fonte: Texas Instruments, LM2596 SIMPLE SWITCHER Power Converter 150-kHz 3-A Step-Down Voltage Regulator, SNVS124G, November 1999 - revised March 2023.
part_number: LM2596
category: regulator.switching
schema_version: '1.0'
manufacturer: Texas Instruments
family: LM2596 (3,3 V, 5 V, 12 V e ajustável)
package: TO-220 5 pinos (NDZ/NDH), TO-263 5 pinos (KTW/KTT)
lifecycle: desconhecido
notes:
- 'Regulador abaixador (buck) com chave de 3 A integrada. Valores da família; as versões de saída fixa (3,3 / 5 / 12 V) e ajustável compartilham os parâmetros da seção 7.9 (página 7).'
- 'Vref é a tensão de realimentação da versão ajustável (página 6): 1,23 V típ.; 1,193 a 1,267 V a TJ = 25 C e 1,18 a 1,28 V de -40 a 125 C.'
- 'Rendimento típico 73 % (VIN = 12 V, ILOAD = 3 A) nas versões de 3,3 V e ajustável (VOUT programada em 3 V); as versões de 5 V e 12 V têm outros valores na página 6, não transcritos.'
- 'Rth_ja depende do encapsulamento e da área de cobre (20 a 50 C/W, nota (4) a (7), página 5); Rth_jc(top) 2 C/W. Não transcritos como parâmetro único.'
- 'Fora do esquema: corrente de standby típ. 80 uA (máx. 200 uA a 25 C, 250 uA de -40 a 125 C), ON/OFF com ON abaixo de 1,3 V típ. (página 7); tensão de saturação da chave 1,16 V típ., 1,4 V máx. com IOUT = 3 A (página 7); corrente de polarização do FB 10 nA típ., 50 nA máx. (página 7).'
