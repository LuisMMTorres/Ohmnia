notes:
- Regulador ajustável negativo, -1,2 V a -37 V, 1,5 A. Valores transcritos em módulo, na coluna LM337 (grau comercial, TJ 0 a 125 °C).
- Rth_ja e Rth_jc são do encapsulamento KCS (TO-220), RθJC(top); outros encapsulamentos têm outros valores na página 4.
