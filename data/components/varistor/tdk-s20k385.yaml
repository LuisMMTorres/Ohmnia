notes:
- 'Documento da série B722*; a peça S20K385 (código B72220S0381K101) tem VRMS = 385 V (págs. 9 e 10). Valores máximos especificados a TA = 105 °C (pág. 9).'
- 'Tensão do varistor Vv a 1 mA com tolerância ±10% (pág. 10); registrada como valor nominal. Tensão de grampeamento vc,max 1025 V a ic = 100 A.'
- 'Faixa de operação (IEC 61051) "40 ... +105 °C" e armazenamento "40 ... +125 °C" no texto extraído (sinal negativo perdido, pág. 2); registradas como -40 a 105 °C e -40 a 125 °C, confirmar no PDF. Rigidez dielétrica ≥ 2,5 kVRMS; resistência de isolação ≥ 100 MΩ (pág. 2).'
- 'Corrente nominal de descarga In (8/20 µs, 15 vezes) = 3000 A (pág. 9).'
