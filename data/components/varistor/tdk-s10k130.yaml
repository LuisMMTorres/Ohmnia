notes:
- 'Documento da série B722*; a peça S10K130 (código B72210S0131K101) tem VRMS = 130 V (págs. 7 e 8). Valores máximos especificados a TA = 105 °C (pág. 7).'
- 'Tensão do varistor Vv a 1 mA com tolerância ±10% (pág. 8); registrada como valor nominal. Tensão de grampeamento vc,max 340 V a ic = 25 A.'
- 'Faixa de operação (IEC 61051) "40 ... +105 °C" e armazenamento "40 ... +125 °C" no texto extraído (sinal negativo perdido, pág. 2); registradas como -40 a 105 °C e -40 a 125 °C, confirmar no PDF. Rigidez dielétrica ≥ 2,5 kVRMS; resistência de isolação ≥ 100 MΩ (pág. 2).'
- 'Corrente nominal de descarga In (8/20 µs, 15 vezes) = 1500 A (pág. 7).'
