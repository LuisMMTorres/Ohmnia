# Fonte: Toshiba, TLP250 Photocoupler GaAlAs Ired & Photo-IC (IGBT / Power MOS FET gate drive), 2005-08-18.
part_number: TLP250
category: optocoupler
schema_version: '1.0'
manufacturer: Toshiba
package: DIP-8 (8-lead DIP, 11-10C4)
lifecycle: desconhecido
notes:
- Fotoacoplador com LED GaAlAs e fotodetector IC com saída totem-pole para acionar gate de IGBT / MOSFET de potência (pág. 1).
- 'Sem símbolo no esquema: corrente de limiar de entrada IFLH máx 5 mA, tpLH e tpHL típico 0.15 us e máx 0.5 us (pág. 3 e 4), ICC máx 11 mA (pág. 3), corrente de pico de saída IOPH/IOPL 1.5 A, imunidade a transitório de modo comum 5000 V/us (pág. 4).'
- 'IC registra a corrente de pico de saída (PW <= 2.5 us, f <= 15 kHz), 1.5 A; V_iso é 2500 Vrms, 1 min, UR <= 60 % (pág. 2).'
- Tempos tr e tf são dados no documento só como "―" (sem valor), por isso omitidos. VS máx cai de 35 V a Ta <= 70 °C para 24 V a Ta = 85 °C (pág. 2).
