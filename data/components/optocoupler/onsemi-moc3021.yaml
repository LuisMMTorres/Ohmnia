# Fonte: onsemi, MOC3010M/MOC3011M/MOC3012M/MOC3020M/MOC3021M/MOC3022M/MOC3023M - 6-Pin DIP Random-Phase Triac Driver Output Optocoupler (250/400 V Peak), Publication Order Number MOC3023M/D, June 2023 - Rev. 3.
part_number: MOC3021
category: optocoupler
schema_version: '1.0'
manufacturer: onsemi
family: MOC301xM / MOC302xM
package: PDIP6 8.51x6.35, 2.54P (6 pinos)
lifecycle: desconhecido
notes:
- Driver de TRIAC de fase aleatória (sem detecção de cruzamento por zero); o documento chama a peça de MOC3021M.
- 'VCEO abaixo é a tensão de bloqueio de pico VDRM do detector: 400 V para MOC302xM (250 V para MOC301xM).'
- 'IFT (corrente de disparo do LED) do MOC3021M: máx. 15 mA (Vmain = 3 V); não há símbolo IFT no esquema.'
- Rigidez dielétrica VISO é rating interno de ruptura com pinos 1-2 comuns e 4-5-6 comuns.
