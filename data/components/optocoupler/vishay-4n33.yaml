# Fonte: Vishay Semiconductors, 4N32 / 4N33 - Optocoupler, Photodarlington Output, High Gain, With Base Connection, Document Number 83736, Rev. 1.3, 20-Apr-04.
part_number: 4N33
category: optocoupler
