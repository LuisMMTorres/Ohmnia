manufacturer: Vishay
family: 4N32 / 4N33
package: DIP-6 (opções SMD-6 X007 e X009)
lifecycle: desconhecido
notes:
- Documento comum aos 4N32 e 4N33 (CTR mínimo 500 % para ambos). O documento foi obtido de um site agregador (nota da fila), confira a origem.
- 'O documento rotula as temperaturas de forma trocada: a linha "Storange temperature" traz o símbolo Tamb com -55 a +150 C e a linha "Operating temperature" traz Tstg com -55 a +100 C. Foram transcritos pelos nomes das linhas (armazenamento -55 a +150 C, operação -55 a +100 C).'
- 'Tempos de chaveamento (página 3, VCC = 10 V, IC = 50 mA, IF = 200 mA, RL = 180 ohm): ton máximo 5,0 us e toff máximo 100 us; o esquema só tem t_r e t_f.'
- VCEO é a tensão de ruptura coletor-emissor BVCEO (30 V, página 1). IC é a corrente de coletor (carga).
- Nenhuma tensão absoluta separada para a saída além das tensões de ruptura (BVCEO 30 V, BVCBO 50 V, BVEBO 8 V, BVECO 5 V).
