notes:
- Documento comum aos 4N35, 4N36 e 4N37 (CTR mínimo 100 % para os três).
- VCEO é o limite absoluto da saída (70 V, página 1); a tensão de ruptura coletor-emissor garantida BVCEO é 30 V mínimo (IC = 1 mA, página 2).
- Tempos de chaveamento (página 3, VCC = 10 V, IC = 2 mA, RL = 100 ohm) - ton e toff 10 us, dados juntos; o esquema só tem t_r e t_f. O documento não traz VCE(sat) para esta série.
- CTR a TA de -55 a +100 C - mínimo 40 e típico 50 %.
