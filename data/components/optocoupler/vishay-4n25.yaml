notes:
- Valores da coluna 4N25 (CTR mínimo 20 % pelo ORDER INFORMATION). VCE_sat e tempos são valores de página 2 e 3 do documento.
- VCEO é o limite absoluto da saída (70 V, página 1); a tensão de ruptura coletor-emissor garantida BVCEO é 30 V mínimo (IC = 1 mA, página 2).
- V_iso = 5000 Vrms é o valor de teste de isolação do documento; os valores registrados no JEDEC para o 4N25 são 2500 V (nota 2, página 2).
- Tempos de subida e descida típicos de 2 us (VCE = 10 V, IF = 10 mA, RL = 100 ohm), dado junto como "tr, tf".
