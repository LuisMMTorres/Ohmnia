# Fonte: onsemi, MOC3031M/MOC3032M/MOC3033M/MOC3041M/MOC3042M/MOC3043M - 6-Pin DIP Zero-Cross Triac Driver Output Optocoupler (250/400 Volt Peak), Publication Order Number MOC3043M/D, September 2022 - Rev. 4.
part_number: MOC3041
category: optocoupler
schema_version: '1.0'
manufacturer: onsemi
family: MOC303xM / MOC304xM
package: PDIP6 8.51x6.35, 2.54P (6 pinos)
lifecycle: desconhecido
notes:
- Driver de TRIAC com detecção de cruzamento por zero; o documento chama a peça de MOC3041M.
- 'VCEO abaixo é a tensão de bloqueio de pico VDRM do detector: 400 V para MOC304xM (250 V para MOC303xM).'
- 'IFT (corrente de disparo do LED) do MOC3041M: máx. 15 mA (Vmain = 3 V); não há símbolo IFT no esquema.'
- 'Zero-cross: tensão de inibição VIH máx. 20 V; fuga em estado inibido IDRM2 máx. 2 mA.'
