notes:
- Temporizador bipolar; os limiares são 2/3 e 1/3 de VCC pelo divisor interno.
- Tabela 5.5 com VCC = 5 V a 15 V e TA = 25 °C, salvo indicação; valores da coluna NA555, NE555, SA555.
- Entradas CONT, RESET, THRES e TRIG não devem passar de VCC (Absolute maximum ratings, p. 4).
- 'Proteção ESD: ±500 V HBM e ±1500 V CDM (p. 4).'
