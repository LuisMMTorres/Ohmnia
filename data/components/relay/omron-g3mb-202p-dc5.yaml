# Fonte: Omron, Solid State Relay G3MB (Low cost Subminiature PCB mounting 2 amp SIP SSR), catálogo págs. 383-386, sem data de revisão.
part_number: G3MB-202P-DC5
category: relay.solid_state
schema_version: '1.0'
manufacturer: Omron
family: G3MB
package: SIP, montagem em PCB, terminais de saída a 7,62 mm (modelo sem "-4"), 24,5 x 20,5 mm máx. (vista inferior)
lifecycle: obsoleto
notes:
- 'Documento marca "NOT FOR NEW DESIGN. Discontinuation planned for April, 2010." (pág. 1).'
- 'Modelo G3MB-202P (7,62 mm, passagem por zero, resistor de entrada e snubber embutidos, 2 A em 100 a 240 VAC), versão de 5 VDC (pág. 1).'
- 'Entrada 5 VDC: faixa de operação 4 a 6 VDC, impedância 440 ohm ±20 % (300 ohm ±20 % nos modelos -UTU), tensão que deve operar 4 VDC máx., deve liberar 1 VDC mín. (pág. 2).'
- 'Corrente de operação 7 a 20 mA; deve operar 7 mA DC máx.; deve liberar 1 mA DC mín. (pág. 2).'
- 'Tensão nominal de carga 100 a 240 VAC, 50/60 Hz, faixa 75 a 264 VAC; corrente de carga 0,10 a 2 A; surto 30 A (60 Hz, 1 ciclo) (pág. 2).'
- 'PIV (VDRM) 600 V; di/dt 40 A/us; I2t 4 A2s; Tj máx. 125 °C; rigidez dielétrica 2500 VAC por 1 min; resistência de isolação 1000 Mohm mín. a 500 VDC (pág. 2).'
- 'Aprovações de carga (pág. 4): uso geral 2 A, 240 VAC; tungstênio 1 A, 240 VAC; motor 1,60 FLA/9,60 LRA, 240 VAC.'
- 'Tempo de operação e de liberação (modelos G3MB-202P): 1/2 ciclo da fonte de carga + 1 ms máx. (pág. 2); depende da frequência da rede, por isso não vai em t_on/t_off.'
