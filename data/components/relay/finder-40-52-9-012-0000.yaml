# Fonte: Finder, 40 SERIES PCB/Plug-in relays 8 - 10 - 12 - 16 A (catálogo VIII-2026), tipo 40.52.
part_number: 40.52.9.012.0000
category: relay.electromechanical
schema_version: '1.0'
manufacturer: Finder
family: 40 Series, tipo 40.52
package: Relé para PCB ou soquete série 95, passo de pinos 5,0 mm, 2 contatos reversíveis (2 CO)
lifecycle: desconhecido
notes:
- 'Código decodificado pela pág. 5: 40.52 = 2 polos; 9 = bobina DC padrão 0,65 W; 012 = 12 V; contatos 0 = AgNi, 0 = CO, 0 = pinos 5,2 mm, 0 = versão padrão.'
- 'Dados de bobina de 12 V DC da tabela "DC coil data 0.65 W standard" (pág. 9): código 9.012, Umin 8,8 V, Umax 18 V, R 220 Ω, corrente 55 mA a UN. Faixa de operação DC (0,73...1,5) UN; tensão de retenção 0,4 UN; tensão de desoperação 0,1 UN (pág. 3).'
- 'Contatos 40.52 (pág. 3): corrente nominal/pico 8/15 A (com AgSnO2 o pico no contato NA é 60 A, 5 ms); carga AC1 2000 VA; AC15 (230 V) 750 VA; motor monofásico 230 V 0,37 kW; capacidade DC1 em 24/110/220 V: 8/0,6/0,25 A; carga mínima 300 mW (5 V/5 mA); contato AgNi.'
- 'Isolação bobina-contatos reforçada (8 mm), impulso 6 kV (1,2/50 µs), rigidez 4000 V AC (pág. 6). Entre contatos abertos 1000 V AC/1,5 kV (pág. 6). Proteção ambiental RT II (pág. 3).'
