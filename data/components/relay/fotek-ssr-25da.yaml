notes:
- Folha da série SSR-DA (modelos 10, 25, 40, 50, 75 A); I_load e I_surge são do SSR-25DA; os demais são "General specification" comuns à série.
- 'I2t para fusível do SSR-25DA: 259 A2s (pág. 3, tabela de especificação); sem símbolo no esquema.'
- 'Tensão de pico suportada: 1200 VAC mín.; tempo de resposta 8,3 ms (60 Hz); tensão de desligamento < 3,5 VDC (pág. 3).'
- 'Tipo de alta tensão SSR-25DA-H: saída 90 a 480 VAC (pág. 3); este registro cobre o tipo padrão.'
- 'Código de modelo (pág. 1): 25 = 25 A; D = entrada 4 a 32 VDC; A = saída AC; sem H = tipo padrão; sem R = controle por passagem por zero.'
- 'A corrente nominal corresponde a carga resistiva; o documento indica dissipador e ventilador conforme a corrente de linha (págs. 4-5).'
