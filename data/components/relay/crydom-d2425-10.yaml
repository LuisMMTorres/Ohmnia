# Fonte: Crydom, Series 1 240 VAC (SSR de painel), Rev. 062211.
part_number: D2425
category: relay.solid_state
schema_version: '1.0'
manufacturer: Crydom
family: Series 1 240 VAC (AC panel mount)
lifecycle: desconhecido
notes:
- 'O item da fila é "D2425-10", mas o documento lista o modelo D2425 (25 A, controle 3-32 VDC); o sufixo "-10" não aparece. Valores abaixo são da coluna 25 A.'
- 'Tensão de operação 24-280 Vrms (47-63 Hz); sobretensão transitória 600 Vpk; corrente mínima de carga 40 mArms (pág. 1).'
- 'Entrada D (3-32 VDC): tensão de ligar máx. 3,0 VDC (4,5 VDC com opção G), tensão de desligar mín. 1,0 VDC, tensão reversa máx. -32 V, impedância nominal 1500 ohm, corrente típica 3,4-20 mA (pág. 2).'
- 'Tempo de ligar máx. 1/2 ciclo e de desligar máx. 1/2 ciclo para controle DC (pág. 2). I2t de fusão (60 Hz, 1/2 ciclo) 259 A2s; Rjc 1,02 °C/W (pág. 1).'
- 'Requer dissipador (curvas de derating na pág. 4, em imagem). Isolação entrada/saída/base 4000 Vrms; capacitância entrada/saída máx. 8 pF (pág. 2).'
