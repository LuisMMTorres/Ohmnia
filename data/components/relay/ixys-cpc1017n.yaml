# Fonte: IXYS Integrated Circuits Division, CPC1017N Single-Pole, Normally Open 4-Lead SOP OptoMOS Relay, DS-CPC1017N-R08, 5/6/2013.
part_number: CPC1017N
category: relay.solid_state
schema_version: '1.0'
manufacturer: IXYS
family: OptoMOS 1-Form-A
package: SOP de 4 terminais
lifecycle: desconhecido
notes:
- 'Resistência em condução máx. 16 ohm (IL=100 mA), típica 6,8 a 7,4 ohm na distribuição da pág. 3; sem símbolo no schema (pág. 1 e 2).'
- 'Corrente de carga contínua de 100 mA a 25 °C reduz linearmente até 80 mA a 80 °C (nota 1, pág. 2). Acima de 60 °C recomenda-se corrente de LED de 3 mA (nota 3, pág. 2).'
- 'Capacitância de saída típica 25 pF (VL=50 V, 1 MHz); capacitância entrada-saída típica 1 pF (pág. 2).'
- 'Queda do LED de entrada VF 0,9 / 1,2 / 1,4 V (mín./típ./máx.) a IF=5 mA; tensão reversa de entrada máx. 5 V (pág. 2).'
- 'Corrente de fuga desligado lida como 1 uA (o símbolo da unidade saiu corrompido no texto da pág. 2): conferir no PDF.'
