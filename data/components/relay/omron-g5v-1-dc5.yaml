# Fonte: Omron, G5V-1 Low Signal Relay (Ultra-miniature, Highly Sensitive SPDT Relay for Signal Circuits), Cat. No. K048-E1-07.
part_number: G5V-1-DC5
category: relay.electromechanical
schema_version: '1.0'
manufacturer: Omron
family: G5V-1
package: PCB, totalmente selado, 12,5 x 7,5 x 10 mm (C x L x A), peso aprox. 2 g
lifecycle: desconhecido
notes:
- 'Modelo G5V-1 (padrão, 70 °C máx.) com bobina de 5 VDC (pág. 1). Tensão que opera (must operate) 80% máx. e tensão que libera (must release) 10% mín. da tensão nominal (pág. 1); não convertidas em V_pickup/V_dropout por serem percentuais (80% de 5 V = 4 V).'
- 'Tensão máxima da bobina: 200% da nominal a 23 °C (pág. 1). Corrente nominal e resistência da bobina medidas a 23 °C com tolerância de ±10%.'
- 'Contatos de liga Au + Ag (single crossbar): carga nominal 0,5 A a 125 VAC e 1 A a 24 VDC; corrente de passagem 2 A; tensão de comutação máx. 125 VAC, 60 VDC; corrente de comutação máx. 1 A; faixa de comutação de 1 mA a 1 A (pág. 1).'
- 'Resistência de contato 100 mΩ máx.; resistência de isolação 1000 MΩ mín.; rigidez entre contatos de mesma polaridade 400 VAC (pág. 2).'
