notes:
- 'Código de pedido (pág. 1, item 3): SRD / 05 VDC / S = selado / L = sensibilidade 0,36 W / C = 1 forma C (SPDT).'
- 'Valores de bobina da linha SRD (High Sensitivity) com código 05, tabela 6 da pág. 2 (a 20 °C).'
- 'Pull-in: 75 % máx. da tensão nominal; drop-out: 10 % mín. da tensão nominal; tensão máxima admissível da bobina: 120 % (pág. 2, tabela 6). Não convertidos em volts por não constarem em V.'
- 'Contatos forma C (pág. 2, tabela 7): resistiva 7 A 28 VDC, 10 A 125 VAC, 7 A 240 VAC; indutiva (cosPhi=0,4 L/R=7 ms) 3 A 120 VAC, 3 A 28 VDC. Potência máx. de comutação 800 VA / 240 W. Material AgCdO.'
- 'Resistência de contato 100 mOhm máx.; resistência de isolamento 100 MOhm mín. (500 VDC); rigidez entre contatos 1000 VAC 50/60 Hz 1 min; peso aprox. 10 g (pág. 2, item 8).'
- A nota da fila dizia que o código não aparece nas 3 primeiras páginas; o código de pedido SRD XX VDC S L C aparece na pág. 1 e a tabela cobre o modelo.
- 'Parâmetros com @2: I_contact = 10 A vale para 125 VAC e 7 A para 28 VDC (carga resistiva); V_contact = 250 V é AC e 110 V é DC.'
