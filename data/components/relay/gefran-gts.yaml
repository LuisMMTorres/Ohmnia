notes:
- 'Fila: dts gts en. Valores da série GTS (GTS-15 a GTS-120); faixas entre os modelos de 15 A a 120 A.'
- 'Controle CC 6-32 V (sufixo D) ou CA/CC 20-260 V (sufixo A), pág. 16. Tensão máxima da saída 20...660 V AC (pág. 16). Frequência 50/60 Hz.'
- 'Tensão não repetitiva: 500 Vp (modelos 230 V), 1200 Vp (modelos 480 V), pág. 16. Corrente de comando com controle CA: <= 8 mA a 260 V.'
- 'Modelos de 120 A exigem ventilador VEN-90 (230 V) ou VEN-91 (115 V), pág. 2. Dissipação: curvas de corrente x temperatura, pág. 16.'
- 'O catálogo também cobre as séries GQ e GTZ, não transcritas aqui.'
