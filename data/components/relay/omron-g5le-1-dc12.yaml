notes:
- 'Modelo G5LE-1 (padrão, SPDT, proteção contra fluxo) com bobina de 12 VDC (pág. 1). O documento não traz a tabela de bobina (resistência, corrente, tensões de operação/liberação); por isso R_coil, P_coil e V_pickup não foram transcritos.'
- 'Carga nominal tipo padrão: 10 A a 120 VAC e 8 A a 30 VDC (resistiva); 5 A a 120 VAC e 4 A a 30 VDC (indutiva, cosφ=0,4) (pág. 1). Material do contato: liga de Ag sem Cd.'
- 'Resistência de contato 100 mΩ máx.; resistência de isolação 100 MΩ mín.; impulso 4500 V (1,2x50 µs) bobina-contatos; rigidez entre contatos de mesma polaridade 750 VAC (pág. 2).'
