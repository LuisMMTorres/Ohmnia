notes:
- A folha cobre WH5 a WH300; valores abaixo são da coluna WH25. Potência medida montado em dissipador de alumínio de 544 cm2, espessura 1 mm (tabela Reference Heatsink Dimensions).
- 'Tolerância e TCR dependem da faixa de resistência: tolerância 1 a 10 %, TCR de 25 a 75 ppm/°C conforme o valor (<10R: 75; 10R a <100R: 50; >=100R: 25).'
- Máximo de 15 A para WH25T (nota 2 da folha).
