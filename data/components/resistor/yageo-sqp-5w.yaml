notes:
- Valores da série SQP/NSP (1 W a 40 W); faixas entre os modelos. O item da fila é "SQP 5W" (SQP500 / SQP5WS = 5 W a 40 °C), mas a folha cobre toda a série.
- 'Potência: 1-2 W a 70 °C; 3-10 W a 40 °C; 15-40 W a 25 °C. Tensão máxima de trabalho dos SQP: 200 V a 1000 V (NSP: raiz de P x R).'
- 'Faixa de resistência: fio 0,015 ohm a 1 kohm; filme 30 ohm a 1 Mohm (SQP). Tolerância F = 1 % (fio), J = 5 %.'
