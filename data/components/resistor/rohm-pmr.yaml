notes:
- 'Fila: PMR (série). Resistor shunt de chapa metálica para detecção de corrente; valores da série PMR (PMR01 a PMR100), faixa entre os modelos (tabela da pág. 1, lida na imagem; texto em japonês).'
- 'Potência nominal: PMR01 0,2 W e PMR03 0,25 W a 70 °C de temperatura ambiente; demais modelos de 1 a 3 W definidos pela temperatura de terminal (80 a 130 °C conforme o modelo e a faixa de resistência).'
- 'Tolerância F (±1 %) e J (±5 %). TCR: 0 a +200 ppm/°C (PMR01), 0 a +150 ppm/°C (PMR03), ±75, ±100 ou ±150 ppm/°C nos demais. Faixa de uso -55 a +155 °C ou -65 a +175 °C. Compatível AEC-Q200.'
- 'PMR100HZP7 (pág. 2): 6432 (2512), 8 W, 0,5 a 1,5 mΩ, F (±1 %), TCR -75 a 0 ppm/°C, -65 a +175 °C; não incluído nos parâmetros da série.'
