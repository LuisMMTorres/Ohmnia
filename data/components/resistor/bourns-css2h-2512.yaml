family: CSS2H-2512
package: SMD 2512 (6.35 x 3.05 mm), tira metálica soldada por feixe de elétrons
lifecycle: desconhecido
notes:
- 'Fila: CSS2H-2512 (série). Valores da série; faixa entre os modelos CSS2H-2512R-L300x ... CSS2H-2512K-5L00x (p.1). O modelo CSS2H-2512C-000 (jumper, < 0.1 mohm / 100 A) não entra na faixa de R.'
- 'O texto extraído do PDF escreve a resistência como "mW"; o código de resistência do datasheet é em miliohms ("Resistance Code (milliohms)", p.1), portanto as unidades foram lidas como mohm.'
- 'Potência nominal a 70 °C (temperatura do terminal) por modelo: L300 6 W; L500 6 W; 1L00 5 W; 1L80 5 W; 2L00 5 W; 2L30 5 W; 3L00 4 W; 3L50 4 W; 4L00 3 W; 5L00 2.5 W (p.1). P_rated registrado como a faixa da série.'
- 'TCR da liga resistiva +-50 ppm/°C (20 ... 60 °C); incluindo terminais de cobre: +-150 (L300), +-100 (L500), +-75 ppm/°C demais (p.1). TCR registrado como o máximo da série.'
- 'Indutância: material tipo R < 2 nH; tipo K < 5 nH (p.1). Tolerâncias disponíveis +-1 % (F) e +-5 % (J) (p.1). Dados do datasheet sem data/revisão visível no texto extraído.'
