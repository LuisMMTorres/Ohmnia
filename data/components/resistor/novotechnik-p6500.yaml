manufacturer: Novotechnik
family: P6500 (P6501)
package: Servo size 20, caixa em duas partes (flange de alumínio anodizado), fixação com 3 garras Z 1-31
lifecycle: desconhecido
notes:
- 'Fila: P6500 e. Potenciômetro de precisão (transdutor de deslocamento angular), rotação contínua, elemento de plástico condutivo.'
- 'Valores de resistência disponíveis: 1, 2 e 5 kohm (P6501 A102, A202, A502); versões adicionais com cursos elétricos de 60°, 90° e 180° e R = 1 e 2,5 kohm (pág. 2).'
- 'Coeficiente de temperatura efetivo da razão tensão de saída/tensão aplicada: típ. 5 ppm/K; repetibilidade 0,002 % (0,007°) (pág. 2).'
- 'Corrente de wiper recomendada <= 1 uA; máx. em caso de falha 10 mA; resistência de isolação >= 10 Mohm (500 VDC); rigidez dielétrica <= 100 uA (500 VAC, 50 Hz) (pág. 2).'
- 'Velocidade máxima 10000 min-1; torque <= 0,15 Ncm; carga no eixo 45 N; massa 80 g; proteção IP 40 (pág. 2).'
- 'Curso mecânico 360° contínuo; vibração 5...2000 Hz, 20 g; choque 50 g, 11 ms (pág. 2).'
