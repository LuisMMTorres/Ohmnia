notes:
- 'Documento da série KTY81; valores do tipo KTY81/210 (Isen(cont) = 1 mA, Tamb = 25 °C em líquido, salvo indicação). Família KTY81/2xx com R25 em torno de 2000 ohm.'
- 'Valores lidos pela web em 2026-11-20 na cópia da NXP do mesmo documento (https://www.nxp.com/docs/en/data-sheet/KTY81_SER.pdf, KTY81_SER_5, Rev. 05), indicada pelo usuário; páginas pelo rodapé dessa cópia. Todos os parâmetros ficam a verificar até a conferência no PDF do catálogo.'
- 'Corrente contínua máx. do sensor (p. 3): 10 mA em ar livre a Tamb = 25 °C; 2 mA em ar livre a Tamb = 150 °C; 1 mA recomendado acima de 100 °C (p. 11).'
- 'Constante de tempo térmica (p. 4): 30 s em ar parado, 5 s em líquido parado, 3 s em líquido em movimento; usado 5 s em t_resp, como no KTY81-110.'
