notes:
- 'Fila: CS81-P3612. Sensor de cor (LED RGB) classificado como fotoelétrico por falta de categoria específica.'
- 'Comprimentos de onda do LED RGB: 640, 525 e 470 nm (pág. 2); lambda não foi preenchido por ser múltiplo.'
- 'Tempo de resposta e frequência de comutação dependem do modo: 500 us / 1 kHz, 160 us / 3 kHz, 85 us / 6 kHz (pág. 2-3). Frequência de 1 kHz medida com razão claro/escuro 1:1.'
- 'Distância de detecção <= 60 mm, tolerância +-9 mm, mancha de luz 13 x 13 mm (pág. 2). Corrente de saída máx. 100 mA a 24 V (pág. 3).'
- 'Tensão de alimentação em rede protegida contra curto-circuito, máx. 8 A; ondulação < 5 Vpp (pág. 2).'
