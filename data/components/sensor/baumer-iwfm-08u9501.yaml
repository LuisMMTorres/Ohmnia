# Fonte: Baumer, Datasheet IWFM 08U9501 Inductive distance measuring sensors (arquivo Baumer_IWFM-08U9501-S35A_EN_20221116_DS), data impressa no PDF 28/3/2017.
part_number: IWFM 08U9501
category: sensor.position
schema_version: '1.0'
manufacturer: Baumer
family: IWFM
package: Retangular 8 mm x 16 mm, zinco fundido niquelado, cabo de 2 m
lifecycle: desconhecido
notes:
- 'Nome na fila: Baumer IWFM-08U9501-S35A EN 20221116 DS; o PDF recebido é a folha do modelo base IWFM 08U9501 (cópia de distribuidor), não traz o sufixo S35A.'
- 'Sensor indutivo de medição de distância, montagem quase-embutida, saída analógica em tensão 0 a 10 VDC (p. 1).'
- 'Erro de linearidade: ± 100 um (p. 1); desvio de temperatura ± 5 % (fundo de escala); tempo de resposta < 1 ms (p. 1). Linearidade não transcrita como parâmetro (schema usa % e o documento dá valor em um).'
- 'Temperatura de operação impressa como "10 ... +60 °C" no PDF (sinal de menos aparentemente ausente); não transcrita para não inventar o limite inferior.'
- 'Resolução: < 0,001 mm (estática) e < 0,005 mm (dinâmica) (p. 1). Carga: resistência de carga > 3000 ohm; proteção contra curto-circuito e polaridade invertida (p. 1).'
