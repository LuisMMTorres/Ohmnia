notes:
- 'Fila: UM30-215113. Sensor ultrassônico de distância, part no. 6036920.'
- 'Faixa de operação 600 ... 6,000 mm; faixa limite 8,000 mm (p. 2). Repetibilidade ±0,15 %; resolução >= 0,18 mm; tempo de saída 60 ms; frequência ultrassônica típica 80 kHz (p. 2).'
- 'Consumo <= 2,4 W sem carga (p. 3). Com 4-20 mA e Vs <= 20 V a carga máx. é 100 ohm; com saída em tensão exige 15 a 30 V (p. 3, notas).'
