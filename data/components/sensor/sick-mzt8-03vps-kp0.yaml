# Fonte: SICK, Online data sheet MZT8-03VPS-KP0 (part no. 1044458), impresso em 2026-09-17.
part_number: MZT8-03VPS-KP0
category: sensor.magnetic
schema_version: '1.0'
manufacturer: SICK
family: MZT8
lifecycle: desconhecido
notes:
- Sensor de cilindro pneumático (ranhura em T, ímã do pistão); a sensibilidade de resposta típica 2,6 mT foi lançada em B_op (rótulo do documento "Response sensitivity, typ."), conferir (p. 2).
- Histerese típica 0,7 mT (p. 2), reprodutibilidade <= 0,1 mT (p. 3), distância de sobrecurso típica 3 mm (p. 2), atraso de disponibilidade 25 ms (p. 2).
- Proteção inversão de polaridade, curto-circuito e pulso de ligação; classe de proteção III; LED de status; sem teach-in (p. 2-3). IP67/IP68 (p. 2).
- Cabo com conector M8 de 3 pinos, 0,3 m, para corrente de arrasto (p. 3). MTTFD 2.289 anos (p. 3).
