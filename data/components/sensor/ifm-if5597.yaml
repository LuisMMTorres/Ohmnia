notes:
- "Nome na fila: IF5597. Documento em francês, sensor indutivo PNP/NPN, saída NA/NF selecionável (p. 1)."
- "Vdrop é a queda de tensão máxima da saída DC (4,6 V); Ir é a corrente residual máxima (0,5 mA); IL é a corrente de saída contínua (400 mA); corrente mínima de saída 4 mA (p. 1)."
- "Alcance real Sr 4 mm ±10 %; alcance de trabalho 0 a 3,25 mm (p. 1). Deriva do ponto de comutação -10 a 10 % de Sr (p. 2)."
- "Fator de correção: aço 1, inox 0,7, latão 0,4, alumínio 0,3, cobre 0,2 (p. 1). MTTF 1815 anos (p. 2)."
- "Proteções: inversão de polaridade, curto-circuito (pulsado), sobrecarga (p. 1). Classe de proteção II (p. 1). Indicação: 1 LED amarelo (p. 2)."
