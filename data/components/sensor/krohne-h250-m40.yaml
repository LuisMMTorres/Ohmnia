# Fonte: KROHNE, Technical Datasheet H250 M40, 4000685607 TD H250-M40 R07, 09/2022.
part_number: H250 M40
category: sensor.flow
schema_version: '1.0'
manufacturer: KROHNE
family: H250 M40 (medidor de vazão de área variável com flutuador)
lifecycle: desconhecido
notes:
- 'Item da fila: "TD H250M40 en 210426 4001025607 R08". O PDF baixado é a revisão R07 (09/2022), 4000685607.'
- 'Medidor de vazão de líquidos, gases e vapores por flutuador; indicador M40 mecânico (sem alimentação) ou com módulos eletrônicos ESK4A (4-20 mA HART 7), ESK4-T, ESK4-FF (FOUNDATION Fieldbus), ESK4-PA (PROFIBUS PA) (p.8).'
- 'Os valores elétricos abaixo valem para o módulo ESK4A (p.15). ESK4-FF e ESK4-PA: alimentação de barramento 9 a 32 VDC, corrente nominal 16 mA, corrente de erro 23 mA (p.16).'
- 'Exatidão: máx. erro permitido 1,5 % do fundo de escala (H250/RR, /HC, /F) e 2,0 % (H250/C, H250H, H250U, 100:1, Low Flow); repetibilidade 0,25 % ou 0,5 % (p.8).'
- 'Temperatura do produto depende da versão: -196 a +300 °C (H250/RR e /HC), até +70 °C com liner PTFE, etc. (p.8 e p.11). Temperatura ambiente -40 a +70 °C (p.11-12).'
- 'Pressão máxima de operação depende da versão (placa de identificação) (p.9). Aquecimento do cone: DN15-50 PS = 40 barg, DN80-100 PS = 25 barg a 300 °C (p.9). Conexões roscadas fêmea soldadas >= 50 barg (p.14).'
- 'Saída em corrente: 4,00 a 20,00 mA = 0 a 100 % da vazão; alarme >21 mA (alterável para 3,6 mA); limite superior 20,24 a 20,56 mA; carga máx. 650 ohm a 30 VDC; carga mín. para HART 250 ohm (p.15-16). Influência da temperatura < 5 uA/K (p.15).'
