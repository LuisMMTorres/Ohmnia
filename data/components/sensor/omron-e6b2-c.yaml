# Fonte: Omron, E6B2-C New General-purpose Incremental Rotary Encoder (datasheet).
part_number: E6B2-C
category: sensor.encoder
schema_version: '1.0'
manufacturer: Omron
family: E6B2-C (E6B2-CWZ6C, -CWZ5B, -CWZ3E, -CWZ1X)
lifecycle: desconhecido
notes:
- "Nome na fila: en-e6b2 c. Valores como faixa entre os quatro modelos (NPN coletor aberto, PNP coletor aberto, saída em tensão, line driver) (p. 2)."
- "VS: 5 VDC -5 % a 24 VDC +15 % (CWZ6C); 12 VDC -10 % a 24 VDC +15 % (CWZ5B); 5 VDC -5 % a 12 VDC +10 % (CWZ3E); 5 VDC ±5 % (CWZ1X); ripple 5 % máx. Limites de VS são os valores nominais, sem tolerância (p. 2)."
- "IS: tabela lista 70 mA, 80 mA e 130 mA máx. para as colunas dos quatro modelos; usado o maior valor da série (p. 2). Corrente de partida de cerca de 9 A por cerca de 0,3 ms ao ligar (nota 1, p. 2)."
- "Resolução 10 a 2000 P/R conforme o modelo (p. 2). Velocidade máx. de resposta 100 kHz (CWZ6C, CWZ1X e CWZ3E) e 50 kHz (CWZ5B) (p. 2)."
- "Saída: coletor aberto 30 VDC máx., 35 mA máx., tensão residual 0,4 V máx. (CWZ6C, CWZ5B); tensão: 20 mA máx., 2 kΩ; line driver AM26LS31 equivalente +-20 mA (p. 2)."
- "Carga no eixo: radial 30 N, axial 20 N; torque de partida 0,98 mN·m máx. (p. 2)."
