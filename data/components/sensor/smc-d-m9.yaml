# Fonte: SMC, Operation Manual No.D-S-OMG0002-E, Solid State Auto Switch D-M9 (série D-M9N/M9P/M9B e versões V), sem data de revisão visível.
part_number: D-M9
category: sensor.magnetic
schema_version: '1.0'
manufacturer: SMC
family: D-M9
lifecycle: desconhecido
notes:
- Documento da série D-M9 (D-M9N NPN 3 fios, D-M9P PNP 3 fios, D-M9B 2 fios; versões V com saída de cabo perpendicular); valores abaixo são da tabela de especificações (p. 18 do PDF, impressa como p. 17) e valem para a série, salvo indicação.
- Chave de estado sólido para cilindros pneumáticos, detecta o ímã do pistão; o documento não informa campo de operação em mT.
- Tensão de alimentação 4,5 a 28 V DC e consumo <= 10 mA são só dos modelos de 3 fios; o D-M9B (2 fios) tem tensão de carga 24 V DC (10 a 28 V DC), corrente de carga 2,5 a 40 mA, queda interna <= 4 V e fuga <= 0,8 mA.
- Corrente de fuga <= 100 uA a 24 V DC (3 fios). Tempo de operação <= 1 ms. LED vermelho indica operação. Choque 1000 m/s2. IP67.
- "Comprimento do cabo e conector conforme código de pedido (p. 9): 500/1000/3000/5000 mm ou pré-cabeado M8/M12."
