notes:
- Sensor indutivo M12, latão, Sn 4 mm, PNP NA, 12...24 V DC, faceado, 3 fios (título, p. 1).
- Faixa de distância sensora "> 2,5...4 mm" (p. 1). Tensão nominal 12...24 V DC com proteção contra inversão de polaridade (p. 1).
- Corrente de comutação <= 200 mA com proteção contra sobrecarga e curto-circuito (p. 1). Atraso de resposta 0,2 ms (p. 1).
