notes:
- 'Documento da família LM35 (SNIS159H); os valores abaixo são as colunas do grau LM35D (0 a 100 °C), tabela 6.7 da pág. 8, com VS = 5 V e ILOAD = 50 uA.'
- 'Pág. 23 (orderable): LM35DT/NOPB em TO-220 (NEB), faixa 0 a 100; pág. 3 observa que o pinout do LM35DT difere do descontinuado LM35DP; a aba é ligada ao GND.'
- 'Pág. 1: erro de não linearidade típico de +/-1/4 °C; autoaquecimento de 0,08 °C em ar parado; impedância de saída 0,1 ohm para 1 mA de carga.'
- 'Pág. 8 (LM35D): erro de linearidade típico +/-0,2 °C (limite +/-0,5 °C); a precisão máxima declarada a 25 °C é +/-1,5 °C (limite testado).'
