# Fonte: Texas Instruments, TMCS1100 1% High-Precision, Basic Isolation Hall-Effect Current Sensor With ±600V Working Voltage, SBOS820C, setembro 2019, revisado junho 2025.
part_number: TMCS1100
category: sensor.current
schema_version: '1.0'
manufacturer: Texas Instruments
family: TMCS1100A1 / A2 / A3 / A4
package: D (SOIC, 8 pinos)
lifecycle: desconhecido
notes:
- 'Valores da família; faixa entre as variantes A1 a A4 (sensibilidades 50, 100, 200, 400 mV/A) (p.1, p.8).'
- 'Erro total tipicamente +-0.4 %, máx. +-0.9 % de -40 a 85 °C (p.1). Erro de sensibilidade +-0.2 % típ./+-0.7 % máx. a 25 °C; +-0.4 %/+-0.85 % de -40 a 85 °C; +-0.5 %/+-1.15 % de -40 a 125 °C (p.8).'
- 'Offset de tensão de saída por variante: A1 +-3, A2 +-5, A3 +-8, A4 +-19 mV máx. (p.8); V_offset registra a faixa da família. Saída com referência externa VREF (GND ... VS) (p.9).'
- 'Corrente RMS contínua admissível: 30 A (25 °C), 25 A (85 °C), 22.5 A (105 °C), 16 A (125 °C) (p.8). I_PN registra o valor a 25 °C.'
- 'Isolação: básica, 3000 VRMS por 60 s (UL 1577), tensão de trabalho 600 VPK (424 VRMS) (p.6); CMTI 50 kV/us (p.8).'
- 'Alimentação: A1 a A3 de 3 a 5.5 V; A4 de 4.5 a 5.5 V (p.4). Corrente quiescente 4.5 mA típ., 5.5 mA máx. a 25 °C, 6 mA máx. de -40 a 125 °C (p.9). Tempo de resposta 6.5 us, atraso de propagação 4 us (p.9). Tempo de ligação 25 ms (p.9).'
