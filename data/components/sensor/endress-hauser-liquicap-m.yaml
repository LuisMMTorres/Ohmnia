# Fonte: Endress+Hauser, Technical Information Liquicap M FMI51, FMI52, TI00401F/00/EN/15.17 (71365411).
part_number: Liquicap M
category: sensor.level
schema_version: '1.0'
manufacturer: Endress+Hauser
family: Liquicap M (FMI51, FMI52)
package: Sonda de haste (FMI51) ou cabo (FMI52); caixas F16, F15, F17, F13, F27, T13
lifecycle: desconhecido
notes:
- "Nome na fila: TI00401F00EN 0511 (índice 332); o documento baixado é a revisão 15.17 (TI00401F/00/EN/15.17)."
- "Medição contínua de nível capacitiva em líquidos; inserto eletrônico FEI50H (4 a 20 mA com HART) ou FEI57C (sinal PFM) (p. 24)."
- "Valores do inserto FEI50H, salvo indicação. FEI57C: alimentação 14,8 V DC da unidade de comutação, consumo máx. 250 mW, tempo de ligação 1,5 s (p. 26-27)."
- "Faixa de medição: capacitância span C = 25 a 4000 pF recomendado (2 a 4000 pF possível); capacitância final máx. 4000 pF (p. 24). Sem símbolo no schema para faixa em pF."
- "Erro: não-repetibilidade máx. ±0,1 %; não-linearidade máx. ±0,5 % (DIN 61298-2) (p. 27). O valor de accuracy transcrito é a não-linearidade."
- "Pressão de processo: sonda 10 mm -1 a 25 bar; sonda 16 mm -1 a 100 bar; sonda 22 mm -1 a 50 bar (p. 12). Alimentação 12 a 36 V DC (área não perigosa); 12 a 30 V (Ex ia); 14,4 a 30 V (Ex d) (p. 26)."
- "Corrente de erro NE43: 22 mA; tempo de ligação FEI50H 14 s; tempo morto t1 ≤ 0,3 s (0,5 s no modo SIL); tempo de integração ajustável 0 a 60 s, padrão 1 s (p. 10, 27-28)."
