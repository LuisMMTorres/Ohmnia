lifecycle: desconhecido
notes:
- 'Sensor digital combinado de umidade, pressão e temperatura (I2C até 3,4 MHz e SPI até 10 MHz; p. 2).'
- 'Pressão: faixa de operação 300 a 1100 hPa; exatidão absoluta ±1,0 hPa (0 a 65 °C, 300 a 1100 hPa) (p. 2 e p. 10-11).'
- 'Consumo: 3,6 uA a 1 Hz com umidade, pressão e temperatura; 0,1 uA em repouso (p. 2).'
- 'Alimentação VDDIO (interface): 1,2 a 3,6 V (p. 8, Table 1).'
- 'Tensão máxima em pino de alimentação: -0,3 a 4,25 V (p. 13, Table 5).'
