# Fonte: GF Piping Systems, FLS F3.00 Paddlewheel Flow Sensor - Instruction Manual (seção Technical data).
part_number: FLS F3.00
category: sensor.flow
schema_version: '1.0'
manufacturer: GF Piping Systems
family: FLS F3.00 (F3.00.H, F3.00.C, F3.00.P)
lifecycle: desconhecido
notes:
- "Nome na fila: fls-f3-00-paddlewheel-flow-sensor-datasheet-en. Manual de instruções com seção Technical data (p. 2-4); valores como faixa entre as versões F3.00.H (5 a 24 VDC, NPN coletor aberto), F3.00.C (3 a 5 VDC ou bateria de lítio 3,6 V) e F3.00.P (12 a 24 VDC, push-pull)."
- "P_max e T_process correspondem ao corpo em aço inox das versões H e P (25 bar a 120 °C), p. 4. Tolerância de alimentação ±10 % regulada nas versões H e P (p. 2-3); não incluída nos limites de VS."
- "IS: versões H e P < 30 mA a 24 VDC; versão C < 10 µA máx. (p. 2-3)."
- "Faixa de velocidade 0,15 a 8 m/s (0,5 a 25 ft/s) (p. 2); não há faixa de vazão volumétrica no texto. Linearidade ±0,75 % do fundo de escala e repetibilidade ±0,5 % do fundo de escala (p. 2)."
- "Saída em onda quadrada, 45 Hz por m/s nominal (13,7 Hz por ft/s) (p. 2-3)."
- "T_process: máximo do corpo em aço inox: 25 bar a 120 °C (H/P) ou 100 °C (C); corpo CPVC 1,5 bar a 80 °C; corpo PVDF 2,5 bar a 100 °C; 10 bar a 25 °C para CPVC e PVDF (p. 4)."
- "Vida útil de 25 anos informada para os limites de pressão/temperatura (p. 4). Cabo padrão 8 m, máx. 300 m (H, P) ou 16 m (C)."
