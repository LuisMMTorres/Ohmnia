# Fonte: Balluff, Laser Reflexlichtschranke / Laser retro-reflective Sensor BOS 18M-../MR-..-LR10-, Nr./No. 860 288 DE/EN, Edition B19.
part_number: BOS 18M-../18MR-..-LR10
category: sensor.photoelectric
schema_version: '1.0'
manufacturer: Balluff
family: BOS 18M / BOS 18MR LR10
package: Corpo roscado M18x1, latão niquelado
lifecycle: desconhecido
notes:
- 'Fila: DS BOS013M EN. Documento da série (códigos BOS013N, BOS013Z, BOS0145, BOS0140, BOS0146); valores da série.'
- 'Alcance: BOS 18M 0,1...2 m; BOS 18MR (ótica angular 90°) 0,1...1,5 m (pág. 2). O parâmetro range abaixo cobre a faixa da série (0,1 a 2 m).'
- 'Laser vermelho classe 1, potência média < 100 uW, frequência de pulso 5 kHz, largura de pulso 4,5 us (pág. 2).'
- 'Atrasos de ligar/desligar: < 333 us na página alemã (pág. 1); a página inglesa (pág. 2) traz "< 333 ms", provável erro de impressão; usado 333 us por coerência com f = 1,5 kHz. Conferir.'
- 'Tensão nominal de operação Ue 24 V, ondulação < 10 %, corrente de operação Ie 100 mA, Ud < 2 V em Ie (pág. 2). Imunidade a luz externa 5 klux (pág. 2). Peso 110 g (cabo) / 60 g (conector).'
- 'Ajuste de sensibilidade por potenciômetro (270 mecânicos).'
