# Fonte: Schneider Electric (Telemecanique Sensors), Product data sheet XT118B1PAL2, 11/10/2026.
part_number: XT118B1PAL2
category: sensor.proximity
schema_version: '1.0'
manufacturer: Schneider Electric
family: XT1 (sensor capacitivo)
package: M18 x 1, cilíndrico
lifecycle: desconhecido
notes:
- Sensor capacitivo M18, latão, Sn 5 mm, PNP NA, cabo 2 m, 12...24 V DC, faceado, 3 fios (título, p. 1). Tensão nominal 24 V DC com proteção contra inversão de polaridade (p. 1).
- Faixa de distância sensora "> 4...8 mm" ajustável por potenciômetro (p. 1). Repetibilidade < 0,1 x Sr (p. 1).
- Histerese "< 0,2 x Sr" (p. 2) lançada como máx. 20 % de Sr (conversão simples), conferir.
- Documento não informa temperatura de operação nem de armazenamento. Atraso de resposta 5 ms; atraso na energização 30 ms (p. 1-2).
