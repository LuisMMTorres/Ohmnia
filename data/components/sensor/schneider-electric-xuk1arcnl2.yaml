- 'Tensão nominal 24...240 V AC/DC; limites 20-264 V AC (pág. 1); VS abaixo transcreve os limites.'
- 'Capacidade de comutação 3 A (cos φ = 1, 0,5 milhão de ciclos a 1 ciclo/s, 250 V); durabilidade elétrica 500000 ciclos (pág. 1).'
- 'Atraso na energização 60 ms; atraso de recuperação 25 ms (pág. 2).'
