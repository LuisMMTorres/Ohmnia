part_number: MZC1-2V2PS-KP0
category: sensor.magnetic
schema_version: '1.0'
manufacturer: SICK
family: MZC1
lifecycle: desconhecido
notes:
- Sensor de cilindro pneumático (ranhura em C, ímã do pistão); a sensibilidade de resposta típica 2,2 mT foi lançada em B_op (rótulo do documento "Response sensitivity, typ."), conferir (p. 2).
- Histerese típica <= 0,8 mT, reprodutibilidade <= 0,1 mT, distância de sobrecurso típica 4 mm (p. 2).
- Proteção inversão de polaridade, curto-circuito e pulso de ligação; classe de proteção III; LED de status; sem teach-in (p. 2-3). IP68 (p. 2).
- Cabo com conector M8 de 3 pinos, 0,3 m, para corrente de arrasto (p. 3). MTTFD 2.461 anos (p. 3).
