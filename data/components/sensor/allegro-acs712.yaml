# Fonte: Allegro MicroSystems, ACS712 Fully Integrated Hall-Effect-Based Linear Current Sensor IC, ACS712-DS Rev. 22, 13 de fevereiro de 2024.
part_number: ACS712
category: sensor.current
schema_version: '1.0'
manufacturer: Allegro MicroSystems
family: ACS712 (05B, 20A, 30A)
package: SOIC-8 (sufixo LC)
lifecycle: desconhecido
notes:
- 'Valores da série; faixas entre as variantes ELC-05B (+/-5 A, 185 mV/A), ELC-20A (+/-20 A, 100 mV/A) e ELC-30A (+/-30 A, 66 mV/A) (pág. 2).'
- 'I_PN registrado como faixa de corrente medida (+/-5 a +/-30 A) entre as variantes; o datasheet não declara corrente nominal eficaz.'
- 'Pág. 1: lista de características cita tempo de subida de 5 us; a tabela da pág. 5 dá 3,5 us típico (IP = IP(max), TA = 25 °C); registrado o da tabela.'
- 'Pág. 5: tensão de saída com corrente zero VIOUT(Q) = VCC x 0,5 (bidirecional); saída ratiométrica à alimentação.'
- 'Pág. 2: tolerância a sobrecorrente transitória 100 A (1 pulso, 100 ms); junção máx. 165 °C; não destinado a aplicações automotivas (pág. 1).'
