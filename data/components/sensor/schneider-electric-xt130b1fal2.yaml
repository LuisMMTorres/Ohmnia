# Fonte: Schneider Electric (Telemecanique Sensors), Product data sheet XT130B1FAL2, 11/10/2026.
part_number: XT130B1FAL2
category: sensor.proximity
schema_version: '1.0'
manufacturer: Schneider Electric
family: XT1 (sensor capacitivo)
package: M30 x 1,5, cilíndrico
lifecycle: desconhecido
notes:
- Sensor capacitivo M30, latão, Sn 10 mm, NA, cabo 2 m, 24...240 V AC, faceado, 2 fios (título, p. 1). Tensão nominal 24...240 V AC 50...60 Hz (p. 1).
- Faixa de distância sensora "8...15 mm" ajustável por potenciômetro (p. 1). Repetibilidade < 0,1 x Sr (p. 1).
- Histerese "< 0,2 x Sr" (p. 2) lançada como máx. 20 % de Sr (conversão simples), conferir.
- Documento não informa temperatura de operação nem de armazenamento. Atraso de resposta 20 ms; atraso na energização 100 ms (p. 1-2).
