# Fonte: LEM, Voltage transducer DVL 1000 (N° 97.H9.60.000.0), Version 7 (Public datasheet), 17 February 2026.
part_number: DVL 1000
category: sensor.voltage
schema_version: '1.0'
manufacturer: LEM
family: DVL
lifecycle: desconhecido
notes:
- 'Transdutor de tensão com saída em corrente e isolação galvânica; medição bipolar até 1500 V (p.1).'
- 'Alimentação bipolar +-UC: valores de VS são o módulo (13,5 a 26,4 V cada polo) (p.4). Máx. absoluta +-26,4 V em operação, +-34 V por 0,1 s (p.2).'
- 'Condições elétricas: TA = 25 °C, +-UC = +-24 V, RM = 100 ohm (p.4). RM máx. 133 ohm, ver figuras 1 e 2 (p.4-5).'
- 'Erro total <= +-0,5 % de UP N a 25 °C e <= +-1 % de -40 a 85 °C (p.4). Offset IO +-50 uA a 25 °C (p.4).'
- 'Tempo de atraso a 90 % do valor final: 50 us typ, 60 us max (passo 0 a 1000 V, 6 kV/us) (p.4). Resistência do primário 11,3 Mohm (p.4).'
- 'Conexões de entrada e saída com terminais M5 (p.1).'
- 'Máx. tensão de modo comum DC <= 4,2 kV (p.3). Isolação: 8,5 kV rms 50 Hz 1 min (p.3).'
