# Fonte: Siemens, SITRANS F M Flow sensor MAG 5100 W, Siemens FI 01, June 2015 (atualização 09/2015), páginas 3/92 a 3/95 do catálogo.
part_number: SITRANS F M MAG 5100 W
category: sensor.flow
schema_version: '1.0'
manufacturer: Siemens
family: SITRANS F M MAG 5100 W (7ME6520 e 7ME6580)
lifecycle: desconhecido
notes:
- 'Item da fila: "sitrans fm mag5100w datasheet en-US". Sensor eletromagnético de vazão para água, esgoto e lodo; a eletrônica é um transmissor separado (MAG 5000, MAG 6000 ou MAG 6000 I) (p.1).'
- 'Dois modelos: 7ME6520 (mercado europeu, liner EPDM ou NBR, DN 15 a 1200) e 7ME6580 (mercado não europeu, liner ebonite, DN 25 a 2000) (p.2).'
- 'Valores abaixo cobrem os dois modelos; ver faixas por DN na p.2. Temperatura do meio: -10 a +70 °C (NBR, EPDM, ebonite); 0,1 a 30 °C para EPDM/NBR (MI-001) (p.3).'
- 'Temperatura ambiente do sensor: -40 a +70 °C (7ME6520) e -20 a +70 °C (7ME6580); com transmissor compacto MAG 5000/6000: -20 a +60 °C (p.2).'
- 'Pressão de operação (absoluta): DN 15-40: 0,01 a 40 bar; DN 50-300: 0,03 a 20 bar; DN 350-1200: 0,01 a 16 bar (7ME6520); DN 25-50: 0,01 a 40 bar, DN 65-1200: 0,01 a 16 bar, DN 1400-2000: 0,01 a 10 bar (7ME6580) (p.2).'
- 'Perda de pressão: máx. 20 mbar a 1 m/s (DN 15 e 25); máx. 25 mbar a 3 m/s (DN 40 a 300) (p.2). Frequência de excitação depende do DN (p.2).'
- 'Pesos, vazões e exatidão por tamanho não estão nas páginas de especificação; ver tabelas de seleção no catálogo. Sem símbolos de alimentação ou saída elétrica: dependem do transmissor.'
