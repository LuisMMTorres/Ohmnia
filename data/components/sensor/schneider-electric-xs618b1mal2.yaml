# Fonte: Schneider Electric (Telemecanique Sensors), Product data sheet XS618B1MAL2, 11/10/2026.
part_number: XS618B1MAL2
category: sensor.proximity
schema_version: '1.0'
manufacturer: Schneider Electric
family: XS6 (Telemecanique Inductive proximity sensors XS, General purpose)
package: M18 x 1, cilíndrico
lifecycle: desconhecido
notes:
- Sensor indutivo M18, latão, Sn 8 mm, cabo 2 m, 24...240 V AC/DC, 2 fios, NA (título, p. 1).
- Faixa de distância sensora "> 4...8 mm" (p. 1). Capacidade de comutação 5...200 mA DC e 5...300 mA AC (p. 1); IL lançado com o valor DC.
- Frequência de comutação <= 1000 Hz em DC e <= 25 Hz em AC (p. 2). Corrente residual 0,8 mA em estado aberto lançada como máximo (documento não diz típico ou máximo), conferir.
- Atraso de resposta 0,5 ms; atraso na energização 25 ms (p. 1-2). Massa 0,12 kg (p. 2).
