lifecycle: desconhecido
notes:
- 'Documento da série KTY81; valores do tipo KTY81/110 (Isen(cont) = 1 mA, Tamb = 25 °C em líquido, salvo indicação).'
- 'Sensor de silício de resistência com coeficiente positivo (PTC), sem alimentação: não há VS. Resistência R25 (p. 1 e 3): mín. 990, máx. 1010 ohm (Isen = 1 mA); típ. 1000 ohm na Tabela 7 (p. 4).'
- 'Razões de resistência (p. 3): R100/R25 = 1,676 a 1,716 (típ. 1,696); R-55/R25 = 0,480 a 0,500 (típ. 0,490). Resistência típ. nos extremos (Tabela 7, p. 4): 490 ohm a -55 °C e 2211 ohm a 150 °C.'
- 'Corrente contínua máx. do sensor (p. 3): 10 mA em ar livre a Tamb = 25 °C; 2 mA em ar livre a Tamb = 150 °C. Deriva de R25: típ. 1,6 ohm em 10000 h a 150 °C (série KTY81/1).'
- 'Constante de tempo térmica (63,2%): típ. 30 s em ar parado, 5 s em líquido parado, 3 s em líquido em movimento (p. 3); usado 5 s (líquido parado) em t_resp.'
- 'Tabela R × T (parâmetros R): valores mín./típ./máx. da Tabela 7 com Isen = 1 mA; a -55 °C só o típico (490 ohm) consta da transcrição. Conferida em 2026-11-20 com o texto do mesmo documento (KTY81_SER_5, Rev. 05) no site da NXP, onde a Tabela 7 aparece no rodapé da p. 5.'
- 'alpha: coeficiente de temperatura típ. 0,79 %/K a 25 °C (p. 3), escrito como 0,0079 1/K; o coeficiente varia com a temperatura (Tabela 7, p. 4).'
