# Fonte: NXP Semiconductors, KTY81 series Silicon temperature sensors, Product data sheet KTY81_SER_5, Rev. 05, 25 April 2008 (cópia no distribuidor Farnell).
part_number: KTY81-110
category: sensor.temperature
