# Fonte: Analog Devices (Maxim Integrated), DS18B20 Programmable Resolution 1-Wire Digital Thermometer, REV: 042208 (cópia no site Adafruit).
part_number: DS18B20
category: sensor.temperature
schema_version: '1.0'
manufacturer: Analog Devices
family: DS18B20
package: 3-pin TO-92; também 8-pin SO (150 mils) e 8-pin uSOP (DS18B20Z, DS18B20U)
lifecycle: desconhecido
notes:
- 'O documento traz a marca Maxim Integrated ("MAXIM 18B20"); a fila nomeia Analog Devices como fabricante.'
- 'Condições da Tabela DC (p. 19): -55 a +125 °C e VDD = 3,0 a 5,5 V. Alimentação local (VDD) ou "parasite power" pela linha DQ (VPU 3,0 a 5,5 V; VDD deve ser aterrado no modo parasita).'
- 'Corrente em espera IDDS típ. 750 nA e máx. 1000 nA (até +70 °C; típ. 3 uA a +125 °C); corrente ativa IDD (conversão ou escrita na EEPROM, VDD = 5 V) típ. 1 mA e máx. 1,5 mA (p. 19). IS máx. transcrito é o valor ativo.'
- 'Resolução programável de 9 a 12 bits (incrementos de 0,5 / 0,25 / 0,125 / 0,0625 °C); padrão 12 bits; conversão em até 750 ms a 12 bits (p. 1 e 3). Deriva: ±0,2 °C em 1000 h a +125 °C, VDD = 5,5 V (p. 19).'
- 'Níveis lógicos do DQ (p. 19): VIL máx. 0,8 V; VIH mín. 2,2 V (alimentação local); corrente de sumidouro mín. 4,0 mA com VI/O = 0,4 V. Faixa absoluta de tensão em qualquer pino: -0,5 V a +6,0 V.'
- 'Tempos de conversão por resolução (Rev 6, 19-7487, Tabela 2, p. 9, lida pela web em 2026-11-20 no link indicado pelo usuário, sem cópia local): 93,75 / 187,5 / 375 / 750 ms em 9 / 10 / 11 / 12 bits (tCONV/8, /4, /2 e tCONV). O modelo usa t_resp (750 ms, p. 1) e divide por 2 a cada bit a menos.'
- 'Cada dispositivo tem código serial único de 64 bits; barramento 1-Wire; alarme com limites não voláteis TH e TL (p. 1).'
