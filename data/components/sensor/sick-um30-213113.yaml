notes:
- 'Fila: UM30-213113. Sensor ultrassônico de distância, part no. 6036918.'
- 'Faixa de operação 200 ... 1,300 mm; faixa limite 2,000 mm (p. 2). Repetibilidade ±0,15 %; resolução >= 0,18 mm; tempo de saída 23 ms; frequência ultrassônica típica 200 kHz (p. 2).'
- 'Consumo <= 2,4 W sem carga (p. 3). Com 4-20 mA e Vs <= 20 V a carga máx. é 100 ohm; com saída em tensão exige 15 a 30 V (p. 3, notas).'
