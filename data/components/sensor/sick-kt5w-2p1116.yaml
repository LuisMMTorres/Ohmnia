notes:
- 'Fila: KT5W-2P1116. Sensor de contraste (LED RGB) classificado como fotoelétrico por falta de categoria específica.'
- 'Comprimentos de onda do LED RGB: 470, 525 e 640 nm (pág. 2); lambda não preenchido por ser múltiplo.'
- 'Mancha de luz 1,2 x 4,2 mm, direção vertical; teach-in estático de 2 pontos (pág. 2).'
- 'Distância de detecção <= 10 mm a partir da borda da lente (pág. 2). Saída protegida contra curto-circuito; sem atraso (pág. 3). Frequência de comutação medida com razão claro/escuro 1:1.'
