# Fonte: Broadcom, ACPL-C87B / ACPL-C87A / ACPL-C870 Precision Optically Isolated Voltage Sensor, Data Sheet AV02-3563EN, September 16, 2024.
part_number: ACPL-C87x
category: sensor.voltage
schema_version: '1.0'
manufacturer: Broadcom
family: ACPL-C87B / ACPL-C87A / ACPL-C870
package: Stretched SO-8 (SSO-8)
lifecycle: desconhecido
notes:
- 'Valores da família; as versões diferem na tolerância de ganho: C87B +-0,5 %, C87A +-1 %, C870 +-3 % (p.1, p.6).'
- 'Amplificador de isolação óptico sigma-delta, entrada 0 a 2 V (faixa plena diferencial 2,46 V), saída diferencial, ganho unitário 1 V/V, impedância de entrada 1 Gohm (p.1, p.6).'
- 'Alimentação: VDD1 4,5 a 5,5 V (lado da entrada) e VDD2 3,0 a 5,5 V (lado da saída) (p.5). VS abaixo é VDD1.'
- 'Corrente IDD1 típ. 10,5 mA / máx. 15 mA (VSD = 0 V); em shutdown 15 uA (típ.). IDD2 típ. 6,5 mA / máx. 12 mA com 5 V (p.7).'
- 'Não linearidade típ. 0,05 % / máx. 0,1 %; deriva de ganho -35 ppm/°C; deriva de offset 21 uV/°C; offset de entrada +-9,9 mV a 25 °C (p.6).'
- 'Atraso de propagação 50 % a 50 %: típ. 3,7 us, máx. 5,5 us (p.6). CMTI mín. 10 kV/us (típ. 15) (p.7).'
- 'Tensão de isolação de trabalho VIORM = 1414 Vpico (IEC/EN/DIN EN 60747-5-5); UL 1577: 5000 Vrms/1 min (p.4, p.7).'
