notes:
- 'Transformador de tensão tipo corrente: entrada pelos pinos 1,2 e saída pelos 3,4 (ou o inverso); corrente nominal de entrada 2 mA (pág. 1, tabela de parâmetros).'
- 'Linearidade ≤0,2% (20% a 120% da corrente nominal) e erro de ângulo de fase ≤20 minutos (entrada 2 mA, resistor de amostragem 100 ohm) (pág. 1). Não há tensão primária nominal declarada.'
- 'Faixa de operação 0 a 1000 V corresponde a 0 a 10 mA com resistor de amostragem 100 ohm (pág. 1).'
