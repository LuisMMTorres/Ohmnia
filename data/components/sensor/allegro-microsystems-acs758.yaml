notes:
- 'Fila: ACS758 (série). Valores da série; faixa entre os modelos 050B/050U, 100B/100U, 150B/150U, 200B/200U (p.3 Selection Guide).'
- 'Datasheet informa NOT FOR NEW DESIGN (data da mudança 14 março 2025; substituição recomendada ACS772 ou ACS773) (p.1).'
- 'Corrente primária nominal registrada em I_PN como faixa entre variantes: 50 a 200 A (bidirecionais +-50 ... +-200 A, unidirecionais 50 ... 200 A) (p.3).'
- 'Tensão de saída quiescente: bidirecional VCC/2; unidirecional 0.6 V típ. (ratiométrica a VCC) (p.7).'
- 'Sensibilidade típ. por variante: 050B 40, 050U 60, 100B 20, 100U 40, 150B 13.3, 150U 26.7, 200B 10, 200U 20 mV/A (p.3).'
- 'Faixas de temperatura por sufixo: E -40 a 85 °C, K -40 a 125 °C, L -40 a 150 °C (p.4); Top registrado é o máximo do conjunto.'
- 'Sobrecorrente típ. IPOC 1200 A a 25 °C (1 s, 1 % duty) (p.5). RthJA 7 °C/W na placa de avaliação (p.5). Carga mín. 4.7 kohm, capacitância máx. 10 nF (p.7).'
