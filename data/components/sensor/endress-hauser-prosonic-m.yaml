manufacturer: Endress+Hauser
family: Prosonic M (FMU40, FMU41, FMU42, FMU43, FMU44)
package: Caixa F12 ou T12 (transmissor compacto)
lifecycle: desconhecido
notes:
- "Nome na fila: TI00365F00EN 1310 (índice 331); o documento baixado é a revisão 17.14 (TI00365F/00/EN/17.14)."
- "Valores da série FMU40 a FMU44; faixas e limites variam entre os modelos. Medição ultrassônica de nível sem contato; saída 4 a 20 mA com HART, PROFIBUS PA ou FOUNDATION Fieldbus (p. 1, 11)."
- "range_m: alcance máximo em líquidos FMU40 5 m, FMU41 8 m, FMU42 10 m, FMU43 15 m, FMU44 20 m; em sólidos a granel 2, 3,5, 5, 7 e 10 m (p. 1). O valor transcrito é o máximo da série (FMU44)."
- "VS: 2 fios HART, tensão nos terminais 8 a 36 V conforme a corrente (14 V mín. a 4 mA, 8 V mín. a 20 mA; 36 V máx. na versão padrão, 30 V Ex) (p. 14). 4 fios: 10,5 a 32 V DC ou 90 a 253 V AC (p. 14)."
- "Exatidão: erro máximo ±0,2 % do span máximo do sensor (EN 61298-2); erro típico ±2 mm (FMU40/41) ou ±4 mm (FMU42/43/44) ou 0,2 % da distância medida, o maior (p. 15)."
- "Tempo de reação mínimo: 2 s (2 fios FMU40 a 43), 3 s (2 fios FMU44), 0,5 s (4 fios) (p. 15). Pressão de processo 0,7 a 3 bar abs. (FMU40/41) ou 0,7 a 2,5 bar abs. (FMU42/43/44) (p. 21)."
- "Frequência de operação aproximada: FMU40 70 kHz, FMU41 50 kHz, FMU42 42 kHz, FMU43 35 kHz, FMU44 30 kHz (p. 10). Carga mínima para HART 250 ohm (p. 11)."
