notes:
- 'Fila: AT (série). Valores da série; faixas entre os modelos -420 / -005 / -010. Transdutor de corrente CA (TC + condicionador).'
- 'Faixas de entrada selecionáveis por jumper: 2 e 5 A (só 4-20 mA), 10/20/50 A, 100/150/200 A (pág. 2, Ordering Information).'
- 'Tempo de resposta (90% do degrau) 100 ms e 300 ms na tabela de especificações; a associação de cada valor ao modelo não ficou legível no texto (pág. 2).'
- 'Faixa de frequência 50-60 Hz e 20-100 Hz (somente formas senoidais), pág. 2. Algoritmo de resposta média (RMS em senoide pura), pág. 1.'
- 'Carga de saída: 1 MΩ mín. nos modelos de tensão; 100 kΩ adicionam 1,3% de erro; modelo 4-20 mA ver gráfico (pág. 2). Limites de saída 8,2 VDC / 15 VDC / 32 mA.'
