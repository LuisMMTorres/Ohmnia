# Fonte: Pepperl+Fuchs, Ultrasonic sensor UB500-F42S-E5-V15 (arquivo 133981_eng.pdf), release date 2025-06-03.
part_number: UB500-F42S-E5-V15
category: sensor.proximity
schema_version: '1.0'
manufacturer: Pepperl+Fuchs
package: M12 x 1 plug, 80 x 34 x 80 mm
lifecycle: desconhecido
notes:
- 'Fila: "133981 eng" (nome de arquivo); produto real UB500-F42S-E5-V15, sensor ultrassônico (categoria sensor.proximity usada por falta de categoria ultrassônica).'
- 'sn registrado como o limite superior da faixa de detecção (500 mm); o datasheet não define distância sensora nominal separadamente (p.1 Technical Data - Sensing range 30 ... 500 mm).'
- 'Faixa de ajuste 50 ... 500 mm, zona morta 0 ... 30 mm, alvo padrão 100 mm x 100 mm, frequência do transdutor aprox. 390 kHz, atraso de resposta aprox. 50 ms (p.1).'
- 'Repetibilidade <= 0.5 % do ponto de comutação; influência da temperatura +-1 % do fundo de escala (p.2).'
