part_number: Cerabar M PMC51, PMP51, PMP55
category: sensor.pressure
schema_version: '1.0'
manufacturer: Endress+Hauser
family: Cerabar M (PMC51, PMP51, PMP55)
package: Caixa de alumínio ou aço inox, conexão de processo roscada, flange, higiênica ou selo diafragma
lifecycle: desconhecido
notes:
- "Nome na fila: TI00436P00EN 0412 (índice 354); o documento baixado é a revisão 32.24-00 de 2024-04-01 (TI00436P/00/EN/32.24-00)."
- "Valores da série PMC51 (célula cerâmica), PMP51 e PMP55 (célula metálica, PMP55 com selo diafragma); limites variam entre modelos e versões. Saídas 4-20 mA, HART 6.0, IO-Link, PROFIBUS PA e FOUNDATION Fieldbus (p. 11)."
- "range_bar: de -1 bar a +400 bar (células de 100 mbar a 400 bar, pressão manométrica) (p. 10). Sobrepressão (OPL) 600 bar na célula de 400 bar (p. 10). Rangeabilidade até 20:1 configurável de fábrica, mais sob consulta (p. 10)."
- "Carga máxima na saída 4-20 mA: RLmax = (UB - 11,5 V) / 23 mA (p. 12); com IO-Link: (UB - 6,5 V) / 23 mA (p. 12). Não transcrito como RL por ser função da tensão."
- "VS: 11,5 a 30 V DC em segurança intrínseca (não para analógico); 11,5 a 45 V DC (35 V DC com conector) para outros tipos de proteção e dispositivos sem certificado (p. 12, 18). IO-Link: 18 a 30 V DC se IO-Link usado, 11,5 a 30 V se só saída analógica (p. 18). PROFIBUS PA e FOUNDATION Fieldbus 9 a 32 V DC (p. 18)."
- "Consumo (p. 18): IO-Link < 60 mA; PROFIBUS PA 11 mA ±1 mA; FOUNDATION Fieldbus 16 mA ±1 mA."
- "Exatidão de referência (p. 24): até ±0,10 % padrão, versão Platinum ±0,075 % (p. 1); varia com a célula e a rangeabilidade (TD), p. ex. célula 100 mbar padrão ±0,15 %. Valor transcrito é o do cabeçalho."
- "Temperatura de processo PMC51: -40 a +100 °C (rosca ou flange), -20 a +130 °C (conexões higiênicas), até 150 °C por no máx. 60 min; com selos diafragma até 400 °C (p. 1, 43)."
