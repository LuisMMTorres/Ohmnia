lifecycle: desconhecido
notes:
- 'Valores da série; faixa entre as variantes de código (Tabela 1, pág. 4): 17 A a 75 A de faixa, 26,7 a 120 mV/A.'
- 'Condições de teste DC: VDD = 5 V (págs. 11 e 12). Faixa de alimentação de operação não localizada no texto; limites absolutos: +8 V sobretensão, +6,5 V mantendo modo de aplicação, -0,3 V reversa (pág. 10).'
- 'Corrente de alimentação IDD típ. 20 mA, máx. 26 mA, sem carga (pág. 11).'
- 'Isolação: 3550 Vrms (SOIC8) e 5400 Vrms (SOIC16) (pág. 13). Resistência do caminho primário: 1,09 mohm (SOIC8) e 0,89 mohm (SOIC16) típ. a 25 C (pág. 12).'
- 'Corrente contínua: ±25 A (SOIC8) e ±30 A (SOIC16) a TA -40 a 85 C (pág. 12). Tempo de resposta máx. 2 us, banda 300 kHz (pág. 14).'
