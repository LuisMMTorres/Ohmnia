lifecycle: desconhecido
notes:
- 'Fila: WLL180T-P434. Amplificador de fibra óptica stand-alone; o alcance depende do cabo de fibra utilizado (pág. 2), por isso o parâmetro range não foi preenchido.'
- 'Tempos de resposta selecionáveis e frequências de comutação correspondentes: 16 us/31,2 kHz, 70 us/7,1 kHz, 250 us/2 kHz, 2000 us/250 Hz, 8000 us/62,5 Hz (pág. 3).'
- 'Funções de tempo: sem atraso, atraso ao desligar, ao ligar, ON e OFF, one shot; atraso programável 0 a 9999 ms (pág. 3).'
- 'LED vermelho visível 650 nm, grupo de risco livre (EN 62471); MTTFD 323 anos (pág. 2). Imunidade a luz ambiente típ.: artificial <= 3000 lx, sol <= 10000 lx (pág. 3).'
- 'Tensão de alimentação 12 a 24 V DC com tolerância +-10 %; ondulação <= 10 % (pág. 3).'
