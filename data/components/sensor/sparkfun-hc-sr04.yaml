notes:
- 'Documento é da Elecfreaks (Tech Support services@elecfreaks.com); fabricante da fila: SparkFun.'
- 'Módulo ultrassônico de medição de distância sem contato, 2 cm a 400 cm, exatidão até 3 mm (p. 1); o schema sensor.proximity não tem símbolo próprio, faixa colocada em sr.'
- 'Pulso de disparo: TTL de 10 us no mínimo; o módulo emite 8 pulsos de 40 kHz; ângulo de medição 15 graus (p. 1).'
- 'Distância = tempo em alto x 340 m/s / 2 (uS/58 = cm); ciclo de medição sugerido acima de 60 ms (p. 2).'
