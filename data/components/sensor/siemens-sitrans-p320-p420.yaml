# Fonte: Siemens, Pressure transmitters for applications with advanced requirements SITRANS P320/P420 - Technical reference, Siemens FI 01, 2023 (páginas 1/95 em diante do catálogo).
part_number: SITRANS P320/P420
category: sensor.pressure
schema_version: '1.0'
manufacturer: Siemens
family: SITRANS P320 / SITRANS P420 (HART)
lifecycle: desconhecido
notes:
- 'Item da fila: "sitrans p320 p420 datasheet en-US". Transmissores digitais de pressão manométrica, absoluta, diferencial, nível e vazão, com HART (p.1-2).'
- 'Valores abaixo são da versão de pressão manométrica (gauge pressure, pressure series), p.12-15. O documento tem ainda as versões de pressão diferencial, absoluta, nível etc. com outros dados; ver o PDF.'
- 'Exatidão (erro de conformidade, p.13): P320 <= 0,075 % e P420 <= 0,065 % para r <= 1,25 (célula de 250 mbar); para células de 1 bar a 160 bar com r <= 5: P320 <= 0,065 %, P420 <= 0,04 %. Fórmulas dependentes de r (relação de faixa) para r maiores.'
- 'Tempo de resposta a degrau T63 <= 0,105 s sem amortecimento elétrico (p.13); p.2 cita 105 ms para pressão e 135 ms para pressão diferencial.'
- 'Saturação inferior 3,55 mA (ajustada de fábrica em 3,8 mA); superior até 22,8 mA (ajustada de fábrica em 20,5 mA ou 22,0 mA); sinal de falha 3,55 a 22,8 mA (p.12-13). Sem HART: R = (UH - 10,5 V)/22,8 mA (p.13).'
- 'Alimentação: 10,5 a 45 V DC; 10,5 a 30 V DC em modo intrinsecamente seguro; ripple <= 0,2 Vpp (p.15). Faixas de medição em pressão manométrica: 250 mbar a 700 bar, conforme a célula (p.12).'
- 'Ex: II 1/2 G Ex ia IIC T4/T5/T6 Ga (p.5); diagnóstico NAMUR NE107, SIL conforme IEC 61508 (p.2).'
