# Fonte: Endress+Hauser, Technical Information Cerabar S PMC71, PMP71, PMP75, TI00383P/00/EN/36.24-00 (71651077), 2024-04-01.
part_number: Cerabar S PMC71, PMP71, PMP75
category: sensor.pressure
schema_version: '1.0'
manufacturer: Endress+Hauser
family: Cerabar S (PMC71, PMP71, PMP75)
package: Caixa de alumínio ou aço inox, conexão de processo roscada, flange ou selo diafragma
lifecycle: desconhecido
notes:
- "Nome na fila: TI00383P00EN 1412 (índice 353); o documento baixado é a revisão 36.24-00 de 2024-04-01 (TI00383P/00/EN/36.24-00)."
- "Valores da série PMC71 (célula cerâmica, pressão manométrica), PMP71 e PMP75 (célula metálica; PMP75 com selo diafragma); faixas e limites variam entre modelos e versões."
- "range_bar: de -1 bar (limite inferior LRL) a +700 bar (célula de 700 bar), cobrindo as células de 100 mbar a 700 bar (p. 11-12). Sobrepressão (OPL): até 1050 bar na célula de 700 bar (p. 12). Rangeabilidade (turn down) até 100:1."
- "VS: 4-20 mA HART 11,5 a 45 V DC em área não perigosa (10,5 V com jumper em posição sem sinal de teste), 11,5 a 30 V DC em segurança intrínseca (p. 22); 1-5 V DC 9 a 35 V DC (p. 22); PROFIBUS PA e FOUNDATION Fieldbus 9 a 32 V DC (p. 23)."
- "Consumo (p. 23): 1-5 V DC 1,8 mA a 9 V e 0,8 mA a 35 V; PROFIBUS PA 13 mA ±1 mA; FOUNDATION Fieldbus 15,5 mA ±1 mA. Carga mínima 100 kΩ na versão 1-5 V (p. 15)."
- "Exatidão de referência (p. 28): até ±0,025 % (melhor caso, célula 2 bar ou 4 bar versão Platinum), ±0,05 % a ±0,075 % padrão com TD ≤ 10:1; valor transcrito é o melhor caso do cabeçalho (p. 1)."
- "Temperatura de processo (p. 47): PMC71 -25 a +125 °C (versão alta temperatura até +150 °C); sem selo diafragma até 150 °C, com selos diafragma típicos até 400 °C (p. 1). Tempo de resposta HART acíclico mín. 330 ms, típico 590 ms (p. 27)."
