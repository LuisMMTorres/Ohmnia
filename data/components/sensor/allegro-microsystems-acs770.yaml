notes:
- 'Fila: ACS770 (série). Valores da série; faixa entre os modelos 050B/050U, 100B/100U, 150B/150U, 200B/200U (p.2 Selection Guide).'
- 'Corrente primária nominal registrada em I_PN como faixa entre variantes: 50 a 200 A (bidirecionais +-50 ... +-200 A, unidirecionais 50 ... 200 A) (p.2).'
- 'Sensibilidade típ. por variante: 050B 40, 050U 80, 100B 20, 100U 40, 150B 13.3, 150U 26.7, 200B 10, 200U 20 mV/A (p.2).'
- 'Faixas de temperatura por sufixo: E -40 a 85 °C, K -40 a 125 °C, L -40 a 150 °C (p.3); Top registrado é o máximo do conjunto.'
- 'Exatidão e offset: valores na p.7 são da variante X050B (erro total +-2.4 % a 25 °C, +-3.5 % a -40...25 °C); outras variantes nas páginas seguintes (não transcritas).'
- 'Tensão de saída quiescente: bidirecional VCC/2; unidirecional 0.5 V típ. (p.6). Sobrecorrente típ. 1200 A a 25 °C (1 s, 1 % duty) (p.4). RthJA 7 °C/W (p.4). Carga mín. 4.7 kohm, capacitância máx. 10 nF (p.6).'
