# Fonte: Analog Devices (Maxim Integrated), MAX6675 Cold-Junction-Compensated K-Thermocouple-to-Digital Converter (0°C to +1024°C), 19-2235; Rev 1; 3/02 (cópia no site Adafruit).
part_number: MAX6675
category: sensor.temperature
schema_version: '1.0'
manufacturer: Analog Devices
family: MAX6675
package: 8-pin SO (MAX6675ISA)
lifecycle: desconhecido
notes:
- 'O documento traz a marca Maxim Integrated; a fila nomeia Analog Devices como fabricante.'
- 'Conversor termopar tipo K para digital com compensação de junta fria; a medição é feita pelo termopar externo (não incluído). Faixa de leitura 0 a +1024 °C (título, p. 1); precisão do termopar de 8 LSB para 0 a +700 °C (p. 1).'
- 'Erro de temperatura (Tabela, p. 2), TA = +25 °C: em +700 °C, -5/+5 LSB (VCC = 3,3 V) e -6/+6 LSB (VCC = 5 V); em 0 a +700 °C, -8/+8 LSB (3,3 V) e -9/+9 LSB (5 V); em +700 a +1000 °C, -17/+17 LSB (3,3 V) e -19/+19 LSB (5 V). Erro de compensação de junta fria: -3,0 a +3,0 °C (TA = -20 a +85 °C).'
- 'Constante de conversão do termopar 10,25 uV/LSB; resolução 0,25 °C; impedância de entrada do termopar 60 kohm (p. 2). Para termopar tipo K a tensão varia 41 uV/°C (p. 4).'
- 'Interface serial SPI (somente leitura, saída de 12 bits): fSCL máx. 4,3 MHz; VIL máx. 0,3 VCC; VIH mín. 0,7 VCC; VOL máx. 0,4 V (ISINK = 1,6 mA); VOH mín. VCC - 0,4 V (ISOURCE = 1,6 mA) (p. 2-3). Tensão de qualquer pino -0,3 V a VCC + 0,3 V.'
- 'Máximos absolutos (p. 2): VCC -0,3 a +6 V; dissipação contínua 471 mW (SO, TA = +70 °C); junção +150 °C. Temperatura de operação -20 a +85 °C (também na Ordering Information, p. 1).'
