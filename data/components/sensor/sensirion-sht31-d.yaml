notes:
- 'O documento cobre a série SHT30, SHT31 e SHT35; os valores transcritos são os da linha SHT31 quando separados por modelo (p. 2).'
- 'Interface I2C até 1 MHz com dois endereços selecionáveis (p. 1).'
- 'Corrente média 1,7 uA com uma medição por segundo na menor repetibilidade, modo single shot; em espera típ. 0,2 uA (p. 6).'
- 'Tempo de resposta da umidade (63 %) aparece como "86 s" no texto extraído, provavelmente 8 s com nota de rodapé; não transcrito (p. 2).'
- 'Faixa de operação absoluta: -40 a 125 °C (p. 7, Table 6).'
