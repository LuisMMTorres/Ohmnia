package: Tubo guia e flutuador em PP ou PVDF, rosca G 1 1/2, G 2, G 3/8 ou G 1/2
lifecycle: desconhecido
notes:
- 'Fila: ds lm5001 en co. Sensor de nível por cadeia reed e flutuador magnético, saída resistiva (3 fios) ou 4-20 mA (2 fios, opcional).'
- 'Resistência total da cadeia reed aprox. 1 a 10 kohm conforme faixa; tensão máx. < 40 V DC na saída resistiva (p. 2).'
- 'Carga na saída 4-20 mA: <= (alimentação - 12 V) / 0,02 A (p. 2). Resolução/exatidão de 24, 12, 10, 6 ou 3 mm conforme opção (p. 2).'
- 'Temperaturas valem para versão PP (-10 a +80 C); versão PVDF: meio -10 a +80 C (opção -30 a +120 C), ambiente e armazenamento -30 a +80 C (p. 2).'
