lifecycle: desconhecido
notes:
- 'Fila: la 55-p e. Fonte do nome: Current Transducer LA 55-P.'
- 'Resistor de medida RM depende da alimentação e de TA: com ±12 V @ ±50 A max, TA=70 °C: 10 a 100 ohm (TA=85 °C: 60 a 95); com ±15 V @ ±50 A max: 50 a 160 ohm (TA=85 °C: 135 a 155). Ver pág. 1.'
- 'Offset é em corrente (não em mV): IO E max ±0,2 mA (IP=0, TA=25 °C); IO T typ ±0,1 / max ±0,6 mA de -25 a +85 °C (pág. 1).'
- 'Consumo IC @ ±15 V: min 8+IS, typ 10+IS, max 12+IS mA (pág. 1).'
- 'Exatidão ±0,65 % @ ±15 V (±5 %); ±0,90 % @ ±12...15 V (±5 %), IP N, TA=25 °C (pág. 1).'
- 'Tempo de atraso a 10 %: < 500 ns; a 90 %: < 1 us para degrau de IP N, di/dt = 200 A/us (pág. 1).'
- 'Isolação: impulso 1,2/50 us 5,7 kV; distância de escoamento e folga 5 mm min (pág. 2). Massa 18 g (pág. 3).'
