lifecycle: desconhecido
notes:
- 'Fila: WTB4FP-22161120A00. Difuso com supressão de fundo (BluePilot, ajuste Teach-Turn), IO-Link V1.1.'
- 'Alcance 4 a 220 mm; limiar de supressão de fundo ajustável 15 a 220 mm; faixa recomendada 40 a 140 mm; objeto de referência 90 % de remissão (pág. 2).'
- 'Mancha de luz puntiforme Ø 4,2 mm a 130 mm; menor objeto detectável típ. 0,2 mm a 130 mm (pág. 2).'
- 'IO-Link: COM2 38,4 kBaud, tempo de ciclo 2,3 ms, dados de processo 16 bit (pág. 3). Repetibilidade do tempo de resposta 150 us (pág. 3).'
- 'Sinal PNP HIGH aprox. UB-2,5 V, NPN LOW < 2,5 V; duas saídas complementares push-pull (pág. 3).'
- 'Imunidade a luz ambiente típ.: artificial <= 50000 lx, sol <= 50000 lx (pág. 4). MTTFD 1396 anos (pág. 3).'
