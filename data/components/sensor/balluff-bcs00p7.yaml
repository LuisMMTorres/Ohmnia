lifecycle: desconhecido
notes:
- "Nome da fila 'DS BCS00P7 EN' é nome de arquivo; o código de pedido BCS00P7 corresponde a BCS M12B4E2-NOC80H-S04K (p. 6: linha NPN NC, não faceado, M12 x 1, conector M12 4 pinos A, carcaça V2A)."
- Dados elétricos da p. 2 valem para a série capacitiva BCS. Faixa de distância sensora nominal 1...8 mm (p. 6), ajustável por potenciômetro.
- Deriva de temperatura de sn (-5 a +55 °C) 20 %; tensão de isolação nominal Ui 75 V DC; proteção contra inversão de polaridade e curto-circuito (p. 2).
- "Saída NC: o contato fica conduzindo no estado desativado (p. 2). Indicadores LED verde (alimentação) e amarelo (saída) (p. 2)."
