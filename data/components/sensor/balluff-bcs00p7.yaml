# Fonte: Balluff, catálogo série BCS GlobalProx (sensores capacitivos M12/M18/M30), cópia do distribuidor Audin, sem data/revisão visível.
part_number: BCS00P7
category: sensor.proximity
schema_version: '1.0'
manufacturer: Balluff
family: BCS GlobalProx
