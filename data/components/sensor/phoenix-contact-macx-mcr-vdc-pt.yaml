notes:
- 'Fila: MACX MCR-VDC-PT (art. 2906243; o link anterior citava 2906242). Transdutor de tensão CC com isolação de 3 vias, faixas ajustáveis.'
- 'Faixas de entrada selecionáveis de -24...24 V DC até -550...550 V DC, com resistências de entrada de 540 kΩ a 5500 kΩ (pág. 3 do PDF); tensão nominal ±660 V DC.'
- 'Saída em tensão -10...10 V (máx. <= 11 V, carga > 10 kΩ, ondulação 50 mV) ou em corrente -20...20 mA (máx. <= 22 mA, carga < 500 Ω), pág. 3.'
- 'Erro máx. < 1 % do fim de faixa; coeficiente de temperatura < 0,015 %/K; ajuste de zero e span ±20 %; resposta ao degrau 10-90 % < 16 ms (pág. 4).'
- 'Tensão nominal de alimentação 24 V DC (-20 % ... +25 %). Corrente de consumo máx. < 60 mA. Tensão de isolação nominal 300 V DC.'
