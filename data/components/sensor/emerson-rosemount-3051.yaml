notes:
- 'Fila: product-data-sheet-rosemount-3051-coplanar-pressure-transmitter-en-79964. Valores da família; faixas entre os modelos 3051C/CD/CG/CA/T/L e as faixas (ranges) 0 a 6.'
- 'Exatidão de referência 0,04 % do span (faixas 2-4 do 3051C), 0,065 % na faixa 5; estabilidade 0,2 % do URL em 10 anos (p. 2, 76, 83).'
- 'Alimentação 4-20 mA HART: 10,5 a 42,4 V DC sem carga; resistência máx. de laço = 43,5 x (tensão - 10,5); comunicação exige mínimo 250 ohm (p. 82). Versões Fieldbus/PROFIBUS PA: 9,0 a 32,0 V DC (p. 84-85).'
- 'Limite de sobrepressão varia de 51,71 bar (3051CA faixa 1) a 1654,74 bar (3051TG/TA faixa 6) (p. 87). Temperatura de processo depende do modelo/fluido de enchimento (-60 a +149 C com flange, p. 90).'
- 'Faixa de pressão: limite superior (URL) até 1378,95 bar (3051T faixa 6); limite inferior de manométrica -1,01 bar (p. 82).'
