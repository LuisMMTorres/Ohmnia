notes:
- 'Pág. 1: produto descontinuado (mudança de status em 31/10/2005); substituto indicado para o A3144: A1104.'
- 'Documento cobre A3141 a A3144; os pontos magnéticos transcritos são da coluna A3144 (pág. 3). Campos magnéticos convertidos de gauss para mT (1 G = 0,1 mT, nota da pág. 3).'
- 'Top: sufixo E- vai de -40 a 85 °C e sufixo L- de -40 a 150 °C (pág. 2); registrada a faixa total.'
- 'Condições elétricas (pág. 3): VCC = 8 V, sobre a faixa de temperatura de operação, salvo indicação.'
- 'Encapsulamentos (pág. 2): sufixo -LT = SOT89/TO-243AA; sufixo -UA = SIP ultra-mini de 3 terminais.'
