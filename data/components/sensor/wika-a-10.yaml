# Fonte: WIKA, data sheet PE 81.60 (Pressure transmitter model A-10), edição 02/2026.
part_number: A-10
category: sensor.pressure
schema_version: '1.0'
manufacturer: WIKA
family: A-10
lifecycle: desconhecido
notes:
- 'Fila: "ds pe8160 en co" (nome de arquivo); produto real: transmissor de pressão modelo A-10, WIKA PE 81.60. Valores da série; faixa entre as variantes configuráveis.'
- 'range_bar: manométrica 0 ... 0.05 bar até 0 ... 1000 bar; faixas de vácuo/compostas até -1 ... +24 bar (p.3-4). Absoluta 0 ... 0.1 até 0 ... 25 bar abs (p.3).'
- 'Sobrepressão (p.4): <=0.1 bar -> 0.2 bar; <=0.4 bar -> 1 bar; <1.6 bar -> 3 bar; >=1.6 bar -> 2 vezes a faixa; faixa 1000 bar -> 1.43 vezes. Não registrado como número único.'
- 'Carga RL: corrente (2 fios) <= (alimentação - 8 V)/0.02 A; tensão (3 fios) > sinal máx./1 mA; ratiométrico > 10k (p.6). Fórmulas, não registradas em RL.'
- 'Não-linearidade <= +-0.5 % do span (opcional <= +-0.25 %, p.2); erro máx. medido IEC 61298-2 <= +-1 % do span para faixa >= 0.6 bar (p.2).'
- 'Temperatura: faixa padrão (meio e ambiente) 0 ... 80 °C; faixas estendidas -30 ... +100 °C (tensão) e -40 ... +100 °C (corrente) (p.9). Top abaixo = faixa padrão.'
- 'Tempo de estabilização < 1 ms (faixa >= 0.4 bar), < 1 min (faixa < 0.4 bar); tempo de ligação < 15 ms / < 1 min (p.7).'
