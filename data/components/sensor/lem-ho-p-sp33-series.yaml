part_number: HO 6-P SP33
category: sensor.current
schema_version: '1.0'
manufacturer: LEM
family: HO-P/SP33 (HO 6-P/SP33, HO 10-P/SP33, HO 25-P/SP33)
package: PCB, perfil extremamente baixo de 12 mm
lifecycle: desconhecido
notes:
- 'Valores da série (modelos HO 6, 10 e 25 A); faixas entre os modelos. O item da fila é HO 6-P SP33 (IP N = 6 A).'
- 'Por modelo (p.5 a 7): IP M = +-20 A (6 A), +-25 A (10 A), +-62,5 A (25 A); sensibilidade 76,67 / 46 / 18,4 mV/A; offset elétrico +-7 / +-5 / +-6 mV.'
- 'Princípio Hall; alimentação única 3,3 V; saída em tensão com referência Uref = 1,65 V (típ.) (p.1, p.5).'
- 'Consumo IC = 25 mA (p.5): a coluna (mín/típ/máx) não é identificável no texto extraído, por isso fica só nesta nota.'
- 'Erro de sensibilidade +-0,85 %; linearidade +-0,5 % de IP N; soma de sensibilidade e linearidade +-1,35 % de IP N a 25 °C (p.5).'
- 'Tempo de atraso a 90 %: 3,5 us; detecção de sobrecorrente 2,6 a 3,2 x IP N (p.5). Máx. absoluta: UC max 6,5 V (não operando) (p.3).'
