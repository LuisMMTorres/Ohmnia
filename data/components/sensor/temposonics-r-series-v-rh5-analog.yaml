notes:
- "Nome na fila: R-Series V Analog Datasheet EN. Sensor de posição linear magnetostritivo tipo haste, saída analógica (corrente ou tensão); valores da série."
- "Repetibilidade < ±0,001 % F.S. (mín. ±1 µm); histerese < 4 µm típico; coeficiente de temperatura < 30 ppm/K típico (p. 4)."
- "Consumo < 3,25 W (p. 5); proteção contra polaridade invertida até -36 VDC e sobretensão até 36 VDC (p. 5)."
- "Tempo de atualização conforme o curso: 0,25 ms (≤ 200 mm) a 5,0 ms (≤ 7620 mm) (p. 4). Velocidade 0,01 a 10 m/s medida pela segunda saída (p. 4)."
- "Pressão de operação 350 bar (pico 700 bar); RH5-J: 800 bar (p. 4)."
