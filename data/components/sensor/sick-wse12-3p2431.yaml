- 'Alcance máx. 0 a 20 m; alcance (range) 0 a 15 m, mancha de luz Ø 220 mm a 15 m, ângulo de dispersão aprox. 1,5° (pág. 2). O parâmetro range usa 0 a 15 m; o máximo absoluto de 20 m fica nesta nota.'
