# Fonte: Analog Devices, Low Voltage Temperature Sensors TMP35/TMP36/TMP37, Rev. E (08/2008) (cópia no site Adafruit).
part_number: TMP36GT9Z
category: sensor.temperature
schema_version: '1.0'
manufacturer: Analog Devices
family: TMP35/TMP36/TMP37 (versão TMP36, grau G)
package: TO-92 (T-3), 3 pinos (versão sem chumbo "Z")
lifecycle: desconhecido
notes:
- 'Documento da família TMP35/TMP36/TMP37; valores do TMP36 (escala 10 mV/°C, saída 750 mV a 25 °C) com grau G, conforme o Ordering Guide (p. 19): TMP36GT9Z, exatidão ±3,0 °C, -40 a +125 °C, TO-92 (T-3).'
- 'Exatidão grau G (Tabela 1, p. 3): a 25 °C típ. ±1 °C, máx. ±3 °C; sobre a faixa nominal de temperatura típ. ±2 °C, máx. ±4 °C. Valores não consideram autoaquecimento (nota 1).'
- 'Linearidade típ. 0,5 °C; regulação de carga típ. 6 m°C/uA (máx. 20) para -40 a +105 °C; saída 100 a 2000 mV; corrente de saída 0 a 50 uA; tempo de ligação típ. 0,5 ms (máx. 1 ms) (p. 3).'
- 'Shutdown: nível alto mín. 1,8 V (VS = 2,7 V), nível baixo máx. 400 mV (VS = 5,5 V); corrente em shutdown típ. 0,01 uA, máx. 0,5 uA (p. 3). Máximos absolutos (Tabela 2, p. 4): alimentação 7 V, temperatura de operação -55 a +150 °C, armazenamento -65 a +160 °C.'
- 'Resistência térmica do TO-92 (Tabela 3, p. 4): theta-JA = 162 °C/W, theta-JC = 120 °C/W (sem símbolo no esquema).'
