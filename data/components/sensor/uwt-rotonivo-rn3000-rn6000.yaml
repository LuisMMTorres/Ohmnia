- 'Fila: rotonivo-rn3000-technical-information-en. Chave de nível rotativa para sólidos a granel (detector de cheio, demanda ou vazio); valores da série, faixas entre extensões e versões.'
- 'Alimentação: CA 24, 48, 115 ou 230 V; CC 24 V; universal 24 V DC / 22 a 230 V CA (p. 4). VS abaixo cobre a versão universal; as demais versões usam tensões fixas.'
- 'Saídas: SPDT, DPDT (micro chave), PNP, SPST (RN 6000), FSH/FSL, atraso ajustável, alarme fail safe opcional (p. 4). Sensibilidade > 15 g/l (p. 1).'
- 'Temperatura ambiente RN 3000: -20 a +70 C (-20 a +60 C Ex; -40 C com aquecimento); RN 6000: -20 a +50 C (p. 3). Pressão de processo -0,9 a +0,8 bar ou -0,9 a +5/10 bar (p. 5).'
