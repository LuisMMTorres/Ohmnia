notes:
- 'Nome na fila: 1gt-series-datasheet-005889-2-en; valores da série, medidos com resistor de pull-up de 1 kohm (Tabela 1, p. 2).'
- 'Sensor Hall polarizado magneticamente para alvos metálicos ferrosos (dentes de engrenagem); saída digital em coletor aberto (sink), proteção contra polaridade reversa e transientes de +60 V / -40 V (p. 1).'
- 'Operação: ponto de operação 3.3° ±1.25° e de liberação 4.4° ±2.5° (ângulo) com entreferro de 0,13 mm a 2,03 mm, 10 a 5000 rpm (p. 2).'
- 'Tempos de comutação: subida (10% a 90%) 5 us máx.; descida (90% a 10%) 1.0 us máx. (p. 2). Carga capacitiva externa máxima de 550 pF (p. 2).'
- 'Temperatura de operação contínua -40 a 150 °C, curto prazo até 160 °C (p. 1). Corrente de saída/fuga: linha da tabela 1 ambígua no PDF, não transcrita.'
