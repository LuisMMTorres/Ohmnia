notes:
- 'Fila: WL12G-3B2531. Retrorreflexivo com filtro de polarização, detecta objetos transparentes (pág. 2-3).'
- 'Alcance máx. 0 a 4 m com refletor PL80A; ângulo de dispersão aprox. 1,5°; mancha de luz Ø 25 mm a 1,5 m (pág. 2).'
- 'Sinal de saída PNP HIGH > Uv - 3 V / LOW aprox. 0 V; modo claro/escuro selecionável por cabo L/D (pág. 3).'
- 'Corrente de consumo 30 mA sem carga; ondulação < 5 Vpp; MTTFD 823 anos (pág. 2-3).'
