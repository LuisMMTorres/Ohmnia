# Fonte: Contrinex, data sheet DW-A-509-M12 (indutivo com saída analógica, trilingue d/f/e), rev. 9, 10.08.05.
part_number: DW-AD-509-M12
category: sensor.proximity
schema_version: '1.0'
manufacturer: Contrinex
family: DW-AD/DW-AS 509 M12
package: M12, latão cromado, quase-faceado (quasi-embeddable)
lifecycle: desconhecido
notes:
- 'DW-AD = versão com cabo (art. 320 020 100); DW-AS = versão com conector S12 (p.2). O documento cobre a família; valores são comuns.'
- 'Saída analógica não linearizada: tensão 0 a 5 V (A1) e corrente 1 a 5 mA (A2) (p.1). Tensão: 0 V a s=0 mm, +2,6 V +-0,2 V a 3 mm, +5 V +-0,2 V a 6 mm (23 °C) (p.1).'
- 'Corrente de saída A2: 1 mA +-0,2 mA a s=0 mm, 5 mA +-0,2 mA a s=6 mm; carga máx. em A2: 1 kohm (UB=10 V) / 5 kohm (UB=30 V) (p.1).'
- 'Largura de banda 1000 Hz (-3 dB a s=3 mm), atraso de disponibilidade <= 50 ms, deriva de temperatura de sr <= +-5 % (0 a +70 °C) (p.1). Resolução <= 1 um, repetibilidade 0,3 mm (p.1).'
- 'Ripple admissível <= 20 % UB; proteção contra curto-circuito e inversão de polaridade integradas (p.1).'
