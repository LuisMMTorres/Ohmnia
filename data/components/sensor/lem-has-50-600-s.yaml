# Fonte: LEM, Current Transducer HAS 50 ... 600-S, Version 16 (22 September 2022).
part_number: HAS 50...600-S
category: sensor.current
schema_version: '1.0'
manufacturer: LEM
family: HAS-S
lifecycle: desconhecido
notes:
- Documento da série HAS 50-S a HAS 600-S (IP N 50, 100, 200, 300, 400, 500, 600 A); valores são faixas entre os modelos.
- "I_PM (faixa de medição, pico): ±150 A (HAS 50-S), ±300 A (100-S), ±600 A (200-S), ±900 A (300-S a 600-S) (p. 1). Operar com UC entre ±12 e ±15 V reduz a faixa de medição."
- Tensão de saída Uout ±4 V a ±IP N, RL = 10 kohm, TA = 25 °C (p. 1); resistência interna de saída aprox. 100 ohm.
- "V_offset: < ±40 mV para HAS 50-S e < ±20 mV para HAS 100...600-S (p. 1); lançado o maior. Coeficiente de temperatura do offset < ±2 mV/K (50-S) e < ±1 mV/K (100...600-S); TC de Uout < ±0,1 %/K."
- Alimentação ±15 V (±5 %); consumo ±15 mA (p. 1). Banda DC...50 kHz (-3 dB, pequenos sinais). Massa aprox. 60 g (p. 1).
- "Isolação: 3,6 kV RMS 50 Hz 1 min; impulso 1,2/50 us > 6,6 kV; isolação básica 600 V, reforçada 300 V (p. 2)."
