notes:
- 'Fila: fsrguide. Guia de integração com parâmetros típicos gerais de FSR (pág. 14 do PDF, "General FSR Characteristics", valores típicos; o dispositivo é personalizável).'
- 'Faixa de sensibilidade à força: < 100 g a > 10 kg, dependente da mecânica; capacity usa 10 kg como limite superior citado, não como capacidade nominal garantida.'
- 'Repetibilidade peça a peça ±15% a ±25% da resistência nominal; peça única ±2% a ±5%; resolução melhor que 0,5% do fundo de escala; força de ativação 20 g a 100 g (pág. 14).'
- 'Resistência em repouso (stand-off) > 1 MΩ; tempo de subida 1-2 ms (mecânico); vida > 10 milhões de acionamentos; corrente máxima 1 mA/cm² de força aplicada (pág. 14).'
- 'Sensor FSR não é extensômetro, célula de carga nem transdutor de pressão (pág. 8); sem excitação em mV/V.'
