notes:
- O PDF é do modelo MM12-60APS-ZCK (1040070); o nome da fila é MM12-60APS-ZC0 (mesmo número 1040070 no link anterior). O sufixo ZC0 não aparece no documento, conferir.
- Faixa sensora 0 a 60 mm com ímã MAG-3010-B (M4.0), instalação em material não magnético; Sa = 48,6 mm (p. 2).
- Sensibilidade magnética 1 mT (p. 2); histerese 1 % a 10 % e reprodutibilidade <= 1 % (p. 3); atraso de disponibilidade <= 20 ms (p. 3).
- Proteção contra inversão de polaridade, curto-circuito (pulsada) e pulso de ligação (p. 3). Temperaturas abaixo de -25 °C reduzem a vida útil (p. 3). IP67 (EN 60529, p. 2).
