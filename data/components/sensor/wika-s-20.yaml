# Fonte: WIKA, data sheet PE 81.61 (Pressure transmitter model S-20, for demanding industrial applications), edição 02/2026.
part_number: S-20
category: sensor.pressure
schema_version: '1.0'
manufacturer: WIKA
family: S-20
lifecycle: desconhecido
notes:
- 'Fila: "ds pe8161 en co" (nome de arquivo); produto real: transmissor de pressão modelo S-20, WIKA PE 81.61. Valores da série; faixa entre as variantes configuráveis.'
- 'Faixas de medição 0 ... 0.4 até 0 ... 1,600 bar (p.1 Description); faixas de vácuo/absolutas conforme p.3-4 (não transcritas).'
- 'Não-linearidade <= +-0.5 / +-0.25 / +-0.125 % do span conforme classe (p.2); não-repetibilidade <= 0.1 % do span; deriva de longo prazo <= +-0.1 % (p.2).'
- 'Carga RL: corrente (2 fios) <= (alimentação - 7.5 V)/0.023 A; tensão (3 fios) > sinal máx./1 mA; ratiométrico > 4.5k (p.7). Fórmulas, não registradas em RL.'
- 'Faixa de alimentação por sinal (p.7): 4...20 mA 8...36 V; 0...10 V 12...36 V; ratiométrico 5 V +-10 %; com cULus limitado a 35 V. Dissipação 828 mW (2 fios), 432 mW (3 fios).'
- 'Temperatura ambiente/meio dependem de conexão e vedação (p.11); Top registrado é a primeira linha da tabela (-30 ... +100 °C); outras versões vão de -40 a +200 °C (meio, com elemento de refrigeração), -20 ... +60 °C versão oxigênio.'
- 'Sobrepressão e faixas dependem da conexão de processo (p.5-6); não registradas como número único.'
