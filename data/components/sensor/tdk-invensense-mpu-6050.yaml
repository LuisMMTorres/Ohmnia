# Fonte: InvenSense (TDK), MPU-6000 and MPU-6050 Product Specification, PS-MPU-6000A-00, Revisão 3.2, 16/11/2011.
part_number: MPU-6050
category: sensor.inertial
schema_version: '1.0'
manufacturer: TDK InvenSense
family: MPU-6000/MPU-6050
package: QFN 4 x 4 x 0,9 mm
lifecycle: desconhecido
notes:
- 'Documento cobre o MPU-6000 (I2C e SPI) e o MPU-6050 (I2C, com pino VLOGIC); valores abaixo valem para o MPU-6050 salvo indicação.'
- 'Pág. 10: faixas programáveis do giroscópio +/-250, +/-500, +/-1000 e +/-2000 °/s; do acelerômetro +/-2, +/-4, +/-8 e +/-16 g; registradas como magnitude mínima e máxima.'
- 'Pág. 14: corrente de operação normal 3,9 mA (giroscópio, acelerômetro e DMP ativos), 3,6 mA só giroscópio, 500 uA só acelerômetro; modo ocioso 5 uA.'
- 'Pág. 14: sensor de temperatura interno com faixa -40 a +85 °C, sensibilidade 340 LSB/°C (sem calibração). Pág. 10: FIFO de 1024 bytes.'
