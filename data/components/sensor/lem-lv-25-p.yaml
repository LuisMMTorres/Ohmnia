lifecycle: desconhecido
notes:
- 'Transdutor de tensão por corrente primária: a tensão é medida passando corrente proporcional por um resistor externo R1 em série com o primário (pág. 1, Principle of use); faixa recomendada 10 a 500 V (pág. 4).'
- 'R_M (resistor de medida), pág. 1: com ±15 V, 100 a 350 ohm @ ±10 mA max e 100 a 190 ohm @ ±14 mA max; com ±12 V, 30 a 190 ohm @ ±10 mA max e 30 a 100 ohm @ ±14 mA max.'
- 'Consumo IC (pág. 1): 10 mA (@ ±15 V) + IS. Corrente primária nominal 10 mA, faixa 0 a ±14 mA (pág. 1).'
- 'Tensão de impulso 1.2/50 us: 16 kV (pág. 2).'
