# Fonte: Endress+Hauser, Technical Information Levelflex FMP51, FMP52, FMP54, TI01001F/00/EN/32.25-00 (71705627), 2025-04-25.
part_number: Levelflex FMP51, FMP52, FMP54
category: sensor.level
schema_version: '1.0'
manufacturer: Endress+Hauser
family: Levelflex FMP5x (radar de onda guiada)
package: Caixa GT18/GT19/GT20 (conforme código de pedido), sonda de haste, cabo ou coaxial
lifecycle: desconhecido
notes:
- "Nome na fila: TI01001F00EN 0412 (índice 336); o documento baixado é a revisão 32.25-00 de 2025-04-25 (TI01001F/00/EN/32.25-00)."
- "Valores da série FMP51, FMP52 e FMP54; faixas variam entre os modelos e versões. Radar de onda guiada para nível e interface em líquidos (p. 1)."
- "Pressão de processo -1 a +400 bar (p. 1); a pressão máxima depende do componente de menor classe (conexão, acessórios) (p. 62). Sem símbolo de sobrepressão no schema sensor.level."
- "range_m: alcance máximo haste 10 m, cabo 45 m, coaxial 6 m (p. 1); transcrito o máximo da série (cabo, 45 m)."
- "Exatidão (p. 30): distância ≤ 15 m ±2 mm; > 15 m ±10 mm (saída digital); saída analógica ±0,02 % do span adicionais; não-repetibilidade ≤ 1 mm. Valor percentual transcrito é o da saída analógica."
- "Alimentação 2 fios 4-20 mA HART: tensão nos terminais 11,5 a 35 V (não perigosa, Ex nA, Ex ic) ou 11,5 a 30 V (Ex ia); 13,5 a 30 V (Ex d, Ex ic[ia]) (p. 25). A +2 V mínimo com módulo Bluetooth e requisitos maiores a Ta ≤ -30 °C (p. 25). Versão 4 fios 10,4 a 48 V DC ou 90 a 253 V AC (p. 27)."
- "Consumo: HART 3,6 a 22 mA, corrente de falha ajustável 3,59 a 22,5 mA (NAMUR NE43); PROFIBUS PA 14 mA; FOUNDATION Fieldbus 15 mA (p. 27). Potência 2 fios < 0,9 W (p. 27)."
- "Temperatura de processo -196 a +450 °C na capa (p. 1), limitada por vedação (p. 61): p. ex. FKM -30 a +150 °C, EPDM -40 a +120 °C, FFKM -20 a +200 °C; depende da versão."
