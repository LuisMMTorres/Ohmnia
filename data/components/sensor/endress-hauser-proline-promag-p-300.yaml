# Fonte: Endress+Hauser, Technical Information Proline Promag P 300, TI01224D/06/EN/10.25-00 (71745952), 2025-11-19.
part_number: Proline Promag P 300
category: sensor.flow
schema_version: '1.0'
manufacturer: Endress+Hauser
family: Proline Promag 300
package: Sensor flangeado com transmissor compacto ou remoto (caixa de duplo compartimento)
lifecycle: desconhecido
notes:
- "Nome na fila: TI01224D06EN 0116 (índice 368); o documento baixado é a revisão 10.25-00 de 2025-11-19 (TI01224D/06/EN/10.25-00)."
- "Medidor de vazão eletromagnético (Promag P 300) para líquidos condutivos; revestimento PTFE ou PFA, DN 15 a 600 (p. 1, 6). Valores gerais do documento; variam por diâmetro e versão."
- "Faixa de medição típica v = 0,01 a 10 m/s com a exatidão especificada (p. 10). A faixa em vazão volumétrica depende do DN (tabela p. 10-11), não transcrita pois o schema usa m3/h genérico."
- "Alimentação do transmissor (p. 37): opção D DC 24 V ±20 %; opção E AC 100 a 240 V (-15 a +10 %, 50/60 Hz ±4 Hz). Potência máx. 10 W (ativa); corrente máx. 400 mA (24 V) ou 200 mA (110 V ou 230 V CA); corrente de partida máx. 36 A (< 5 ms)."
- "Exatidão (p. 52): ±0,5 % da leitura ±1 mm/s; opcional ±0,2 % da leitura ±2 mm/s."
- "Saída em corrente 4 a 20 mA HART: carga 250 a 700 Ω, resolução 0,38 µA, tensão de circuito aberto 28,8 V DC (ativa), tensão máx. de entrada 30 V DC (passiva) (p. 13-15). Saídas de pulso/frequência/comutação também disponíveis."
- "Temperatura do meio (p. 61): PFA -20 a +150 °C (DN 25 a 200); PFA alta temperatura -20 a +180 °C (DN 25 a 200); PTFE -40 a +130 °C (DN 15 a 600). Armazenamento: igual à faixa de operação do transmissor e do sensor (p. 60)."
