notes:
- 'Fila: WEG-reles-de-nivel-snr-manual-portugues-br. O PDF é o catálogo geral de relés eletrônicos; registrado apenas o relé de controle de nível RNW (p. 20 a 25): RNW-EN-E09 (enchimento) e RNW-ES-E09 (esvaziamento).'
- 'Relé de nível por eletrodos para líquidos condutivos; sensibilidade ajustável de 0 a 100 kohm; tensão no eletrodo 7 V ca, corrente no eletrodo 0,05 mA (p. 24).'
- 'Faixa de operação da alimentação 0,85 a 1,1 x Us (p. 24). Consumo máx. 2 VA / 1 W (p. 24). Contato 1 SPDT: AC-12 250 V ca 5 A; AC-15 230 V ca 3 A; DC-13 24 V cc 1 A; corrente térmica 10 A (CA); fusível gL/gG 4 A; vida mecânica 30 x 10^6 manobras (p. 24).'
