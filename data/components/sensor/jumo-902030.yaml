notes:
- 'Nome na fila: t90.2003en; código de configuração mostrado no documento: 90203000T10Z002K000.'
- 'Valores da série (tipos básicos 902030/10, /11, /20, /21); faixa de operação depende do código escolhido: -20 a +150, -50 a +200, -50 a +260 ou -50 a +400 °C (p. 4).'
- 'Tempos de resposta variam por diâmetro e meio: t0.9 de 2 s (água, Ø 6 reduzido a Ø 3.5) a 110 s (ar, Ø 6); t0.5 = 1 s a 40 s (p. 2). Valor de t_resp é a faixa de t0.9 entre as variantes.'
- 'Top refere-se à temperatura ambiente do cabeçote (forma J); com transmissor a faixa é reduzida (folha 707030).'
- 'Classe B (-50 a +500 °C) padrão, classe A (-30 a +300 °C) opcional (p. 4).'
