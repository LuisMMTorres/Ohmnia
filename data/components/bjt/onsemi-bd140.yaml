notes:
- 'A fila nomeia o fabricante como STMicroelectronics, mas o PDF é o datasheet da onsemi (BD136/D), série BD136/BD138/BD140.'
- 'PNP: tensões e correntes em módulo (o datasheet usa sinal negativo). VCBO, VCEO e VCEO(sus) são os da coluna BD140 (BD136 = 45 V, BD138 = 60 V, BD140 = 80 V).'
- 'hFE2 (IC = 150 mA): faixa 63 a 250 entre as classes -10 (63-160) e -16 (100-250). hFE1 (5 mA) mín. 25 e hFE3 (500 mA) mín. 25 não transcritos por parâmetro separado.'
- 'Dissipação Ptot: 12,5 W com TC = 25 °C e 1,25 W com TA = 25 °C (p. 1). Teste de pulso das características: PW = 350 us, ciclo de trabalho 2%.'
