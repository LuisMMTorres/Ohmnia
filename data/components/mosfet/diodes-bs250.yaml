notes:
- Valores de tensão e corrente de canal P transcritos em módulo, como no esquema mosfet.p; o documento os dá com sinal negativo.
- 'Fabricante conforme o documento: Diodes Incorporated (o nome na fila era Vishay; o PDF baixado é o BS250P da Diodes, DS33014, que remete ao ZVP2106A para os gráficos).'
- 'Tempos de comutação (página 1): t(ON) máx. 20 ns e t(OFF) máx. 20 ns com VDD ≈ -25 V, ID = -500 mA, fonte de 50 ohm; não há símbolo equivalente no esquema, por isso ficam só aqui.'
- A folha marca Ciss, gfs e os tempos de comutação como 'sample test' (nota 2, página 1).
