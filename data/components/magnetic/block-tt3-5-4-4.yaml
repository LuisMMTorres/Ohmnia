lifecycle: ativo
notes:
- Transformador trifásico de isolação 5000 VA, 3 × 400 V, saída 380/400/420 V (derivações), Dyn5, 50 a
  60 Hz.
- 'Fonte é a página do produto no site do fabricante; consultada em 2026-11-21. Datasheet PDF do fabricante:
  https://www.block.eu/fileadmin/2c9ee487874001a201874760dfc05fd9.Datenblatt_TT3_5_4_4.pdf (não baixado).'
- O simulador usa as perdas em curto-circuito como perda no cobre (P_sc/S_n); a magnetização continua
  didática. O grupo Dyn5 difere do Dyn11 do símbolo em 180° (só a defasagem muda).
- Não é à prova de curto-circuito (proteger o primário).
