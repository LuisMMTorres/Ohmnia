schema_version: '1.1'
manufacturer: Micrometals
package: Toroide revestido (epóxi amarelo/branco), mix 26 (75µ)
lifecycle: desconhecido
notes:
- 'Núcleo toroidal de pó de ferro, mix 26, µi 75. Dimensões (pág. 1): OD 26,92 mm nom. (máx. 27,43 mm revestido); ID 14,48 mm nom. (mín. 13,97 mm revestido); Ht 11,10 mm nom. (máx. 11,73 mm revestido).'
- 'Superfície sa 28,1 cm²; área mínima de janela WA 1,53 cm²; tensão de ruptura mín. 500 Vrms 60 Hz (limite 3 mA, 5 s) (pág. 1).'
- 'AL nominal 93 nH/N² medido com N=100, #28 AWG, 10 kHz, 0,29 V (Agilent 4284A), tolerância ±10% (pág. 1). Núcleo de pó de ferro: o datasheet não informa entreferro.'
- 'Perdas do núcleo: 83 mW/cm³ nominal e 95 mW/cm³ máx. a Bpk 140 G e 100 kHz (pág. 1); temperatura não informada. Datasheet não informa Bsat nem temperatura de Curie.'
- 'Queda de permeabilidade com CC: 55,2% (nom.) e 47,4% (mín.) de µi a HDC 50 Oe (pág. 1).'
