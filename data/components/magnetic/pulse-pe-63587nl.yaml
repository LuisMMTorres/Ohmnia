notes:
- 'Documento de família; linha do PE-63587NL: transformador com primário de 1 espira (esquema 1A), 100 espiras no secundário (pág. 1, tabela Electrical Specifications).'
- 'Sem símbolo no esquema: indutância do secundário mín 20.0 mH (teste 1.0 V, 15.75 kHz), RS 1.40 ohm máx, RT 100 ohm máx (resistência terminadora), rating do primário 300 A·us unipolar e 600 A·us bipolar (máx); corrente de pico de sensação com 1 espira primária 20 A (nota 5).'
- 'Rating máx especificado com a resistência terminadora nominal do secundário e 1 espira no primário (nota 1). Temperatura máxima de operação 105 °C (ambiente mais elevação), nota 3.'
- Aprovação VDE e isolação conforme IEC950 declaradas na pág. 1, sem tensão de isolação numérica.
