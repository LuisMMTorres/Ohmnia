notes:
- 'Fila: 2080-um002 -en-e. Manual de usuário da série; valores são faixas entre os controladores Micro830 (10, 16, 24, 48 pontos), Micro850 e Micro870 (apêndice A, págs. 223-246). Valores por modelo não individualizados.'
- 'Memória (pág. 93): programa 4 K a 20 K passos e dados 8 KB a 40 KB conforme o modelo (1 passo = 12 bytes); não transcrito como parâmetro.'
- 'Micro870 tem faixa de alimentação 21,4 a 26,4 V DC (pág. 243); demais modelos 20,4 a 26,4 V DC.'
- 'Saídas: relé (até 2 A, 240 V AC) ou transistor 24 V DC sink/source conforme o modelo (pág. 224-225, ex. 2080-LC30-10QWB / 10QVB).'
- 'Entradas rápidas e padrão 24 V DC sink/source; tempo de instrução e resolução analógica não localizados neste manual.'
