notes:
- 'Nome na fila: WEG-plc300-manual-do-usuario-10001483024-manual-portugues-br; PDF recebido é o manual em inglês 10001615232/03.'
- 'VS: 24 Vdc com tolerância de ±15 % (p. 69); consumo do PLC300 em 24 V: 250 mA, cerca de 30 mA por expansão (p. 69).'
- 'do: DO1 a DO8 PNP de 500 mA cada; DO9 é saída PWM push-pull de 100 mA, até 300 kHz (50 kHz para duty-cycle correto) (p. 69).'
- 'Entradas digitais DI1-DI10 bidirecionais; DI9 e DI10 rápidas (até 100 kHz), DI1-DI8 até 4 kHz (p. 69).'
- 'Saída analógica de 10 bits com terminais independentes de corrente ou tensão (p. 10); até 2 módulos de expansão de E/S (p. 10).'
- 'Ciclo de varredura: 142 us/KB de programa; exemplo de 1000 instruções = 12 KB, ciclo total de 3 ms (p. 70).'
