# Fonte: Siemens, SIMATIC S7-1200 Programmable controller - System Manual, A5E02486680-05, 11/2011 (Anexo A Technical specifications).
part_number: S7-1200
category: plc
schema_version: '1.0'
manufacturer: Siemens
family: SIMATIC S7-1200 (CPU 1211C, 1212C, 1214C)
lifecycle: desconhecido
notes:
- 'Nome na fila: s71200 system manual en-US; manual de sistema da série (edição antiga 11/2011).'
- 'Valores específicos de CPU (di, do, ai, memory, do_I) são da CPU 1214C (Anexo A.4, p. 680-685); a CPU 1211C tem 6 entradas/4 saídas e 25 kB de memória de trabalho (p. 664).'
- 'VS: 20.4 a 28.8 VDC (CPUs DC); as CPUs AC/DC/Relay usam 85 a 264 VAC, 47 a 63 Hz (p. 683). Consumo da CPU 1214C: 500 mA a 24 VDC (somente CPU) (p. 683).'
- 'do_I = saída a relé (2.0 A); do_I@2 = saída a MOSFET sourcing (0.5 A) (p. 684). Corrente de alimentação do sensor: 400 mA máx. (p. 681).'
- 'Entrada digital: nominal 24 VDC a 4 mA, lógico 1 mín. 15 VDC a 2.5 mA, lógico 0 máx. 5 VDC a 1 mA (p. 684).'
- 'Top: 0 a 55 °C em montagem horizontal e 0 a 45 °C na vertical (p. 661). Memória de carga 2 MB; expansão com até 8 módulos de sinal (CPU 1214C) (p. 681).'
