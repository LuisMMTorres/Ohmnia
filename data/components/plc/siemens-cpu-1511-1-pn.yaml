notes:
- 'Nome na fila: s71500 cpu1511 1 pn manual en-US; referência de pedido 6ES7511-1AK00-0AB0, hardware FS06, firmware V1.7 (p. 31).'
- 'CPU sem E/S digitais ou analógicas integradas no documento (módulos de E/S externos); por isso di, do, ai e ao não foram transcritos.'
- 'Consumo: corrente nominal de entrada 0.7 A a 24 VDC, corrente de partida máx. 1.9 A (p. 31). P_cons usa a perda de potência típica (Power loss, typ.) como valor mais próximo de consumo.'
- 'Memória de trabalho: 150 KB para programa e 1 MB para dados; memória de carga em cartão SIMATIC até 32 GB (p. 31). Valor de memory = programa.'
- 'Tempos de CPU típicos: bit 60 ns, palavra 72 ns, ponto fixo 96 ns, ponto flutuante 384 ns (p. 32).'
- 'Top: 0 a 60 °C em montagem horizontal, display até 50 °C; 0 a 40 °C na vertical (p. 39).'
