notes:
- 'Nome na fila: logo system manual en-US; manual de sistema da série LOGO! 8 (módulos base 12/24 V, 24 V, 24 V RC e 230 V), valores do Anexo A (Technical data, p. 325-339) como faixa entre os modelos de módulo base em tensão contínua.'
- 'VS: módulos 24 VDC (20.4 a 28.8 V) e 12/24 VDC (10.8 a 28.8 V) (p. 331, 338); módulos 230 V: 85 a 265 VAC / 100 a 253 VDC (p. 326); não incluídos em VS.'
- 'di: 8 entradas digitais nos módulos base (LOGO! 24CE, 12/24RCE); 4 nos módulos de expansão DM8 12/24R (p. 331, 338). ai: 4 entradas analógicas 0-10 V nos módulos base 24 e 12/24 (I1, I2, I7, I8).'
- 'do: 4 saídas digitais nos módulos base; LOGO! 24CE com transistor (máx. 0,3 A por canal), LOGO! 12/24RCE com relé (máx. 10 A por relé) (p. 332, 339). do_I = relé, do_I@2 = transistor.'
- 'di_on/di_off: níveis do LOGO! 24CE (sinal 1 > 12 VDC, sinal 0 < 5 VDC); no 12/24 sinal 1 > 8.5 VDC (p. 331, 338).'
- 'Tempo de ciclo por função < 0,1 ms; startup típico 1,2 s (p. 325-326).'
