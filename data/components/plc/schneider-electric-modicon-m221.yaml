notes:
- "Nome na fila: EIO0000001360 (o documento baixado é o EIO0000003297 12/2018, sucessor do EIO0000001360). É um guia de programação, sem tabela de dados técnicos de hardware; os dados elétricos estão no Hardware Guide, citado mas não incluído."
- "VS (24 V) é a alimentação DC; VS@2 (100 a 240 V) é a alimentação AC. Alimentação: TM221C 24 Vdc ou 100 a 240 Vac; TM221M 24 Vdc (p. 20 e 26)."
- "TM221C16R/CE16R: 5 entradas comuns e 4 rápidas (HSC), 7 saídas a relé, 100-240 Vac; TM221C16T/U: 5 entradas comuns, 4 rápidas, 5 saídas transistor comuns e 2 rápidas, 24 Vdc (p. 22). Entradas comuns com frequência máxima de 5 kHz (p. 22)."
- "Memória: RAM 512 Kbytes (256 Kbytes para variáveis internas e 256 Kbytes para aplicação e dados); não volátil 1,5 Mbytes (p. 21 e 27)."
