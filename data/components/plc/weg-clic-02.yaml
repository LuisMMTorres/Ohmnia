notes:
- 'Nome na fila: WEG-clic02-manual-do-usuario-10000436522-manual-portugues-br; PDF recebido é a edição 10009280784/00 trilíngue; valores transcritos da seção em inglês (cap. 4.1 General Specifications, PDF p. 27-29).'
- 'Valores da série (relé inteligente compacto, até 44 pontos de E/S digitais); variam entre os modelos CLW-02/10 a /20 (HR, HT, VR, VT, -A, -12D).'
- 'VS: faixa dos modelos em corrente contínua (12 Vdc: 10.4 a 14.4 V; 24 Vdc: 20.4 a 28.8 V). Modelos CA: 100 a 240 Vac e 24 Vac (20.4 a 28.8 Vac) (p. 27).'
- 'do: 4 saídas nos modelos de 10/12 pontos, 8 nos de 20 pontos (tabela de modelos, p. 30).'
- 'Entradas analógicas A01-A04 na unidade básica, A05-A08 em módulos de expansão; entrada analógica 0~10 Vdc (p. 29).'
- 'Tempo de ciclo 10 ms/ciclo; programa máximo 300 linhas ou 260 blocos funcionais; display LCD 4 linhas x 16 caracteres (p. 27).'
