notes:
- 'Nome na fila: WEG-plc500-manual-do-usuario-10009567410-manual-portugues-br; PDF recebido é o manual 10009242424 rev. 03 (cap. 18 Especificações Técnicas, p. 50-52).'
- 'Consumo do PLC500: 150 mA em regime, sem acessórios e sem redes (p. 50). Fonte recomendada LPS ou UL classe 2 com mínimo de 3 A.'
- 'do: 8 saídas, sendo DO1-DO3 rápidas push-pull (100 mA por saída, 300 kHz) e DO4-DO8 PNP (500 mA por saída) (p. 51); do_I = DO4-DO8, do_I@2 = DO1-DO3 (carga resistiva).'
- 'Processador dual core 1 GHz + coprocessador 200 MHz; 100 mil instruções em 1,19 ms (12 ns por instrução) (p. 50). Memória: RAM 1 GB e Flash 4 GB; valor memory = RAM.'
- 'Até 8 módulos de expansão (p. 52). Entradas rápidas DI1-DI4 e DI7 até 150 kHz (p. 51).'
