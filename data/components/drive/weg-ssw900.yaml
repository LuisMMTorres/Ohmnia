notes:
- 'Valores da série SSW900 (modelos 10 A a 1400 A); faixas entre os modelos. Numeração de páginas = páginas do PDF.'
- 'Tensão de linha: T5 = 220 a 575 V e T6 = 380 a 690 V (conexão padrão); dentro do delta T5 = 220 a 500 V e T6 = 380 a 575 V (p. 76).'
- 'Tensão de comando: E2 = 110 a 240 V (modelos 10 A a 200 A); E3 = 110 a 130 V ou E4 = 220 a 240 V (255 A a 1400 A) (p. 76).'
- 'Temperatura ambiente: -10 a 55 °C (modelos até 412 A) e -10 a 40 °C (acima de 412 A); redução de 2 % por °C acima de 40 °C (p. 13).'
- 'Partidas por hora dependem do modelo e do regime (10, 5 ou 3 por hora; Tabelas 7.1 e 7.2, não transcritas).'
- 'Entradas: 5 digitais isoladas 24 Vcc e 1 de termistor; saídas: 3 digitais (relés 240 Vca / 30 Vcc, 2 A) e 1 analógica (0 a 10 V ou 0/4 a 20 mA) (p. 76).'
- 'Fila de transcrição: novo link do site do fabricante.'
