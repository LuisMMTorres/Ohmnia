notes:
- 'Valores da série CFW500 (Tabela B.1, págs. 151 e 152): de CFW500A01P6S2 (1,6 A, 0,25 HP / 0,18 kW) a CFW500E49P0T4 (49 A, 30 HP / 22 kW); faixa entre os modelos.'
- 'Faixas de tensão de alimentação: 200...240 V, 380...480 V e 500...600 V (nomenclatura, pág. 13).'
- 'Frequência de saída 0 a 500 Hz, resolução 0,015 Hz; V/f ou VVW (Tabela 8.1, pág. 46).'
- 'Entradas/saídas: 4 DI, 1 AI, 1 AO, 1 relé 240 Vca 0,5 A, 1 saída a transistor; fonte 24 Vcc -15 % +20 %, 150 mA; RS485 Modbus-RTU até 38,4 kbps (Tabela 8.1, págs. 46 e 47). Quantidades de I/O podem variar com o plug-in/modelo (marcação (*) no documento).'
- 'Temperatura nominal ao redor do inversor 50 C (122 F), com coluna adicional de 40 C (104 F), na Tabela B.4 (pág. 153).'
