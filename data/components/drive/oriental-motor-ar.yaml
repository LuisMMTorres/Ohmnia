notes:
- 'Catálogo comercial (lista de preços e opções); as especificações elétricas detalhadas não estão no documento (pág. 15: "refer to our website"). Registro mínimo, só o que o catálogo declara.'
- 'Série composta de motor híbrido com controle em malha fechada e driver ARD; drivers ARD-A/-C/-S (entrada de pulsos) e ARD-AD/-CD (controlador embutido) (págs. 2 e 14).'
- 'Faixa de comando de velocidade do controlador embutido: 0 a 1000000 Hz (pág. 5, linha "Command Range"); não confundir com a frequência máxima de pulsos de entrada.'
- 'Controle híbrido: malha aberta com correção em malha fechada em sobrecarga (pág. 2).'
- 'Operação contínua exige dissipador equivalente a placa de alumínio 250 x 250 mm, 6 mm de espessura (pág. 2).'
