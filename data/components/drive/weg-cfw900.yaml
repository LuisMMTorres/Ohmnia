notes:
- 'Valores da série CFW900; faixas entre os modelos/mecânicas (pág. 4 e 28).'
- 'Sobrecarga: ND 110% por 60 s e 150% por 3 s a cada 5 min; HD 150% por 60 s e 200% por 3 s a cada 5 min (pág. 4). Registrado no parâmetro overload o máximo (200%, HD, 3 s).'
- 'Tensões da série: 200-240 V (B2), 380-480 V (T4), 500-600 V (T5), 500-690 V (T6) (pág. 4 e 28). Alimentação CC 229 a 1200 Vcc (pág. 28).'
- 'Saída analógica: 2 saídas, 0 a 10 V ou 0/4 a 20 mA (pág. 29). Saídas digitais: 2 a transistor NPN, 40 mA, 24 Vcc (pág. 29).'
- 'Frequência de saída: mecânicas A a D 0 a 500 Hz; E a H 0 a 250 Hz (pág. 28). Frequência de chaveamento nominal 4 kHz (mec. A a D) ou 2 kHz (mec. E a H e alguns modelos T6) (pág. 28).'
