notes:
- 'Valores da série PSTX30 a PSTX370; o catálogo cobre também a série PSTB470 a PSTB1050 (coluna separada na tabela de dados técnicos), não transcrita aqui.'
- 'Potência do motor: faixa para partida normal, ligação em linha, 400 V (p. 6 e 7): 15 kW (PSTX30) a 200 kW (PSTX370). Com ligação inside-delta a corrente chega a 640 A (p. 4).'
- 'Corrente em A é a corrente nominal operacional Ie (IEC).'
- 'Temperatura ambiente acima de 40 °C: reduzir a corrente nominal em 0,8 % por °C (p. 14, nota 2).'
- 'Fila de transcrição: novo link do site do fabricante.'
