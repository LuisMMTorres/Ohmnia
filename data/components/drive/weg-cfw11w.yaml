notes:
- 'Valores da série CFW-11W UP11-06 (Tabela 8.1, pág. 77): modelos CFW11W 1445 T6, 2600 T6 e 3900 T6, alimentação em barramento DC 574...1025 Vdc; faixa entre os modelos.'
- 'Alimentação é em Vdc (corrente de entrada em Adc), portanto sem número de fases de entrada; o parâmetro V_in registra a faixa do barramento DC.'
- 'Sobrecarga ND: 1590 A / 2860 A / 4290 A por 1 min e 2167 A / 3900 A / 5850 A por 3 s (Tabela 8.1, pág. 77). Motor máximo a 60 Hz / 690 V: 2000/1500 a 5500/4100 HP/kW.'
- 'Temperatura ambiente 0 a 45 C (redução de 1 % por grau até 50 C); temperatura de entrada do líquido de refrigeração 0 a 40 C, vazão 20 l/min; altitude nominal 1000 m (pág. 21, seção 3.1).'
