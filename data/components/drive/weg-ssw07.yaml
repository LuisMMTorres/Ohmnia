- 'Alimentação de controle: 110 a 240 Vac (modelos 17 A a 200 A); 110 a 130 Vac ou 208 a 240 Vac (255 A a 412 A) (p. 57).'
- 'Fila de transcrição: novo link de site agregador (conferir).'
