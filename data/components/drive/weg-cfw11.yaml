lifecycle: desconhecido
notes:
- 'Valores da série CFW-11 (Tabela 8.1, pág. 91): modelos 200...240 V e 380...480 V, de 0003 T 4 (3,6 A) a 0088 T 4 (88 A, 60 CV / 45 kW); faixa entre os modelos, uso ND (sobrecarga normal).'
- 'Corrente nominal de saída ND: 3,6 A (CFW11 0003 T 4) a 88 A (CFW11 0088 T 4); motor máximo ND de 1,5 kW (2 CV) a 45 kW (60 CV) (pág. 91).'
- 'Redução de corrente de 2 % por grau acima de 50 C (IP2X/Nema1) ou acima de 40 C (IP55); altitude 1000 m nominal, redução de 1 % por 100 m até 4000 m (pág. 93, notas). Umidade 5 % a 95 % sem condensação.'
- 'Frequência de saída: 0 a 3,4 x frequência nominal do motor (pág. 95). Entradas e saídas do cartão CC11: 6 DI isoladas 24 Vcc, 2 AI, 2 AO, 3 relés 240 Vca 1 A (pág. 95).'
