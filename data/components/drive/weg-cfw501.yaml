notes:
- 'Valores da série CFW501 (Tabela B.1, pág. 138): de CFW501A01P0T4 (1,0 A, 0,25 HP / 0,18 kW) a CFW501D31P0T4 (31 A, 20 HP / 15 kW); faixa entre os modelos.'
- 'Linhas de tensão: 200...240 V (T2) e 380...480 V (T4) (nomenclatura, pág. 11). Tolerância de tensão -15 % a +10 %, 50/60 Hz (pág. 43).'
- 'Frequência de saída 0 a 500 Hz, resolução 0,015 Hz; V/f com função de economia de energia ou VVW (Tabela 8.1, pág. 43).'
- 'Entradas/saídas consideradas com o plug-in CFW500-CRS485 (pág. 44, nota (*)): 2 AI, 4 DI, 1 AO, 2 relés 240 Vca 0,5 A, 1 saída a transistor; fonte 24 Vcc 150 mA; RS485 Modbus-RTU, BACnet ou N2 até 38,4 kbps.'
- 'Temperatura nominal ao redor do inversor 50 C (122 F), coluna adicional 40 C (104 F), Tabela B.2 (pág. 139).'
