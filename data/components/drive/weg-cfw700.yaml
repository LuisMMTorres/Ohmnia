# Fonte: WEG, CFW700 User's Manual (Frequency Inverter), documento 10000771684 / 04, 05/2015.
part_number: CFW700
category: drive.vfd
schema_version: '1.0'
manufacturer: WEG
family: CFW700
lifecycle: desconhecido
notes:
- 'Valores da série (tamanhos A...E); faixas entre os modelos. Numeração de páginas = páginas do PDF.'
- 'Corrente nominal de saída da faixa é a de sobrecarga normal (ND), Tabela 2.2 (p. 12): 3,6 A a 211 A. Potência do motor da série não transcrita (tabelas de potência não consultadas).'
- 'Tensão de entrada: modelos 200...240 V (S2/B2/T2), 220...230 V, 380...480 V (T4) e 500...600 V (T5); tolerância -15 % a +10 %, 50/60 Hz (p. 65).'
- 'Sobrecarga: ciclos ND e HD, curvas IGBT em 1 min e 3 s na Tabela B.4 (p. 221); percentuais não transcritos.'
- 'Temperatura ambiente de operação: de -10 °C até Ta da Tabela B.4; acima de Ta até 60 °C (tamanhos A-D) com redução de 2 %/°C (p. 15).'
- 'Fila de transcrição: novo link do distribuidor (wolfautomation).'
