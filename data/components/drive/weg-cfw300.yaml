lifecycle: desconhecido
notes:
- 'Valores da série CFW300 (Tabela B1, págs. 133 e 134): modelos de 110...127 Vac (1,6 a 6,0 A), 200...240 Vac (1,6 a 15,2 A) e 380...480 Vac (1,1 a 15,0 A); faixa entre os modelos.'
- 'Alguns modelos aceitam barramento DC: 280...340 Vdc (linha 200 V) e 513...650 Vdc (linha 400 V) (Tabela B1, págs. 133 e 134).'
- 'Potência máxima do motor: 0,25 HP / 0,18 kW a 10 HP / 7,5 kW (CFW300C15P0T4NB20) (Tabela B1, pág. 134).'
- 'Frequência de saída 0 a 400 Hz, resolução 0,1 Hz; controle V/f ou VVW; 4 DI, 1 AI, 1 relé 250 Vca 0,5 A, fonte 10 Vcc 50 mA (Tabela 8.1, pág. 127).'
- 'Temperatura nominal ao redor do inversor 50 C na Tabela B4 (pág. 140), coluna "Nominal Inverter Surrounding Temperature" (50/122 C/F).'
