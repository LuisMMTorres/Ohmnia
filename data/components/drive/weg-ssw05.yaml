notes:
- 'O PDF é o guia SSW-05 Plus (0899.4668 /5); a nota da fila cita o manual 0899.5119. Dados técnicos na seção 4 (p. 4) e tabelas das p. 5 e 6; os valores são da série (modelos 3 A a 85 A).'
- 'Potência do motor: faixa entre as colunas de tensão da tabela da p. 5 (0,55 kW a 220...240 V, modelo 3 A; 55 kW a 525 V, modelo 85 A).'
- 'Ajuste de corrente do motor: 30...100 % IN (p. 4); capacidade de partida 3 x IN durante 10 s (p. 4).'
- 'Entradas digitais (90...250 Vac, 6 mA), duas saídas a relé (1 A, 250 Vac), interface serial RS232C (p. 4).'
- 'Altitude: 0...1000 m; até 4000 m com redução de 10 % da corrente de saída por 1000 m (p. 4).'
- 'Fila de transcrição: novo link do distribuidor (wolfautomation).'
