package: Carcaça PBT cinza, 6.2 mm x 110.5 mm x 120.5 mm (L/A/P)
lifecycle: desconhecido
notes:
- 'Condicionador de sinal analógico de 3 vias (isolação entre entrada, saída e alimentação), configurável por chave DIP. Documento cobre as variantes 2902037 (parafuso), 2902040 (-PT push-in), 2902036 (-C) e 2902039 (-PT-C) (p. 3).'
- 'in_range não transcrito como parâmetro (várias faixas selecionáveis em V e mA, unidade mista): entradas de 0...20 mA, 4...20 mA, -20...20 mA e tensões de 0...5 V a -30...30 V (p. 5).'
- 'Corrente de entrada máx. 24 mA; tensão de entrada máx. 33 V; resistência de entrada: tensão > 1000 kΩ, corrente aprox. 63 Ω (p. 5).'
- 'Saída: tensão 0...5 V, 1...5 V, -5...5 V, 0...10 V, 2...10 V, -10...10 V (carga ≥ 10 kΩ); corrente 0...20 mA e 4...20 mA (carga ≤ 600 Ω a 20 mA); corrente máx. 22 mA; tensão a vazio < 17 V; ondulação < 20 mVpp (a 600 Ω) (p. 5).'
- 'Frequência de corte (3 dB): 30 Hz ou 5 kHz via DIP; coeficiente de temperatura máx. 0,01 %/K; erro máx. ≤ 0,1 % (≤ 0,15 % em IN 4...20 mA / OUT -10...10 V) (p. 6).'
- 'Consumo típico 25 mA (saída em corrente, 24 V DC, com carga) e 54 mA (12 V DC); potência ≤ 800 mW (p. 5).'
- 'Fila de transcrição: novo link do distribuidor (Digi-Key).'
