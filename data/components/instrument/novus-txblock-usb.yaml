# Fonte: Novus, TxBlock-USB Transmissor de Temperatura - Manual de Operação V1.0x H (4 páginas).
part_number: TxBlock-USB
category: instrument.transmitter
schema_version: '1.0'
manufacturer: Novus
package: Cabeçote, 43,5 mm (diâmetro) x 20,5 mm (altura), caixa ABS UL94-HB
lifecycle: desconhecido
notes:
- Transmissor de temperatura 4-20 mA a dois fios, alimentado pelo loop, configurado por USB (software TxConfig II).
- 'Carga máxima: RL(máx.) = (Vcc - 10) / 0,02 ohm, Vcc de 10 a 35 V (pág. 1).'
- 'Faixas máximas de medição (Tabela 1, pág. 1): Pt100 e Pt1000 -200 a 650 °C; Termopar K -150 a 1370 °C; J -100 a 760 °C; R e S -50 a 1760 °C; T -160 a 400 °C; N -270 a 1300 °C; E -90 a 720 °C; B 500 a 1820 °C; NTC -30 a 120 °C; Tensão 0 a 50 mV.'
- 'Exatidão (Tabela 2, pág. 1): Pt100/Pt1000 -200 a 650 °C típica 0,13 % e máxima 0,19 %; mV e termopares típica 0,1 % e máxima 0,15 % (somar junta fria < ±1 °C); NTC típica 0,3 °C e máxima 0,7 °C.'
- 'Corrente de excitação RTD 800 µA (Pt100 0,8 mA, Pt1000 0,65 mA); resolução da saída 2 µA; falha de sensor: < 3,6 mA (down-scale) ou > 22,0 mA (up-scale) (pág. 1-2).'
- 'Parâmetro accuracy refere-se a Pt100/Pt1000 de -150 a 400 °C (percentual da faixa máxima do sensor).'
- Sem isolação elétrica entre entrada e saída/porta USB; proteção interna contra inversão de polaridade (pág. 1-2).
