package: HVSSOP-10 (DGQ) e VSON-10 (DRC)
lifecycle: desconhecido
notes:
- 'Fila: XTR111. Conversor tensão-corrente de precisão (0-20 mA, 4-20 mA, 5-25 mA), com MOSFET P externo; corrente ajustada por RSET: IOUT = 10 x VVIN / RSET (p. 5).'
- 'Máximos absolutos (p. 4): VVSP 44 V; TA operação -55 a 125 °C; Tstg -65 a 150 °C (o registro usa a faixa recomendada em Top).'
- 'Corrente de saída especificada 0,1 a 25 mA; desempenho degradado de 0 a 32 mA; limite de corrente 41 +-9 mA (p. 5). Entrada VVIN 0 a 12 V (p. 4).'
- 'Regulador REGF ajustável 3 V a 15 V (p. 1); referência de 3,0 V (2,85 a 3,15 V), até 5 mA (p. 5). Não linearidade 0,002 % típ. / 0,02 % máx.; erro de span 0,015 % típ. / 0,1 % máx. (p. 5).'
