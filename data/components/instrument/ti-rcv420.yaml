# Fonte: Burr-Brown (Texas Instruments), RCV420 Precision 4mA to 20mA Current Loop Receiver, PDS-837E, SBVS019, October 1997.
part_number: RCV420
category: instrument.transmitter
schema_version: '1.0'
manufacturer: Texas Instruments
package: DIP plástico de 16 pinos (RCV420KP, RCV420JP) (p. 3)
lifecycle: desconhecido
notes:
- 'Receptor de laço de corrente: converte 4-20 mA em 0-5 V (ganho inicial 0,3125 V/mA), com resistores de sensor internos de 75 ohm e referência de 10 V (p. 1 e p. 2).'
- 'Faixa de entrada em corrente (4 a 20 mA) registrada em in_range; a unidade do parâmetro no esquema é adimensional (p. 1).'
- 'Alimentação nominal ±15 V; faixa de ±11,4 V a ±18 V (valores em módulo; nota 6: IO Ref = 5 mA, IO Rcv = 2 mA) (p. 2).'
- 'Especificações a TA = +25 °C e VS = ±15 V (p. 2); faixa de especificação 0 a +70 °C (p. 2).'
- 'Precisão total de conversão de 0,1% (p. 1); erro de ganho inicial 0,05% típ. e 0,15% máx. do span (p. 2).'
