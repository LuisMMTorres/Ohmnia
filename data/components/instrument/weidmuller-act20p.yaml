notes:
- 'O PDF é a folha de dados do modelo ACT20P-TMR-RTI-S (monitor de valor limite, entrada de temperatura RTD, saída a relé); valores transcritos são desse modelo da série ACT20P.'
- 'Faixa de entrada in_range em °C (PT100: -200 a 850 °C, configurável) (p. 2). Entrada PT100 2/3/4 fios ou PTC 0...4 kΩ (p. 2).'
- 'Saída: 2 relés (2 x 1 ou 1 x 2 contatos reversíveis), 250 Vac / 30 Vdc máx., corrente nominal 5 A; histerese ajustável 2 °C, atraso de alarme 0...10 s (p. 2).'
- 'Isolação galvânica de 3 vias entre entrada, saída e alimentação; tensão de isolação 2 kV (entrada/saída), 1 min, 50 Hz (p. 2).'
- 'Consumo: ≤ 100 mA @ 24 VDC, ≤ 120 mA @ 24 V AC (p. 2). Coeficiente de temperatura ≤ 100 ppm/K (p. 2).'
- 'Fila de transcrição: novo link do distribuidor (farnell).'
