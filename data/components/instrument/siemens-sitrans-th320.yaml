# Fonte: Siemens, Catálogo FI 01 (2025) Temperature Measurement, SITRANS TH320 / TH420 (cópia ics-schneider.de); atualização 03/2025. Registro do SITRANS TH320 (4...20 mA, HART, universal).
part_number: SITRANS TH320
category: instrument.transmitter
schema_version: '1.0'
manufacturer: Siemens
family: SITRANS TH320 / TH420
package: Transmissor para cabeçote, caixa IP68, 50 g
lifecycle: desconhecido
notes:
- 'Fila: sitrans th320 th420 datasheet en-US. O catálogo cobre também o TH420 (não transcrito aqui); valores abaixo da tabela Technical specifications do TH320 (págs. 6-7 do PDF).'
- 'Entradas: RTD (Pt, Ni, Cu), termopares (B, E, J, K, L, N, R, S, T, U, W3, W5, Lr), resistência linear 0...100 kΩ, potenciômetro 10...100 kΩ e tensão -100...1700 mV (págs. 6-7). Exatidão de entrada e de saída em tabelas ("Input accuracy" / "Output accuracy"), não transcritas.'
- 'Carga (saída em corrente): <= (VSupply - 7.5)/0,023 Ω; carga mínima em VSupply > 37 V: (Vsupply - 37 V)/23 mA. Dissipação máx. <= 850 mW (pág. 6-7).'
- 'Faixa normal de saída programável 3,8...20,5 mA; faixa estendida 3,5...23 mA; corrente de falha 3,5...23 mA; HART 7 (pág. 7). Amortecimento programável 0...60 s.'
- 'Temperatura ambiente de dispositivos com segurança funcional: -40...+80 °C (pág. 7). Tempo de partida < 2,75 s; aquecimento < 5 min.'
