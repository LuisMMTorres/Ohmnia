# Fonte: Texas Instruments, XTR108 4-20mA, Two-Wire Transmitter "Smart" Programmable with Signal Conditioning, SBOS187C, out/2001, rev. jul/2005.
part_number: XTR108
category: instrument.transmitter
schema_version: '1.0'
manufacturer: Texas Instruments
package: SSOP-24 (DBQ)
lifecycle: desconhecido
notes:
- 'Fila: XTR108. Transmissor 4-20 mA a 2 fios programável (calibração digital via SPI, EEPROM externa), para RTD e sensores em ponte; também saída em tensão 0,5 V a 4,5 V. Equação: IO = VIN (Span) + 4 mA (p. 2).'
- 'Máximos absolutos (p. 2): VS externa (ref. IRET) +5,5 V; tensão de entrada do multiplexador 0 V a VS; TJ +165 °C; solda +300 °C (10 s). Tensão da malha depende do FET externo.'
- 'Condições de teste: VPS = 24 V, FET externo Supertex DN2540; VLOOP = 7,5 V a 24 V nos testes de rejeição (p. 2).'
- 'Sub-regulador VS para o próprio XTR: 4,8 / 5,1 / 5,4 V (mín./típ./máx.) (p. 3). Limite de sobre-escala selecionável 21 a 28,5 mA; sub-escala 2,2 a 3,6 mA, conforme NAMUR NE43 (p. 2).'
- 'Erro de zero não ajustado +-50 uA máx.; span inicial +-1 %, deriva 40 ppm/°C; não linearidade 0,01 % (VIN fundo de escala 50 mV) (p. 2).'
