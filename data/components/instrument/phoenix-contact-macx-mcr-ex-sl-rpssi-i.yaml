notes:
- 'Fila: repeater-power-supply-macx-mcr-ex-sl-rpssi-2865340 (art. 2865340). Repetidor/alimentador Ex-i com isolação de 3 vias, HART, SIL 2.'
- 'Dados Ex (pág. 4): Uo 25,2 V, Io 93 mA, Po 587 mW, Lo 2 mH, Co 107 nF; Ui <= 30 V, Ii <= 130 mA.'
- 'Tensão de alimentação do transmissor > 16 V a 20 mA; queda de tensão < 3,5 V (pág. 2). Corrente de saída 0/4-20 mA ativa ou passiva (fonte externa 14-26 V).'
- 'Erro máximo < 0,1 % do valor final; típico < 0,05 %; coeficiente de temperatura < 0,01 %/K (págs. 2-3). Ondulação da saída < 20 mVrms.'
