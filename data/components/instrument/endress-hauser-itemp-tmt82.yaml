family: iTEMP TMT82
lifecycle: desconhecido
notes:
- "Nome na fila: TI01010T09EN 0313 (revisão original 03/2013; o documento baixado é a revisão 2025-03-10)."
- "Transmissor de temperatura HART de 2 fios com duas entradas universais (RTD, termopar, resistência, tensão mV); versões cabeça, trilho DIN e caixa de campo."
- "Faixas de entrada (p. 5-6): RTD Pt100 -200 a +850 °C, Pt1000 -200 a +250 °C, Ni100 -60 a +250 °C, resistência 10 a 400 Ω ou 10 a 2000 Ω, mV -20 a 100 mV; termopares tipos A, B, C, D, E, J, K, L, N, R, S, T, U (ex.: tipo K -270 a +1372 °C). Sem símbolo no schema para in_range."
- "VS: transmissor de cabeça 11 a 42 V (modo SIL 11 a 32 V); trilho DIN 12 a 42 V (modo SIL 12 a 32 V) (p. 8). Consumo de corrente 3,6 a 23 mA (p. 8). Tempo de resposta p. 11."
- "Top: -40 a +85 °C (opcional -50 ou -52 °C; caixa de campo com display -30 a +85 °C; modo SIL -40 a +70 °C) (p. 19-20). Tstg: cabeça -50 a +100 °C (p. 20)."
- "Erro de medição por tipo de sensor em fórmula (p. 12-13), p. ex. mV ±10 µV; D/A 0,03 % da faixa. Não transcrito como accuracy."
- "Alarme de falha: ≤ 3,6 mA (baixo) ou ≥ 21 mA (alto, ajustável 21,5 a 23 mA); sub-faixa 4,0 a 3,8 mA, sobre-faixa 20,0 a 20,5 mA (p. 7)."
