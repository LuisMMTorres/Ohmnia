notes:
- 'Item da fila: MACX MCR-SL-UI-UI. O PDF baixado é do MINI MCR-SL-UI-UI-SP-NC (art. 2864163), isolador MCR de 3 vias; o número MACX não aparece no documento (pág. 1). Conferir se é o mesmo produto.'
- 'Entrada configurável por DIP: tensão 0-10 V, 0-5 V, 1-5 V, 2-10 V; corrente 0-20 mA, 4-20 mA; máx. 30 V / 50 mA; resistência de entrada ≈100 kohm (tensão) e ≈50 ohm (corrente) (pág. 2).'
- 'Saída configurável: tensão 0-10 V, 0-5 V, 1-5 V, 2-10 V (carga ≥10 kohm); corrente 0-20 mA ou 4-20 mA (carga <500 ohm a 20 mA); tensão máx. ≈12,5 V e corrente máx. 28 mA (pág. 2).'
- 'Erro de transmissão máx. ≤0,1% do valor final (<0,4% sem ajuste); coeficiente de temperatura <0,01 %/K (pág. 3). Frequência limite 3 dB ≈100 Hz (pág. 3).'
- 'Tensão de isolação nominal 50 V AC/DC; tensão de teste entrada/saída/alimentação 1,5 kV (50 Hz, 1 min) (pág. 3).'
