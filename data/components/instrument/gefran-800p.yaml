notes:
- 'Fila: dts 800p en. Catálogo geral (guia de seleção); a coluna 800 / 800V / 800P agrupa os três modelos, 800P = programador de setpoint.'
- 'Os rótulos das linhas estão nas páginas 8 e 10 e as colunas do 800 nas páginas 9 e 11: a associação foi feita pela posição das linhas; conferir no PDF.'
