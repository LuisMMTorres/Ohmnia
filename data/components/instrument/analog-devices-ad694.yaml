# Fonte: Analog Devices, AD694 4-20 mA Transmitter, REV. B, 2002.
part_number: AD694
category: instrument.transmitter
schema_version: '1.0'
manufacturer: Analog Devices
package: CERDIP 16 pinos, SOIC plástico 16 pinos e DIP plástico 16 pinos
lifecycle: desconhecido
notes:
- Transmissor monolítico tensão-corrente 4-20 mA / 0-20 mA; entradas pré-calibradas 0 a 2 V e 0 a 10 V (pág. 1).
- Especificações a +25 °C, RL = 250 ohm, VS = +24 V (pág. 3). Modelos AD694JN/AQ/AR e AD694BQ/BR; valores abaixo são os da coluna JN/AQ/AR (mais folgada).
- Faixa de operação da corrente 0 a 23 mA; desempenho especificado 4 a 20 mA; impedância de saída 40 a 50 Mohm típ. (pág. 3).
- Erro de função de transferência ±0,1% do span típ. (0,3% máx.) e não linearidade ±0,005% típ. (0,015% máx.), JN/AQ/AR (pág. 3). A exatidão abaixo é o máximo do erro de função de transferência.
- Faixa de operação (Top) AQ/BQ/AR/BR -55 a +125 °C; AD694JN -40 a +85 °C (pág. 3). Faixa especificada AQ/BQ/AR/BR -40 a +85 °C; JN 0 a +70 °C.
- Armazenamento, AD694Q -65 a +150 °C; AD694N, R -65 a +125 °C (pág. 4); aqui usada a faixa comum -65 a +125 °C.
- Alimentação máxima absoluta 36 V; compliance de saída até VS - 2 V (pág. 3 e 4).
