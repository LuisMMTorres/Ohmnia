package: VSSOP-8 (DGK) e VSON-8 (DRB)
lifecycle: desconhecido
notes:
- 'Fila: XTR117. Conversor de corrente de malha 4-20 mA: IO = IIN x 100 (ganho 100 A/A); regulador de 5 V para circuitos externos; transistor externo (TIP29C no teste); RIN = 20 kohm no teste (p. 6).'
- 'Máximos absolutos (p. 5): V+ 40 V (referido ao pino IO); TJ 165 °C; TA operação -40 a 125 °C; Tstg -55 a 150 °C.'
- 'Faixa linear de saída 0,20 a 25 mA; limite de sobre-escala 32 mA; sub-escala 0,13/0,20 mA; erro de span +-0,4 % máx.; não linearidade +-0,02 % máx. (p. 6).'
- 'IQ de 130 uA típ./200 uA máx. refere-se à variante CSO SHE a 25 °C; CSO TID 105/200 uA; máx. 250 uA de -40 a 125 °C (p. 6).'
