notes:
- Conversor tensão-corrente isolado, modelo 1B22AN. Valores típicos a 25 °C, VS = ±15 V, VLOOP = +24 V (pág. 2).
- Entrada selecionável por pinos 0 a +5 V (impedância 25 kohm) ou 0 a +10 V (50 kohm), pág. 2.
- Alimentação do lado de entrada ±15 V ±5% (quiescente ±7,5 mA); VS abaixo refere-se à alimentação de laço (loop) +14 V a +30 V (pág. 2).
- Compliance de carga 8 V min com VLOOP = +15 V e 20 V min com VLOOP = +28 V (pág. 2).
- Não linearidade ±0,02% (máx. ±0,05%) do fundo de escala; erro de span ±0,7% FS e offset ±60 uA a 25 °C; tempco offset ±300 nA/°C, ganho ±50 ppm/°C (pág. 2). A exatidão abaixo é o erro de span.
- CMR 90 dB min a 60 Hz; proteção de saída em modo normal 240 V rms contínuo; banda de pequenos sinais 400 Hz (pág. 2).
