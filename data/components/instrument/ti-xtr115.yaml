# Fonte: Texas Instruments, XTR115, XTR116 4-20mA Current-Loop Transmitters (XTR11x), SBOS124C, jan/2000, rev. jan/2026.
part_number: XTR115
category: instrument.transmitter
schema_version: '1.0'
manufacturer: Texas Instruments
family: XTR11x
package: SOIC-8 (D)
lifecycle: desconhecido
notes:
- 'Fila: XTR115. O mesmo PDF cobre XTR115 e XTR116; diferem apenas na referência VREF: XTR115 2,5 V, XTR116 4,096 V (p. 1 e 6). Este registro: XTR115, VREF 2,5 V.'
- 'Conversor de corrente de malha 4-20 mA: IO = IIN x 100 (ganho 100 A/A); regulador de 5 V (VREG) para circuitos externos; transistor externo (TIP29C no teste); RIN = 20 kohm no teste (p. 6).'
- 'Máximos absolutos (p. 5): V+ 40 V (referido ao pino IO); TJ 165 °C; TA operação -40 a 125 °C; solda 300 °C (10 s).'
- 'Faixa linear de saída 0,25 a 25 mA; limite de sobre-escala 32 mA; sub-escala 0,2/0,25 mA; erro de span +-0,2 % máx. (variante U), +-0,4 % (UA); não linearidade +-0,01 % máx. (U) (p. 6).'
- 'IQ de 200 uA típ./250 uA máx. refere-se à variante CSO SHE a 25 °C; CSO TID 165/250 uA (p. 7).'
