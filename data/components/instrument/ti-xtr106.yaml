# Fonte: Texas Instruments, XTR106 4mA to 20mA Current Transmitter With Bridge Excitation and Linearization, SBOS092C, jun/1998, rev. jan/2026.
part_number: XTR106
category: instrument.transmitter
schema_version: '1.0'
manufacturer: Texas Instruments
package: SOIC-14 (D) e PDIP-14 (N)
lifecycle: desconhecido
notes:
- 'Fila: XTR106. Transmissor 4-20 mA a 2 fios para sensores em ponte, com referências de excitação de 2,5 V ou 5 V, regulador VREG de 5,1 V e linearização; transistor externo (TIP29C no teste). Equação de saída: IO = VIN x (40 / RG) + 4 mA (p. 5).'
- 'Máximos absolutos (p. 4): V+ 40 V (referido ao pino IO); TJ 165 °C; TA operação -40 a 125 °C; solda 300 °C (10 s).'
- 'Erro de zero inicial +-25 uA máx. (P/U), +-50 uA (PA/UA); erro de span não ajustado +-0,2 % máx. (P/U), +-0,4 % (PA/UA); não linearidade +-0,01 % máx. (p. 5).'
- 'Limites de saída: sobre-escala 24/28/30 mA; sub-escala 1/1,6/2,2 mA (IREF=IREG=0) (p. 5). Referências VREF 2,5 V e 5 V, precisão +-0,25 % máx. (P/U); VREG 5,1 V (p. 6).'
