# Fonte: Texas Instruments, XTR105 4-20mA Current Transmitter With Sensor Excitation and Linearization, SBOS061D, fev/1997, rev. dez/2025.
part_number: XTR105
category: instrument.transmitter
schema_version: '1.0'
manufacturer: Texas Instruments
package: SOIC-14 (D) e PDIP-14 (N)
lifecycle: desconhecido
notes:
- 'Fila: XTR105. Transmissor 4-20 mA a 2 fios com duas fontes de corrente de 800 uA para RTD, linearização de RTD; transistor externo (TIP29C no teste). Equação de saída: IO = VIN x (40 / RG) + 4 mA (p. 5).'
- 'Máximos absolutos (p. 4): V+ 40 V (referido ao pino IO); TJ 165 °C; TA operação -40 a 125 °C; solda 300 °C (10 s).'
- 'Erro de zero inicial +-25 uA máx. (P/U), +-50 uA máx. (PA/UA); erro de span inicial +-0,2 % máx. (P/U), +-0,4 % (PA/UA); não linearidade 0,01 % máx. (p. 5).'
- 'Limites de saída: sobre-escala 24/27/30 mA (mín./típ./máx.); sub-escala 1,8/2,2/2,6 mA (p. 5). Fontes de corrente 800 uA; VREG 5,1 V (p. 6).'
