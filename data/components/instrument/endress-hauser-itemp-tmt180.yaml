# Fonte: Endress+Hauser, Technical Information iTEMP TMT180, TI00088R/09/EN/16.21-00, 2021-10-20.
part_number: iTEMP TMT180
category: instrument.transmitter
schema_version: '1.0'
manufacturer: Endress+Hauser
family: iTEMP TMT180
package: Transmissor de cabeça (DIN EN 50446 forma B), ~40 g
lifecycle: desconhecido
notes:
- "Nome na fila: TI00088R09EN 0711 (índice 391) e TI00088R (índice 500); ambos são o mesmo PDF (mesmo sha256); o documento baixado é a revisão 16.21-00 (2021-10-20)."
- "Transmissor de cabeça de 2 fios programável por PC para Pt100 (2, 3 ou 4 fios), saída analógica 4 a 20 mA ou 20 a 4 mA (p. 1-2)."
- "Faixa de entrada (p. 2): Pt100 -200 a +650 °C (span mín. 10 K); opcional -50 a 250 °C (span mín. 10 K). Sem símbolo no schema para in_range."
- "Carga máxima (p. 2): (Valimentação - 10 V) / 0,022 A (saída em corrente). Não transcrito como RL por ser fórmula."
- "Exatidão (p. 3): 0,2 K ou 0,08 % (o maior); opcional 0,1 K ou 0,08 % em -50 a 250 °C; % refere-se ao span ajustado."
- "Sinal de alarme (p. 2): ruptura/curto do sensor ≤ 3,6 mA ou ≥ 21,0 mA; sub-faixa até 3,8 mA; sobre-faixa até 20,5 mA; limite de corrente ≤ 23 mA; atraso de ligação 4 s. Corrente do sensor ≤ 0,6 mA."
- "Ondulação residual permitida Uss ≤ 3 V com Ub ≥ 13 V, f máx. 1 kHz (p. 3). Influência da alimentação ≤ ±0,01 %/V; deriva ≤ 0,1 K/ano ou ≤ 0,05 %/ano (p. 3)."
