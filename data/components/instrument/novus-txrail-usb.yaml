lifecycle: desconhecido
notes:
- 'Fila: manual txrail usb portugues (o arquivo é o manual em inglês). Transmissor de temperatura programável por USB, montagem em trilho DIN.'
- 'Exatidão (tabela 2, % da faixa): Pt100/Pt1000 -150 a 400 °C 0,10 % típ. / 0,12 % máx.; -200 a 650 °C 0,13 % / 0,19 %; termopares 0,1 % / 0,15 % (+ compensação de junta fria < ±1 °C); mV 0,1 % / 0,15 %; NTC 0,3 °C / 0,7 °C.'
- 'Carga máxima (saída 4-20 mA): RL(máx.) = (Vdc - 10) / 0,02 ohm. Alimentação 10 a 30 Vdc (saída 4-20 mA) e 12 a 30 Vdc (saída 0-10 Vdc).'
- 'Sem isolação elétrica entre entrada e saída. Efeito da temperatura < ±0,16 % / 25 °C. Resolução de saída 2 µA (4-20 mA), 0,0025 V (12 bits, 0-10 V).'
