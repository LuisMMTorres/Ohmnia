notes:
- 'Documento da série B598**; a linha da peça B59850C0120A070 é o tipo C850 com Tref 120 °C (pág. 3): IR 200 mA, IS 400 mA, ISmax 2,2 A, Ir 13 mA, RR 10 Ω, Rmin 6,4 Ω.'
- 'Mapeamento adotado: I_hold = IR (corrente nominal "rated current"), I_trip = IS (corrente de comutação "switching current"), I_max = ISmax (corrente de comutação máxima a Vmax), R25 = RR (resistência nominal à temperatura nominal TR = 25 °C, pág. 15). Confirmar o mapeamento na revisão.'
- 'Dimensões do tipo C850 / Tref 120 °C (pág. 2): wmax 13,5 mm, hmax 17,0 mm, lmin 25 mm, diâmetro do terminal 0,6 mm.'
- 'Ciclos de comutação N = 100; tolerância de RR ±25% para Tref 80 ou 120 °C (pág. 3). Corrente residual Ir 13 mA típ. a V = Vmax. Aprovação UL 1434 para Tref = 120 °C com Vmax = 230 V e VR = 220 V (pág. 2).'
- 'Faixa de operação com V = 0: o texto extraído mostra "40/+125" (sinal negativo perdido); registrada como -40 a 125 °C, confirmar no PDF.'
