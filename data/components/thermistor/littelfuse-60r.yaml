# Fonte: Littelfuse, POLY-FUSE Resettable PTCs Datasheet, 60R Series Radial Leaded, Revised GD. 08/22/23.
part_number: 60R
category: thermistor.ptc
schema_version: '1.0'
manufacturer: Littelfuse
family: 60R Series (POLYFUSE radial, rearmável)
package: radial com fios
lifecycle: desconhecido
notes:
- 'Valores da série: 16 modelos de 60R010X a 60R375X; faixas abaixo são entre os modelos.'
- 'Condições de I hold e I trip: ar parado a 20 °C (definições, pág. 1). R1max medida 1 hora após disparo ou refusão de solda (260 °C por 20 s).'
- 'Tempo máximo de disparo (Maximum Time To Trip) dado a corrente de 5 x I hold, de 0,50 A (60R010X) a 18,75 A (60R375X), com tempos de 2,2 s a 8,2 s ou mais conforme o modelo (pág. 1).'
- 'Dissipação típica no estado disparado Pd de 0,38 W a 3,20 W (pág. 1). Resistência mínima Rmin de 0,030 a 2,500 ohm e R1max de 0,080 a 8,000 ohm.'
- 'Temperatura máxima de superfície do dispositivo disparado: 125 °C (pág. 3). A pág. 2 traz a tabela de corrente de hold de -40 °C a 85 °C por modelo.'
