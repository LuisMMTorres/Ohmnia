notes:
- 'Documento da série NTCLE100E3; a peça 103JB0 é a linha de 10 000 Ω, tolerância J = 5% (nota 1, pág. 2), B25/85 = 3977 K com tolerância ±0,75% (pág. 2, tabela Electrical data).'
- 'Faixa de operação -40 a +125 °C contínuo com dissipação zero, até 150 °C por períodos curtos (pág. 1). Tensão sobre o NTC deve ser sempre inferior a 50 VDC (pág. 2).'
- 'Tempo de resposta em óleo aprox. 1,2 s; massa aprox. 0,3 g; cULus E148885 (pág. 1). Fator de dissipação informado como 7 mW/K (8,5 mW/K para R25 ≤ 680 Ω).'
