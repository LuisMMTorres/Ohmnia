notes:
- 'Valores da série; faixas entre os modelos KTC-5017/5023/5034, 42HS, HT23, HT34 e KML (inclui versões com redutor e IP65).'
- 'Todos os modelos com passo de 1,8° e isolamento classe B (130 °C) (p. 3 e demais).'
- 'Corrente por fase: faixa entre as ligações bipolar série, bipolar paralelo e unipolar; mín. 0,11 A (KTC-5017-008, p. 3) e máx. 9,00 A (KTC-HT34-487-R:10 paralelo, p. 26).'
- 'Alimentação (V_rated) só aparece em alguns modelos NEMA 17 (p. 6 a 10): 2,75 V a 10 V.'
- 'Torque máx. 12,7 Nm é o impresso para KTC-HT34-487 (p. 2 e 26); na p. 25 o texto está corrompido e o título do modelo diz "6Nm". Conferir no PDF.'
- 'Massa máx. 9,1 kg é do conjunto motor mais redutor (p. 26). Faixa de temperatura -20 a +50 °C na maioria; modelos IP65 -10 a +80 °C (p. 22 e 28).'
- 'Fila de transcrição: novo link do site do fabricante.'
