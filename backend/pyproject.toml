[project]
name = "circuitos"
version = "0.1.0"
description = "Projeto, dimensionamento, seleção de componentes e simulação de circuitos eletrônicos"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "pint>=0.24",
    "numpy>=2.0",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "jinja2>=3.1",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# Optional LLM-assisted datasheet mapping (decision D9). Without it, rules-only mapping.
llm = ["anthropic>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/circuitos"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["N802", "N803", "N806", "N815", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# design modules declare their labels, lab items and questions as plain class constants
"src/circuitos/design/plugins/**" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/circuitos"]

[[tool.mypy.overrides]]
module = ["pint.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ngspice: requires the ngspice shared library or executable",
    "datasheet: downloads manufacturer datasheets (network)",
]
addopts = "-q"

[tool.coverage.run]
source = ["circuitos"]
omit = ["src/circuitos/api/*"]

[tool.importlinter]
root_package = "circuitos"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain core must not depend on the web layer"
type = "forbidden"
source_modules = [
    "circuitos.core",
    "circuitos.components",
    "circuitos.simulation",
    "circuitos.design",
    "circuitos.selection",
    "circuitos.thermal",
    "circuitos.magnetics",
    "circuitos.devices",
    "circuitos.schematic",
    "circuitos.reports",
    "circuitos.datasheets",
]
forbidden_modules = ["fastapi", "circuitos.api", "starlette", "uvicorn"]

[[tool.importlinter.contracts]]
name = "core is independent of everything else in the project"
type = "forbidden"
source_modules = ["circuitos.core"]
forbidden_modules = [
    "circuitos.components",
    "circuitos.simulation",
    "circuitos.design",
    "circuitos.api",
]

[[tool.mypy.overrides]]
module = ["circuitos.datasheets.*"]
disallow_untyped_calls = false
