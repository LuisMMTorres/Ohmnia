category: sensor.humidity
schema_version: '1.0'
description: Sensor de umidade (e temperatura)
required:
- range
parameters:
  range:
    unit: '%'
    kind: characteristic
    description: Faixa de umidade relativa
  accuracy:
    unit: '%'
    kind: characteristic
    description: Exatidão em UR (±)
  T_range:
    unit: °C
    kind: characteristic
    description: Faixa de temperatura medida
  T_accuracy:
    unit: K
    kind: characteristic
    description: Exatidão em temperatura
  resolution:
    unit: '%'
    kind: characteristic
    description: Resolução da umidade (saída digital)
  T_resolution:
    unit: K
    kind: characteristic
    description: Resolução da temperatura (saída digital)
  t_sample:
    unit: s
    kind: characteristic
    description: Período mínimo entre leituras (saída digital)
  p_range:
    unit: hPa
    kind: characteristic
    description: Faixa de pressão medida (sensor combinado)
  p_accuracy:
    unit: hPa
    kind: characteristic
    description: Exatidão absoluta da pressão (±)
  t_resp:
    unit: s
    kind: characteristic
    description: Tempo de resposta
  VS:
    unit: V
    kind: characteristic
    description: Tensão de alimentação (faixa)
  IS:
    unit: mA
    kind: characteristic
    description: Consumo de corrente sem carga
  Top:
    unit: °C
    kind: thermal
    description: 'Temperatura de operação (faixa: mín. e máx.)'
  Tstg:
    unit: °C
    kind: thermal
    description: Temperatura de armazenamento (faixa)
attributes:
  saida: Saída (digital de um fio, I2C, analógica)
  endereco_i2c: Endereço I2C (e como escolhê-lo)
  protocolo: Protocolo e temporização da saída digital
