category: sensor.humidity
schema_version: '1.0'
description: Sensor de umidade (e temperatura)
required:
- range
parameters:
  range:
    unit: '%'
    kind: characteristic
    description: Faixa de umidade relativa
  accuracy:
    unit: '%'
    kind: characteristic
    description: Exatidão em UR (±)
  T_range:
    unit: °C
    kind: characteristic
    description: Faixa de temperatura medida
  T_accuracy:
    unit: K
    kind: characteristic
    description: Exatidão em temperatura
  t_resp:
    unit: s
    kind: characteristic
    description: Tempo de resposta
  VS:
    unit: V
    kind: characteristic
    description: Tensão de alimentação (faixa)
  IS:
    unit: mA
    kind: characteristic
    description: Consumo de corrente sem carga
  Top:
    unit: °C
    kind: thermal
    description: 'Temperatura de operação (faixa: mín. e máx.)'
  Tstg:
    unit: °C
    kind: thermal
    description: Temperatura de armazenamento (faixa)
attributes:
  saida: Saída (digital de um fio, I2C, analógica)
