category: resistor.fixed
schema_version: '1.0'
description: 'Resistor fixo (ou série de resistores: R mín. e máx. da série)'
required:
- R
- P_rated
parameters:
  R:
    unit: ohm
    kind: characteristic
    description: Resistência nominal (ou faixa da série)
  tol:
    unit: '%'
    kind: characteristic
    description: Tolerância
  P_rated:
    unit: W
    kind: max_rating
    description: Potência nominal a 70 °C (ou na temperatura indicada na nota)
  V_max:
    unit: V
    kind: max_rating
    description: Tensão máxima de trabalho
  V_overload:
    unit: V
    kind: max_rating
    description: Tensão máxima de sobrecarga
  TCR:
    unit: ppm/K
    kind: characteristic
    description: Coeficiente de temperatura
  Top:
    unit: °C
    kind: thermal
    description: 'Temperatura de operação (faixa: mín. e máx.)'
  Tstg:
    unit: °C
    kind: thermal
    description: Temperatura de armazenamento (faixa)
attributes:
  tecnologia: Tecnologia (filme de carbono, filme metálico, fio, SMD...)
  encapsulamento: Encapsulamento e dimensões
