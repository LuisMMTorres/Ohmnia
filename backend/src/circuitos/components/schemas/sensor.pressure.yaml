category: sensor.pressure
schema_version: '1.0'
description: Transmissor, sensor, chave ou manômetro de pressão
required:
- range_bar
parameters:
  range:
    unit: '1'
    kind: characteristic
    description: Faixa de medição (unidade na nota se não for SI)
  accuracy:
    unit: '%'
    kind: characteristic
    description: Exatidão ou erro de medição (% do fundo de escala ou do valor)
  VS:
    unit: V
    kind: characteristic
    description: Tensão de alimentação (faixa)
  IS:
    unit: mA
    kind: characteristic
    description: Consumo de corrente sem carga
  I_out:
    unit: mA
    kind: characteristic
    description: 'Sinal de saída em corrente (faixa, ex.: 4 a 20 mA)'
  V_out:
    unit: V
    kind: characteristic
    description: 'Sinal de saída em tensão (faixa, ex.: 0 a 10 V)'
  RL:
    unit: ohm
    kind: max_rating
    description: Carga máxima no laço ou na saída
  t_resp:
    unit: ms
    kind: characteristic
    description: Tempo de resposta
  T_process:
    unit: °C
    kind: max_rating
    description: Temperatura do processo (faixa)
  Top:
    unit: °C
    kind: thermal
    description: 'Temperatura de operação (faixa: mín. e máx.)'
  Tstg:
    unit: °C
    kind: thermal
    description: Temperatura de armazenamento (faixa)
  range_bar:
    unit: bar
    kind: characteristic
    description: Faixa de pressão
  overpressure:
    unit: bar
    kind: max_rating
    description: Sobrepressão admissível
attributes:
  saida: Tipo de saída (PNP, NPN, NA, NF, push-pull, 4-20 mA, 0-10 V, IO-Link...)
  conexao: Conexão elétrica (cabo, conector M8/M12...)
  invólucro: Invólucro, rosca e material
  grau_protecao: Grau de proteção (IP) declarado
  certificacoes: Certificações e aprovações (UL, CE, ATEX...)
  comunicacao: Comunicação digital (HART, IO-Link, Modbus, PROFIBUS...)
  principio: Princípio de medição
