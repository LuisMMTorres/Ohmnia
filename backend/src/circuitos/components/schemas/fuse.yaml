category: fuse
schema_version: '1.0'
description: Fusível, porta-fusível ou disjuntor de proteção
required:
- I_rated
- V_rated
parameters:
  I_rated:
    unit: A
    kind: max_rating
    description: Corrente nominal (ou faixa da série)
  V_rated:
    unit: V
    kind: max_rating
    description: Tensão nominal
  I_break:
    unit: A
    kind: max_rating
    description: Capacidade de interrupção
  I2t:
    unit: A^2*s
    kind: characteristic
    description: Integral de Joule (fusão)
  R_cold:
    unit: ohm
    kind: characteristic
    description: Resistência a frio
  P_diss:
    unit: W
    kind: characteristic
    description: Dissipação na corrente nominal
  Top:
    unit: °C
    kind: thermal
    description: 'Temperatura de operação (faixa: mín. e máx.)'
  Tstg:
    unit: °C
    kind: thermal
    description: Temperatura de armazenamento (faixa)
attributes:
  curva: Característica (rápido F, retardado T, gG, aR, ultrarrápido...)
  formato: Formato (5x20, cartucho, NH, lâmina...)
  grau_protecao: Grau de proteção (IP) declarado
  certificacoes: Certificações e aprovações (UL, CE, ATEX...)
