category: instrument.controller
schema_version: '1.0'
description: Controlador de processo, indicador ou relé de monitoração
required: []
parameters:
  inputs:
    unit: '1'
    kind: geometry
    description: Entradas
  outputs:
    unit: '1'
    kind: geometry
    description: Saídas
  accuracy:
    unit: '%'
    kind: characteristic
    description: Exatidão da entrada
  t_sample:
    unit: ms
    kind: characteristic
    description: Período de amostragem
  I_relay:
    unit: A
    kind: max_rating
    description: Corrente do relé de saída
  VS:
    unit: V
    kind: characteristic
    description: Tensão de alimentação (faixa)
  IS:
    unit: mA
    kind: characteristic
    description: Consumo de corrente sem carga
  Top:
    unit: °C
    kind: thermal
    description: 'Temperatura de operação (faixa: mín. e máx.)'
  Tstg:
    unit: °C
    kind: thermal
    description: Temperatura de armazenamento (faixa)
attributes:
  entrada: Tipos de entrada
  saida: Tipos de saída
  controle: Algoritmos (PID, on-off...)
  comunicacao: Comunicação
  grau_protecao: Grau de proteção (IP) declarado
  certificacoes: Certificações e aprovações (UL, CE, ATEX...)
