category: sensor.temperature
schema_version: '1.0'
description: Sensor de temperatura (CI, RTD, termopar, NTC encapsulado, sonda)
required:
- range
parameters:
  range:
    unit: °C
    kind: characteristic
    description: Faixa de medição
  accuracy:
    unit: K
    kind: characteristic
    description: Exatidão (±, em kelvin)
  sensitivity:
    unit: mV/K
    kind: characteristic
    description: Sensibilidade (saída em tensão)
  R0:
    unit: ohm
    kind: characteristic
    description: Resistência nominal a 0 °C (RTD)
  alpha:
    unit: 1/K
    kind: characteristic
    description: Coeficiente α do RTD
  V_offset:
    unit: V
    kind: characteristic
    description: Tensão de saída a 0 °C (offset), sensor com saída em tensão
  R25:
    unit: ohm
    kind: characteristic
    description: Resistência a 25 °C (sensor resistivo de silício ou NTC encapsulado)
  R:
    unit: ohm
    kind: characteristic
    description: Resistência na temperatura indicada nas condições (tabela R × T)
  t_resp:
    unit: s
    kind: characteristic
    description: Tempo de resposta (t90 ou t63)
  t_conv:
    unit: s
    kind: characteristic
    description: Tempo de conversão na resolução indicada nas condições (saída digital)
  bits:
    unit: bit
    kind: characteristic
    description: Resolução (saída digital)
  VS:
    unit: V
    kind: characteristic
    description: Tensão de alimentação (faixa)
  IS:
    unit: mA
    kind: characteristic
    description: Consumo de corrente sem carga
  Top:
    unit: °C
    kind: thermal
    description: 'Temperatura de operação (faixa: mín. e máx.)'
  Tstg:
    unit: °C
    kind: thermal
    description: Temperatura de armazenamento (faixa)
attributes:
  elemento: Elemento (Pt100 classe A, termopar tipo K, CI...)
  saida: Saída (tensão, corrente, digital 1-Wire, I2C...)
  ligacao: Ligação (2, 3 ou 4 fios)
  grau_protecao: Grau de proteção (IP) declarado
  certificacoes: Certificações e aprovações (UL, CE, ATEX...)
  protocolo: Protocolo e temporização da saída digital
