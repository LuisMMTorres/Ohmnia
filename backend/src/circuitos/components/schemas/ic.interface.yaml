category: ic.interface
schema_version: '1.0'
description: Driver, interface ou periférico (driver de motor, transceptor, expansor, display...)
required: []
parameters:
  VS:
    unit: V
    kind: characteristic
    description: Alimentação lógica (faixa)
  V_load:
    unit: V
    kind: max_rating
    description: Tensão de alimentação da carga ou do motor
  I_out:
    unit: A
    kind: max_rating
    description: Corrente de saída por canal
  I_peak:
    unit: A
    kind: max_rating
    description: Corrente de pico
  R_on:
    unit: ohm
    kind: characteristic
    description: Resistência ou queda em condução
  V_sat:
    unit: V
    kind: characteristic
    description: Tensão de saturação da saída
  f_max:
    unit: kHz
    kind: characteristic
    description: Frequência ou taxa máxima
  channels:
    unit: '1'
    kind: geometry
    description: Canais
  ICC:
    unit: mA
    kind: characteristic
    description: Corrente de alimentação
  Top:
    unit: °C
    kind: thermal
    description: 'Temperatura de operação (faixa: mín. e máx.)'
  Tstg:
    unit: °C
    kind: thermal
    description: Temperatura de armazenamento (faixa)
attributes:
  funcao: Função
  interface: Interface (I2C, SPI, UART, RS-232, RS-485...)
  encapsulamento: Encapsulamento ou módulo
