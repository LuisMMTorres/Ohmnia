category: sensor.encoder
schema_version: '1.0'
description: Encoder incremental ou absoluto
required:
- resolution
parameters:
  resolution:
    unit: '1'
    kind: characteristic
    description: Pulsos por volta ou passos por volta
  bits:
    unit: bit
    kind: characteristic
    description: Resolução (absoluto)
  f_max:
    unit: kHz
    kind: characteristic
    description: Frequência máxima de saída
  speed:
    unit: rpm
    kind: max_rating
    description: Rotação máxima
  IL:
    unit: mA
    kind: max_rating
    description: Corrente de carga por canal
  shaft:
    unit: mm
    kind: geometry
    description: Diâmetro do eixo
  VS:
    unit: V
    kind: characteristic
    description: Tensão de alimentação (faixa)
  IS:
    unit: mA
    kind: characteristic
    description: Consumo de corrente sem carga
  Top:
    unit: °C
    kind: thermal
    description: 'Temperatura de operação (faixa: mín. e máx.)'
  Tstg:
    unit: °C
    kind: thermal
    description: Temperatura de armazenamento (faixa)
attributes:
  saida: Tipo de saída (PNP, NPN, NA, NF, push-pull, 4-20 mA, 0-10 V, IO-Link...)
  conexao: Conexão elétrica (cabo, conector M8/M12...)
  invólucro: Invólucro, rosca e material
  grau_protecao: Grau de proteção (IP) declarado
  certificacoes: Certificações e aprovações (UL, CE, ATEX...)
  tipo: Tipo (incremental, absoluto monovolta ou multivoltas, fio)
  interface: Interface (HTL, TTL, SSI, BiSS...)
