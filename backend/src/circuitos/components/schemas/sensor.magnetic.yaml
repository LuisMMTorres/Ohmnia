category: sensor.magnetic
schema_version: '1.0'
description: Sensor magnético de efeito Hall ou magnetorresistivo (CI linear ou chave)
required: []
parameters:
  sensitivity:
    unit: mV/mT
    kind: characteristic
    description: Sensibilidade (linear)
  B_op:
    unit: mT
    kind: characteristic
    description: Campo de operação (chave)
  B_rel:
    unit: mT
    kind: characteristic
    description: Campo de liberação (chave)
  B_range:
    unit: mT
    kind: characteristic
    description: Faixa de campo linear
  V_q:
    unit: V
    kind: characteristic
    description: Tensão de saída em campo nulo
  bandwidth:
    unit: kHz
    kind: characteristic
    description: Banda
  VS:
    unit: V
    kind: characteristic
    description: Tensão de alimentação (faixa)
  IS:
    unit: mA
    kind: characteristic
    description: Consumo de corrente sem carga
  IL:
    unit: mA
    kind: max_rating
    description: Corrente de carga máxima da saída
  Vdrop:
    unit: V
    kind: characteristic
    description: Queda de tensão na saída ligada
  f_sw:
    unit: Hz
    kind: characteristic
    description: Frequência máxima de comutação
  Ir:
    unit: mA
    kind: characteristic
    description: Corrente residual da saída desligada
  Top:
    unit: °C
    kind: thermal
    description: 'Temperatura de operação (faixa: mín. e máx.)'
  Tstg:
    unit: °C
    kind: thermal
    description: Temperatura de armazenamento (faixa)
attributes:
  saida: Tipo de saída (PNP, NPN, NA, NF, push-pull, 4-20 mA, 0-10 V, IO-Link...)
  conexao: Conexão elétrica (cabo, conector M8/M12...)
  invólucro: Invólucro, rosca e material
  encapsulamento: Encapsulamento
