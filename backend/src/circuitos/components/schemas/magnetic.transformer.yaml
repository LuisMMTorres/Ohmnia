category: magnetic.transformer
schema_version: '1.0'
description: Transformador de força, de pulso ou de corrente
required: []
parameters:
  V_pri:
    unit: V
    kind: characteristic
    description: Tensão do primário
  V_sec:
    unit: V
    kind: characteristic
    description: Tensão do secundário
  S_rated:
    unit: VA
    kind: max_rating
    description: Potência nominal
  f:
    unit: Hz
    kind: characteristic
    description: Frequência de operação
  ratio:
    unit: '1'
    kind: characteristic
    description: Relação de espiras
  V_iso:
    unit: V
    kind: max_rating
    description: Isolação entre enrolamentos
  Top:
    unit: °C
    kind: thermal
    description: 'Temperatura de operação (faixa: mín. e máx.)'
  Tstg:
    unit: °C
    kind: thermal
    description: Temperatura de armazenamento (faixa)
  I_sec:
    unit: A
    kind: max_rating
    description: Corrente nominal do secundário
  regulation:
    unit: '%'
    kind: characteristic
    description: Regulação de tensão (vazio a plena carga)
  P_sc:
    unit: W
    kind: characteristic
    description: Perdas em curto-circuito (no cobre, corrente nominal)
  P_0:
    unit: W
    kind: characteristic
    description: Perdas a vazio (no ferro)
  u_k:
    unit: '%'
    kind: characteristic
    description: Tensão de curto-circuito
  efficiency:
    unit: '%'
    kind: characteristic
    description: Rendimento a plena carga
attributes:
  aplicacao: Aplicação (força, pulso, corrente, isolamento)
  fases: Número de fases
  ligacao: Grupo de ligação (ex. Dyn5)
