category: sensor.current
schema_version: '1.0'
description: Sensor de corrente (Hall malha aberta ou fechada, shunt, TC, CI)
required:
- I_PN
parameters:
  I_PN:
    unit: A
    kind: characteristic
    description: Corrente primária nominal (eficaz)
  I_PM:
    unit: A
    kind: max_rating
    description: Faixa de medição (pico)
  sensitivity:
    unit: mV/A
    kind: characteristic
    description: Sensibilidade (saída em tensão)
  ratio:
    unit: '1'
    kind: characteristic
    description: 'Relação de conversão (saída em corrente, ex.: 1:1000)'
  I_SN:
    unit: mA
    kind: characteristic
    description: Corrente secundária nominal
  R_M:
    unit: ohm
    kind: characteristic
    description: Resistor de medida (faixa)
  accuracy:
    unit: '%'
    kind: characteristic
    description: Exatidão
  linearity:
    unit: '%'
    kind: characteristic
    description: Erro de linearidade
  V_offset:
    unit: mV
    kind: characteristic
    description: Offset
  bandwidth:
    unit: kHz
    kind: characteristic
    description: Banda (-1 ou -3 dB)
  t_resp:
    unit: us
    kind: characteristic
    description: Tempo de resposta
  R_primary:
    unit: mohm
    kind: characteristic
    description: Resistência do primário ou do shunt
  V_iso:
    unit: V
    kind: max_rating
    description: Isolação
  VS:
    unit: V
    kind: characteristic
    description: Tensão de alimentação (faixa)
  IS:
    unit: mA
    kind: characteristic
    description: Consumo de corrente sem carga
  Top:
    unit: °C
    kind: thermal
    description: 'Temperatura de operação (faixa: mín. e máx.)'
  Tstg:
    unit: °C
    kind: thermal
    description: Temperatura de armazenamento (faixa)
attributes:
  principio: Princípio (Hall malha aberta, malha fechada, fluxgate, TC, shunt)
  saida: Saída
  montagem: Montagem
