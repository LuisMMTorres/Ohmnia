category: sensor.position
schema_version: '1.0'
description: Sensor de posição linear ou angular (potenciométrico, magnetostritivo, LVDT, de fio)
required:
- range
parameters:
  range:
    unit: mm
    kind: characteristic
    description: Curso de medição (faixa da série)
  linearity:
    unit: '%'
    kind: characteristic
    description: Linearidade
  resolution:
    unit: mm
    kind: characteristic
    description: Resolução
  repeatability:
    unit: mm
    kind: characteristic
    description: Repetibilidade
  R:
    unit: ohm
    kind: characteristic
    description: Resistência do elemento (potenciométrico)
  speed:
    unit: m/s
    kind: max_rating
    description: Velocidade máxima
  VS:
    unit: V
    kind: characteristic
    description: Tensão de alimentação (faixa)
  IS:
    unit: mA
    kind: characteristic
    description: Consumo de corrente sem carga
  I_out:
    unit: mA
    kind: characteristic
    description: Saída em corrente
  V_out:
    unit: V
    kind: characteristic
    description: Saída em tensão
  Top:
    unit: °C
    kind: thermal
    description: 'Temperatura de operação (faixa: mín. e máx.)'
  Tstg:
    unit: °C
    kind: thermal
    description: Temperatura de armazenamento (faixa)
attributes:
  saida: Tipo de saída (PNP, NPN, NA, NF, push-pull, 4-20 mA, 0-10 V, IO-Link...)
  conexao: Conexão elétrica (cabo, conector M8/M12...)
  invólucro: Invólucro, rosca e material
  grau_protecao: Grau de proteção (IP) declarado
  certificacoes: Certificações e aprovações (UL, CE, ATEX...)
  principio: Princípio de medição
