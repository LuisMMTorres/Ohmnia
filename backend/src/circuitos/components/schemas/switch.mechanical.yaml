category: switch.mechanical
schema_version: '1.0'
description: Chave, botão, interruptor ou encoder mecânico
required: []
parameters:
  I_rated:
    unit: A
    kind: max_rating
    description: Corrente nominal
  V_rated:
    unit: V
    kind: max_rating
    description: Tensão nominal
  R_contact:
    unit: ohm
    kind: characteristic
    description: Resistência de contato
  R_iso:
    unit: ohm
    kind: characteristic
    description: Resistência de isolação
  V_diel:
    unit: V
    kind: max_rating
    description: Rigidez dielétrica
  life:
    unit: '1'
    kind: characteristic
    description: Vida (operações)
  force:
    unit: N
    kind: characteristic
    description: Força de acionamento
  pulses:
    unit: '1'
    kind: characteristic
    description: Pulsos por volta (encoder)
  Top:
    unit: °C
    kind: thermal
    description: 'Temperatura de operação (faixa: mín. e máx.)'
  Tstg:
    unit: °C
    kind: thermal
    description: Temperatura de armazenamento (faixa)
attributes:
  tipo: Tipo (táctil, alavanca, gangorra, rotativa, fim de curso, encoder...)
  contatos: Arranjo de contatos
  grau_protecao: Grau de proteção (IP) declarado
  certificacoes: Certificações e aprovações (UL, CE, ATEX...)
