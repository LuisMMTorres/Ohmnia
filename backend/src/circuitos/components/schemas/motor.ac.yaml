category: motor.ac
schema_version: '1.0'
description: Motor de indução ou motor CA
required: []
parameters:
  P_rated:
    unit: kW
    kind: max_rating
    description: Potência nominal
  V_rated:
    unit: V
    kind: characteristic
    description: Tensão nominal
  I_rated:
    unit: A
    kind: characteristic
    description: Corrente nominal
  f:
    unit: Hz
    kind: characteristic
    description: Frequência
  n_rated:
    unit: rpm
    kind: characteristic
    description: Rotação nominal
  efficiency:
    unit: '%'
    kind: characteristic
    description: Rendimento
  pf:
    unit: '1'
    kind: characteristic
    description: Fator de potência
  T_rated:
    unit: N*m
    kind: characteristic
    description: Torque nominal
  Ip_In:
    unit: '1'
    kind: characteristic
    description: Relação corrente de partida/nominal
  Tp_Tn:
    unit: '1'
    kind: characteristic
    description: Relação torque de partida/nominal
  Top:
    unit: °C
    kind: thermal
    description: 'Temperatura de operação (faixa: mín. e máx.)'
  Tstg:
    unit: °C
    kind: thermal
    description: Temperatura de armazenamento (faixa)
  poles:
    unit: '1'
    kind: characteristic
    description: Número de polos
  I_0:
    unit: A
    kind: characteristic
    description: Corrente a vazio
  I_lr:
    unit: A
    kind: characteristic
    description: Corrente com rotor bloqueado
  Tmax_Tn:
    unit: '1'
    kind: characteristic
    description: Relação conjugado máximo/nominal
  slip:
    unit: '%'
    kind: characteristic
    description: Escorregamento nominal
  J:
    unit: kg*m**2
    kind: characteristic
    description: Momento de inércia do rotor
  SF:
    unit: '1'
    kind: characteristic
    description: Fator de serviço
attributes:
  carcaca: Carcaça
  classe: Classe de rendimento e isolamento
  grau_protecao: Grau de proteção (IP) declarado
  certificacoes: Certificações e aprovações (UL, CE, ATEX...)
  categoria: Categoria de partida (NEMA A/B/C/D, IEC N/H)
  ligacao: Tensões e ligações (número de cabos)
