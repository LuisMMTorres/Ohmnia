category: board.mcu
schema_version: '1.0'
description: Placa de microcontrolador ou módulo de desenvolvimento
required: []
parameters:
  VS:
    unit: V
    kind: characteristic
    description: Alimentação de entrada (faixa)
  V_io:
    unit: V
    kind: characteristic
    description: Tensão de E/S
  I_io:
    unit: mA
    kind: max_rating
    description: Corrente máxima por pino
  f_clk:
    unit: MHz
    kind: characteristic
    description: Frequência do relógio
  flash:
    unit: kB
    kind: geometry
    description: Memória de programa
  ram:
    unit: kB
    kind: geometry
    description: Memória RAM
  gpio:
    unit: '1'
    kind: geometry
    description: Pinos de E/S digitais
  adc_ch:
    unit: '1'
    kind: geometry
    description: Canais analógicos
  adc_bits:
    unit: bit
    kind: characteristic
    description: Resolução do A/D
  pwm_ch:
    unit: '1'
    kind: geometry
    description: Canais PWM
  Top:
    unit: °C
    kind: thermal
    description: 'Temperatura de operação (faixa: mín. e máx.)'
  Tstg:
    unit: °C
    kind: thermal
    description: Temperatura de armazenamento (faixa)
attributes:
  microcontrolador: Microcontrolador
  comunicacao: Comunicação (USB, Wi-Fi, Bluetooth, CAN...)
