category: actuator.valve
schema_version: '1.0'
description: Válvula (solenoide, proporcional, de controle) ou atuador de válvula
required: []
parameters:
  V_coil:
    unit: V
    kind: characteristic
    description: Tensão da bobina ou do atuador
  P_coil:
    unit: W
    kind: characteristic
    description: Potência da bobina
  P_max:
    unit: bar
    kind: max_rating
    description: Pressão máxima de operação
  Kv:
    unit: m^3/h
    kind: characteristic
    description: Coeficiente de vazão Kv/Kvs
  DN:
    unit: mm
    kind: geometry
    description: Diâmetro nominal
  torque:
    unit: N*m
    kind: max_rating
    description: Torque do atuador
  t_run:
    unit: s
    kind: characteristic
    description: Tempo de curso
  I_in:
    unit: mA
    kind: characteristic
    description: Sinal de comando em corrente
  V_in:
    unit: V
    kind: characteristic
    description: Sinal de comando em tensão
  Top:
    unit: °C
    kind: thermal
    description: 'Temperatura de operação (faixa: mín. e máx.)'
  Tstg:
    unit: °C
    kind: thermal
    description: Temperatura de armazenamento (faixa)
attributes:
  tipo: Tipo (2/2 vias, 3/2, 5/2, proporcional, borboleta, esfera...)
  comando: Comando (on-off, 0-10 V, 4-20 mA, ponto flutuante)
  grau_protecao: Grau de proteção (IP) declarado
  certificacoes: Certificações e aprovações (UL, CE, ATEX...)
