IF(AV): {aliases: [IO, I(AV), IFAV, IF(AV), IO(AV)], phrases: [average rectified forward current, average forward current, average rectified output current]}
IFSM: {aliases: [IFSM, IFSM(surge)], phrases: [peak forward surge current, non-repetitive peak forward surge, forward surge current]}
IFRM: {phrases: [repetitive peak forward current]}
I2t: {aliases: [I2t, I²t, i2t], phrases: [current squared time, rating for fusing]}
VF: {aliases: [VF, VFM, VF(max)], phrases: [forward voltage, instantaneous forward voltage, maximum forward voltage]}
IR: {aliases: [IR, IRM(DC)], phrases: [reverse current, reverse leakage current, dc reverse current]}
trr: {aliases: [trr, tRR, t rr], phrases: [reverse recovery time]}
Qrr: {phrases: [reverse recovery charge, recovered charge]}
Cj: {aliases: [CJ, Cj, CT, Ctot, CD], phrases: [junction capacitance, diode capacitance, typical junction capacitance]}
V(BR): {aliases: [V(BR), VBR, V(BR)R], phrases: [breakdown voltage]}
VZ: {aliases: [VZ, Vz, VZ(nom)], phrases: [zener voltage]}
IZT: {phrases: [test current]}
ZZT: {aliases: [ZZT, ZZ, rZT, ZZT@IZT], phrases: [dynamic impedance, zener impedance]}
