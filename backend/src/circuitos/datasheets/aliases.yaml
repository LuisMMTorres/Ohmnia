# How parameters are printed in datasheets, for the rule-based mapper (datasheets/mapping.py).
#
# Every schema symbol is already its own alias ("VRRM", "IF(AV)", "RDS(on)"); this file adds the
# other spellings. Matching ignores spaces and case, so "V RRM" (subscript as separate text) and
# "Vrrm" match "VRRM". Greek letters are spelled out (θ → th, ψ → psi) before comparison.
#
#   aliases:  symbols printed in the "Symbol" column
#   phrases:  words of the "Parameter" column, used only when no symbol is found on the row
#   range:    upper | lower, for rows that give a range ("-65 to +175 °C")
#
# This is about *finding* a value. Every value found still enters as "extraido" and needs the
# user's review before the component can be released (rule 5).

Tj_max: {aliases: [TJ, Tj, TJM, Tvj, TJ max, TJ(max), Tjmax], phrases: [operating junction temperature, junction temperature], range: upper}
Tj_min: {aliases: [TJ, Tj, Tvj], phrases: [operating junction temperature], range: lower}
Tstg_max: {aliases: [Tstg, TSTG, Ts], phrases: [storage temperature], range: upper}
Rth_ja: {aliases: [RθJA, RthJA, Rth(j-a), RthJ-A, θJA, Rth j-a, RJA], phrases: [junction to ambient, junction-to-ambient]}
Rth_jc: {aliases: [RθJC, RthJC, Rth(j-c), RthJ-C, θJC, Rth j-c, RJC], phrases: [junction to case, junction-to-case]}
Rth_jl: {aliases: [RθJL, RthJL, Rth(j-l), θJL, RJL], phrases: [junction to lead, junction-to-lead]}
Rth_cs: {aliases: [RθCS, RthCS, Rth(c-s), θCS, RthCH], phrases: [case to sink, case-to-sink, case to heatsink]}
Rth_sa: {aliases: [RθSA, RthSA, Rth(s-a)], phrases: [sink to ambient, heatsink to ambient]}
Psi_jc: {aliases: [ΨJC, PsiJC, ψJT]}
Ptot: {aliases: [PD, Pd, PTOT, Ptot, P tot, PD(max)], phrases: [total power dissipation, power dissipation, total device dissipation]}
Ptot_derating: {phrases: [derate above, linear derating factor, derating factor]}
Pd_max: {aliases: [PD, Pd], phrases: [power dissipation]}

