services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      CIRCUITOS_SIM_WORKERS: "2"
  # Front-end with hot reload during development (proxy /api → app:8000):
  #   docker compose --profile dev up
  frontend-dev:
    profiles: ["dev"]
    image: node:22-bookworm-slim
    working_dir: /app
    environment:
      API_TARGET: "http://app:8000"
    command: sh -c "npm ci && npx vite --host 0.0.0.0"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on: [app]
